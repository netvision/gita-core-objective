  <script>
  const DATA={"title":{"hi":"परिस्थिति का स्वरूप एवं प्रभाव","en":"The Nature and Effect of Circumstance"},"desc":{"hi":"सुख-दुःख परिस्थिति में नहीं; प्रतिक्रिया हमारे भीतर जन्मती है।","en":"Pleasure and pain are not in circumstance; the response arises within us."},"slides":[{"type":"title","title":{"hi":"परिस्थिति का स्वरूप एवं प्रभाव","en":"The Nature and Effect of Circumstance"},"lead":{"hi":"निर्णय परिस्थिति के अधीन नहीं—विवेक के प्रकाश में हो।","en":"Let decisions arise not under circumstance, but in the light of discernment."},"tag":{"hi":"पाठ 02 · तितिक्षा से समता","en":"Lesson 02 · From endurance to equanimity"},"cue":{"hi":"पिछले पाठ से जोड़ें: अर्जुन का निर्णय परिस्थिति के प्रभाव में था।","en":"Connect to the previous lesson: Arjuna’s decision was under the influence of circumstance."}},{"title":{"hi":"परिस्थितियाँ आती-जाती हैं","en":"Circumstances come and go"},"tag":{"hi":"गीता 2.14–15","en":"Gita 2.14–15"},"verse":["मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः ।","आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत ॥ २.१४ ॥","यं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ ।","समदुःखसुखं धीरं सोऽमृतत्वाय कल्पते ॥ २.१५ ॥"],"meaning":{"hi":"इन्द्रिय-संयोग से शीत-उष्ण, सुख-दुःख आते हैं; वे अनित्य हैं। जो उनसे विचलित नहीं होता और सुख-दुःख में सम रहता है, वह अमृतत्व का पात्र है।","en":"Sense-contact produces heat and cold, pleasure and pain; these are impermanent. One who remains undisturbed and equal in pleasure and pain is fit for immortality."},"cue":{"hi":"“तितिक्षा” को दबाना नहीं, आने-जाने वाले प्रभाव को देखकर सह लेना बताएँ।","en":"Explain titiksha not as suppression, but as patiently seeing a passing influence."}},{"title":{"hi":"वर्षा एक—अनुभव दो","en":"One rain, two experiences"},"lead":{"hi":"वर्षा किसान को प्रसन्न और कुम्हार को दुःखी कर सकती है। सुख या दुःख वर्षा में नहीं—दोनों की अलग चाह में है।","en":"The same rain may delight a farmer and distress a potter. Joy and sorrow are not in the rain, but in their different wants."},"tag":{"hi":"स्थिति ≠ आन्तरिक प्रतिक्रिया","en":"Situation ≠ inner response"},"side":{"kind":"cards","items":[{"h":{"hi":"अनुकूल","en":"Favourable"},"p":{"hi":"चाहा हुआ हो जाए, अनचाहा न हो।","en":"What is wanted happens; what is unwanted does not."}},{"h":{"hi":"प्रतिकूल","en":"Adverse"},"p":{"hi":"चाहा हुआ न हो, अनचाहा हो जाए।","en":"What is wanted does not happen; what is unwanted does."}}]},"cue":{"hi":"पूछें: क्या वर्षा ने पक्ष चुना था? इससे परिस्थिति और प्रतिक्रिया अलग दिखती हैं।","en":"Ask whether the rain chose a side. This separates circumstance from reaction."}},{"title":{"hi":"यह भी चला जाएगा","en":"This too shall pass"},"tag":{"hi":"अनित्यता का स्मरण","en":"Remember impermanence"},"lead":{"hi":"दुःख में यह वाक्य धैर्य देता है; सुख में अहंकार को रोकता है। अनुकूल और प्रतिकूल—दोनों प्रवाह हैं।","en":"In sorrow, the phrase gives patience; in pleasure, it restrains pride. Favourable and adverse conditions are both in flux."},"side":{"kind":"story","quote":{"hi":"यह भी चला जाएगा।","en":"This too shall pass."},"text":{"hi":"राजा ने इसे अंगूठी पर अंकित कराया—अकाल में आश्वासन, समृद्धि में संयम।","en":"A king engraved it on his ring—consolation in famine, restraint in prosperity."}},"cue":{"hi":"श्रोताओं को अपनी स्थायी मान ली गई किसी वस्तु, पद या संबंध पर विचार करने दें।","en":"Invite listeners to consider a possession, status, or relationship they assume will last."}},{"title":{"hi":"समता ही अमृत है","en":"Equanimity is immortality"},"lead":{"hi":"सम्मान–अपमान, सुख–दुःख, जय–पराजय और लाभ–हानि में सम रहना—यही भीतर उस तत्त्व की अभिव्यक्ति है जो परिस्थिति से नहीं मरता।","en":"To remain equal in honour and insult, pleasure and pain, victory and defeat, gain and loss—this manifests what circumstance cannot destroy."},"tag":{"hi":"अचाह · न पाने की माँग, न खोने का भय","en":"Non-wanting · no demand to gain, no fear of loss"},"side":{"kind":"story","quote":{"hi":"समता ही अमृत है।","en":"Equanimity itself is immortality."},"text":{"hi":"युवा साधक सम्मान में प्रसन्न और अपमान में टूट गया; ऋषि ने दिखाया—अमरता प्रतिक्रिया से परे समता में प्रकट होती है।","en":"A young seeker rose with honour and collapsed under insult; the sage showed that immortality appears as equanimity beyond reaction."}},"cue":{"hi":"“अचाह” को निष्क्रियता नहीं, परिणाम पर अपनी माँग छोड़ना स्पष्ट करें।","en":"Clarify non-wanting as relinquishing one’s demand upon outcomes, not passivity."}},{"type":"reflect","title":{"hi":"परिस्थिति को आते-जाते देखें","en":"See circumstance come and go"},"tag":{"hi":"मनन · अभ्यास","en":"Reflect · Practise"},"prompts":[{"hi":"क्या कोई वस्तु, व्यक्ति, पद या परिस्थिति सदा साथ रही है?","en":"Has any object, person, status, or circumstance remained forever?"},{"hi":"एक ही घटना पर दो लोगों की प्रतिक्रिया अलग क्यों होती है?","en":"Why do two people react differently to the same event?"},{"hi":"अगली अनुकूल या प्रतिकूल घटना में कहें—“यह भी चला जाएगा।”","en":"At the next favourable or adverse event, remember: “This too shall pass.”"}],"cue":{"hi":"अन्तिम पंक्ति को सामूहिक अभ्यास की तरह धीरे बोलवाएँ।","en":"Invite everyone to say the final line slowly as a shared practice."}}]}, CHAPTER=2;

  const text=v=>typeof v==='string'?v:(v?.[lang()]||'');
  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return '<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='equation')return '<div class="panel equation">'+s.rows.map(r=>'<div class="eq-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'<p><b>'+text(s.foot)+'</b></p></div>';if(s.kind==='story')return '<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title'){core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>'}else if(s.type==='reflect'){core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>'}else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+s.verse.join('<br>')+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return '<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){document.querySelector('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}
  function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}
  function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});
  const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
</script>
</body>
</html>
