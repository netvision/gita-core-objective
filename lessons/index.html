    .library-head{max-width:1180px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}.kicker{color:var(--saffron);font-size:.77rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase}.library h1{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,6vw,5.8rem);line-height:1;margin:.2em 0 .13em}.intro{max-width:700px;color:var(--muted);font-size:clamp(1rem,1.4vw,1.25rem);line-height:1.65;margin:0}.lang-switch{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.35)}.lang-switch button{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:700}.lang-switch button.active{background:var(--deep);color:#fff}

  <script>
  const L=[
    {title:{hi:'मोह',en:'Attachment & Delusion'},desc:{hi:'संबंध, चाह और संदेह—निर्णय को क्या संचालित करता है?',en:'Relationships, wanting, and doubt—what drives a decision?'},slides:[
      {type:'title',title:{hi:'मोह',en:'Attachment & Delusion'},lead:{hi:'जब संबंध और सिद्धान्त आमने-सामने हों, तब निर्णय की कसौटी क्या हो?',en:'When relationship and principle stand opposed, what should decide our action?'},tag:{hi:'पाठ 01 · अर्जुन-विषाद',en:'Lesson 01 · Arjuna’s crisis'},cue:{hi:'आरम्भ में “मोह” को केवल भावुकता नहीं, निर्णय को धुँधला करने वाली आसक्ति के रूप में रखें।',en:'Frame attachment not merely as emotion, but as attachment that clouds judgment.'}},
      {title:{hi:'संबंध या सिद्धान्त?',en:'Relationship or principle?'},lead:{hi:'दुर्योधन द्रोणाचार्य को विपक्ष के उन्हीं योद्धाओं की याद दिलाता है जिन्हें वे भली-भाँति जानते थे। उसे आशंका थी—स्नेह कहीं कर्तव्य पर भारी न पड़ जाए।',en:'Duryodhana reminds Dronacharya of warriors he already knew. His concern was that affection might outweigh duty.'},tag:{hi:'प्रसंग · अध्याय 1, श्लोक 3–8',en:'Context · Chapter 1, verses 3–8'},side:{kind:'cards',items:[{h:{hi:'परिस्थिति',en:'The situation'},p:{hi:'प्रिय व्यक्ति विरोधी पक्ष में भी हो सकता है।',en:'A loved person may stand on the opposing side.'}},{h:{hi:'निर्णय',en:'The decision'},p:{hi:'प्राथमिकता किसे—संबंध को या सिद्धान्त को?',en:'Which takes priority—relationship or principle?'}}]},cue:{hi:'श्रोताओं से तुरंत उत्तर न लें; उन्हें अपने जीवन की किसी ऐसी स्थिति को याद करने दें।',en:'Do not seek an instant answer; let listeners recall a similar conflict in their own lives.'}},
      {title:{hi:'चिन्ता और शोक की जड़',en:'The root of anxiety and grief'},lead:{hi:'अर्जुन राज्य चाहता है, पर स्वजनों का विनाश नहीं। एक ही चाह के दो चेहरे हैं।',en:'Arjuna wants the kingdom, but not the destruction of his kin. One wanting has two faces.'},tag:{hi:'प्रसंग · अध्याय 1, श्लोक 22–25',en:'Context · Chapter 1, verses 22–25'},side:{kind:'equation',rows:[[{hi:'जो नहीं है',en:'What is absent'},{hi:'मिल जाए',en:'must be gained'}],[{hi:'जो है',en:'What is present'},{hi:'नष्ट न हो',en:'must not be lost'}]],foot:{hi:'प्राप्ति की इच्छा + खोने का भय = चाह',en:'Desire to gain + fear of loss = wanting'}},cue:{hi:'समझाएँ कि परिस्थिति नहीं, उससे जुड़ी अपनी चाह भीतर चिन्ता पैदा करती है।',en:'Emphasize that anxiety arises from our wanting attached to the situation—not from the situation itself.'}},
      {title:{hi:'संदेह बार-बार तर्क देता है',en:'Doubt keeps arguing'},lead:{hi:'अर्जुन युद्ध न करने के निर्णय के पक्ष में अनेक तर्क देता है। जब निर्णय दृढ़ हो, उसे बार-बार प्रमाणित करने की आवश्यकता नहीं रहती।',en:'Arjuna offers many arguments for not fighting. A truly firm decision does not need repeated self-justification.'},tag:{hi:'प्रसंग · अध्याय 1, श्लोक 38–44',en:'Context · Chapter 1, verses 38–44'},side:{kind:'story',quote:{hi:'अधिक तर्क कभी-कभी अधिक स्पष्टता नहीं—भीतर के संदेह का संकेत होते हैं।',en:'More arguments do not always mean more clarity; sometimes they reveal inner doubt.'},text:{hi:'निर्णय के पीछे भय, आसक्ति या सत्य—किसकी आवाज़ है?',en:'Behind the decision, whose voice is speaking: fear, attachment, or truth?'}},cue:{hi:'यहाँ तर्क-विरोध नहीं करें; केवल आत्म-औचित्य और स्पष्ट विवेक में भेद रखें।',en:'Do not oppose reasoning; distinguish self-justification from clear discernment.'}},
      {type:'reflect',title:{hi:'अपने निर्णय को देखें',en:'Examine your decision'},tag:{hi:'मनन · संवाद',en:'Reflect · Discuss'},prompts:[{hi:'कब संबंध और सिद्धान्त में टकराव हुआ?',en:'When did relationship and principle conflict for you?'},{hi:'आज की किसी चिन्ता में—क्या पाने की इच्छा या खोने का भय है?',en:'In a current worry, what do you wish to gain or fear losing?'},{hi:'किस निर्णय को आप बार-बार उचित ठहरा रहे हैं?',en:'Which decision are you repeatedly trying to justify?'}],cue:{hi:'एक प्रश्न चुनें और दो मिनट मौन दें; फिर इच्छुक लोगों से अनुभव साझा करवाएँ।',en:'Choose one question, allow two minutes of silence, then invite voluntary sharing.'}}
    ]},
    {title:{hi:'परिस्थिति का स्वरूप एवं प्रभाव',en:'The Nature and Effect of Circumstance'},desc:{hi:'सुख-दुःख परिस्थिति में नहीं; प्रतिक्रिया हमारे भीतर जन्मती है।',en:'Pleasure and pain are not in circumstance; the response arises within us.'},slides:[
      {type:'title',title:{hi:'परिस्थिति का स्वरूप एवं प्रभाव',en:'The Nature and Effect of Circumstance'},lead:{hi:'निर्णय परिस्थिति के अधीन नहीं—विवेक के प्रकाश में हो।',en:'Let decisions arise not under circumstance, but in the light of discernment.'},tag:{hi:'पाठ 02 · तितिक्षा से समता',en:'Lesson 02 · From endurance to equanimity'},cue:{hi:'पिछले पाठ से जोड़ें: अर्जुन का निर्णय परिस्थिति के प्रभाव में था।',en:'Connect to the previous lesson: Arjuna’s decision was under the influence of circumstance.'}},
      {title:{hi:'परिस्थितियाँ आती-जाती हैं',en:'Circumstances come and go'},tag:{hi:'गीता 2.14–15',en:'Gita 2.14–15'},verse:['मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः ।','आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत ॥ २.१४ ॥','यं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ ।','समदुःखसुखं धीरं सोऽमृतत्वाय कल्पते ॥ २.१५ ॥'],meaning:{hi:'इन्द्रिय-संयोग से शीत-उष्ण, सुख-दुःख आते हैं; वे अनित्य हैं। जो उनसे विचलित नहीं होता और सुख-दुःख में सम रहता है, वह अमृतत्व का पात्र है।',en:'Sense-contact produces heat and cold, pleasure and pain; these are impermanent. One who remains undisturbed and equal in pleasure and pain is fit for immortality.'},cue:{hi:'“तितिक्षा” को दबाना नहीं, आने-जाने वाले प्रभाव को देखकर सह लेना बताएँ।',en:'Explain titiksha not as suppression, but as patiently seeing a passing influence.'}},
      {title:{hi:'वर्षा एक—अनुभव दो',en:'One rain, two experiences'},lead:{hi:'वर्षा किसान को प्रसन्न और कुम्हार को दुःखी कर सकती है। सुख या दुःख वर्षा में नहीं—दोनों की अलग चाह में है।',en:'The same rain may delight a farmer and distress a potter. Joy and sorrow are not in the rain, but in their different wants.'},tag:{hi:'स्थिति ≠ आन्तरिक प्रतिक्रिया',en:'Situation ≠ inner response'},side:{kind:'cards',items:[{h:{hi:'अनुकूल',en:'Favourable'},p:{hi:'चाहा हुआ हो जाए, अनचाहा न हो।',en:'What is wanted happens; what is unwanted does not.'}},{h:{hi:'प्रतिकूल',en:'Adverse'},p:{hi:'चाहा हुआ न हो, अनचाहा हो जाए।',en:'What is wanted does not happen; what is unwanted does.'}}]},cue:{hi:'पूछें: क्या वर्षा ने पक्ष चुना था? इससे परिस्थिति और प्रतिक्रिया अलग दिखती हैं।',en:'Ask whether the rain chose a side. This separates circumstance from reaction.'}},
      {title:{hi:'यह भी चला जाएगा',en:'This too shall pass'},tag:{hi:'अनित्यता का स्मरण',en:'Remember impermanence'},lead:{hi:'दुःख में यह वाक्य धैर्य देता है; सुख में अहंकार को रोकता है। अनुकूल और प्रतिकूल—दोनों प्रवाह हैं।',en:'In sorrow, the phrase gives patience; in pleasure, it restrains pride. Favourable and adverse conditions are both in flux.'},side:{kind:'story',quote:{hi:'यह भी चला जाएगा।',en:'This too shall pass.'},text:{hi:'राजा ने इसे अंगूठी पर अंकित कराया—अकाल में आश्वासन, समृद्धि में संयम।',en:'A king engraved it on his ring—consolation in famine, restraint in prosperity.'}},cue:{hi:'श्रोताओं को अपनी स्थायी मान ली गई किसी वस्तु, पद या संबंध पर विचार करने दें।',en:'Invite listeners to consider a possession, status, or relationship they assume will last.'}},
      {title:{hi:'समता ही अमृत है',en:'Equanimity is immortality'},lead:{hi:'सम्मान–अपमान, सुख–दुःख, जय–पराजय और लाभ–हानि में सम रहना—यही भीतर उस तत्त्व की अभिव्यक्ति है जो परिस्थिति से नहीं मरता।',en:'To remain equal in honour and insult, pleasure and pain, victory and defeat, gain and loss—this manifests what circumstance cannot destroy.'},tag:{hi:'अचाह · न पाने की माँग, न खोने का भय',en:'Non-wanting · no demand to gain, no fear of loss'},side:{kind:'story',quote:{hi:'समता ही अमृत है।',en:'Equanimity itself is immortality.'},text:{hi:'युवा साधक सम्मान में प्रसन्न और अपमान में टूट गया; ऋषि ने दिखाया—अमरता प्रतिक्रिया से परे समता में प्रकट होती है।',en:'A young seeker rose with honour and collapsed under insult; the sage showed that immortality appears as equanimity beyond reaction.'}},cue:{hi:'“अचाह” को निष्क्रियता नहीं, परिणाम पर अपनी माँग छोड़ना स्पष्ट करें।',en:'Clarify non-wanting as relinquishing one’s demand upon outcomes, not passivity.'}},
      {type:'reflect',title:{hi:'परिस्थिति को आते-जाते देखें',en:'See circumstance come and go'},tag:{hi:'मनन · अभ्यास',en:'Reflect · Practise'},prompts:[{hi:'क्या कोई वस्तु, व्यक्ति, पद या परिस्थिति सदा साथ रही है?',en:'Has any object, person, status, or circumstance remained forever?'},{hi:'एक ही घटना पर दो लोगों की प्रतिक्रिया अलग क्यों होती है?',en:'Why do two people react differently to the same event?'},{hi:'अगली अनुकूल या प्रतिकूल घटना में कहें—“यह भी चला जाएगा।”',en:'At the next favourable or adverse event, remember: “This too shall pass.”'}],cue:{hi:'अन्तिम पंक्ति को सामूहिक अभ्यास की तरह धीरे बोलवाएँ।',en:'Invite everyone to say the final line slowly as a shared practice.'}}
    ]},
    {title:{hi:'नित्य/अनित्य का भेद',en:'Distinguishing the Eternal and Impermanent'},desc:{hi:'जो बदलता है वह दृश्य है; जो परिवर्तन को जानता है, उसका आधार क्या है?',en:'What changes is seen; what is the ground that knows the change?'},slides:[
      {type:'title',title:{hi:'नित्य / अनित्य का भेद',en:'The Eternal / Impermanent'},lead:{hi:'परिवर्तन को देखकर उस अपरिवर्तनशील “है” की ओर मुड़ना, जिसमें सब प्रतीत होता है।',en:'Seeing change, turn toward the unchanging “is-ness” in which everything appears.'},tag:{hi:'पाठ 03 · सत् का विवेक',en:'Lesson 03 · Discerning the real'},cue:{hi:'पिछले पाठ से जोड़ें: परिस्थिति अनित्य है; अब उसके आधार की जाँच है।',en:'Connect to the prior lesson: circumstance is impermanent; now investigate its ground.'}},
      {title:{hi:'सत् और असत् की सीमा',en:'The boundary of real and unreal'},tag:{hi:'गीता 2.16',en:'Gita 2.16'},verse:['नासतो विद्यते भावो नाभावो विद्यते सतः ।','उभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः ॥ २.१६ ॥'],meaning:{hi:'असत् की स्थायी सत्ता नहीं और सत् का अभाव नहीं। तत्त्वदर्शियों ने दोनों की सीमा देखी है। सरल कसौटी: जो है वह बदलता नहीं; जो बदलता है, वह स्थिर रूप से “है” नहीं।',en:'The unreal has no lasting being; the real never ceases to be. Seers discern the limit of both. Put simply: the real does not change; what changes has no stable being.'},cue:{hi:'इसे बौद्धिक नारा न बनाएँ; आगे के अनुभवजन्य उदाहरणों से खोलें।',en:'Do not leave this as an abstract slogan; unfold it through the experiential examples that follow.'}},
      {title:{hi:'अविनाशी आधार',en:'The indestructible ground'},tag:{hi:'गीता 2.17',en:'Gita 2.17'},verse:['अविनाशि तु तद्विद्धि येन सर्वमिदं ततम् ।','विनाशमव्ययस्यास्य न कश्चित्कर्तुमर्हति ॥ २.१७ ॥'],meaning:{hi:'जिससे यह सब व्याप्त है, उसे अविनाशी जानो; उस अव्यय का विनाश कोई नहीं कर सकता। दृश्य बदलता है—“होने” का प्रकाश बना रहता है।',en:'Know as indestructible that by which all this is pervaded; none can destroy the immutable. The seen changes, while the light of being remains.'},cue:{hi:'“है” को किसी वस्तु की तरह न रखें; वह वह आधार है जिसमें वस्तु ज्ञात होती है।',en:'Do not present “is-ness” as another object; it is the ground in which an object is known.'}},
      {title:{hi:'प्रवाह बदलता है—आधार नहीं',en:'The flow changes—the ground does not'},lead:{hi:'नदी का जल, वेग और सामग्री बदलती रहती है; आधार-शिला बनी रहती है। बाल्य, यौवन और वृद्धावस्था बदलते हैं—फिर भी हम कहते हैं, “मैं वही हूँ।”',en:'A river’s water, speed, and contents keep changing; the foundation stone remains. Childhood, youth, and old age change—yet we say, “I am the same.”'},tag:{hi:'दृश्य और द्रष्टा का संकेत',en:'A pointer to the seen and the knower'},side:{kind:'cards',items:[{h:{hi:'बदलता दृश्य',en:'Changing appearance'},p:{hi:'शरीर, अवस्था, परिस्थिति, विचार',en:'Body, stage, circumstance, thought'}},{h:{hi:'निरन्तर जानना',en:'Continuous knowing'},p:{hi:'परिवर्तन की उपस्थिति और अनुपस्थिति—दोनों का साक्षी',en:'Witness of both the presence and absence of change'}}]},cue:{hi:'“मैं वही हूँ” वाक्य पर विराम दें; श्रोता अपने अनुभव में निरन्तरता देखें।',en:'Pause on “I am the same”; let listeners notice continuity in direct experience.'}},
      {title:{hi:'माला में धागा',en:'The thread in a garland'},lead:{hi:'फूल अलग-अलग दिखते हैं; धागा उन्हें एक माला बनाता है। फूल बदले जा सकते हैं—धागे के बिना माला का रूप टिकता नहीं।',en:'Flowers appear distinct; the thread holds them as one garland. Flowers may be replaced, but without the thread the garland does not hold.'},tag:{hi:'संवाद-अभ्यास',en:'Dialogue exercise'},side:{kind:'story',quote:{hi:'दृश्य फूल हैं; “है” वह धागा है जिसमें दृश्य प्रकट है।',en:'Appearances are the flowers; “is-ness” is the thread in which they appear.'},text:{hi:'क्या फूल और धागा एक हैं? क्या फूल अलग हो सकते हैं? क्या धागे के बिना माला रह सकती है?',en:'Are flower and thread the same? Can flowers be separated? Can the garland remain without its thread?'}},cue:{hi:'इन तीन प्रश्नों को क्रम से रखें; निष्कर्ष श्रोताओं से आने दें।',en:'Ask the three questions in sequence and let the conclusion arise from the audience.'}},
      {type:'reflect',title:{hi:'“वृक्ष है” से पहले “है”',en:'Before “the tree is”—notice “is”'},tag:{hi:'अभ्यास · हर 30 मिनट में 2 मिनट',en:'Practice · 2 minutes every 30 minutes'},prompts:[{hi:'पहले वृक्ष को मानकर “यह वृक्ष है” न देखें।',en:'Do not begin by assuming the tree and then saying, “the tree is.”'},{hi:'देखें—“है” के प्रकाश में वृक्ष प्रतीत हो रहा है।',en:'Notice: the tree appears in the light of “is-ness.”'},{hi:'दृश्य से अधिक महत्त्व उसके अपरिवर्तनशील आधार को दें।',en:'Give greater importance to the unchanging ground than to the appearance.'}],cue:{hi:'इसे केवल भाषा-परिवर्तन नहीं, ध्यान की दिशा बदलना बताएँ।',en:'Present this not as wordplay, but as a shift in the direction of attention.'}}
    ]},
    {title:{hi:'उद्देश्य परिवर्तन',en:'Changing the Objective'},desc:{hi:'इच्छा-पूर्ति से समता की ओर—साधक की बुद्धि एक दिशा में कैसे स्थिर हो?',en:'From desire-fulfilment to equanimity—how does a seeker become one-pointed?'},slides:[
      {type:'title',title:{hi:'उद्देश्य परिवर्तन',en:'Changing the Objective'},lead:{hi:'जीवन का लक्ष्य परिस्थिति को अपने अनुकूल करना नहीं—हर परिस्थिति में समता को सुरक्षित रखना हो।',en:'Let life’s objective be not to bend circumstance to preference, but to preserve equanimity in every circumstance.'},tag:{hi:'पाठ 04 · एकनिष्ठ बुद्धि',en:'Lesson 04 · Resolute intelligence'},cue:{hi:'भेद रखें: इच्छाएँ अनेक हो सकती हैं, पर जीवन का उद्देश्य एक दिशा देता है।',en:'Distinguish many desires from the one direction given by an objective.'}},
      {title:{hi:'विवेक से कर्मयोग तक',en:'From discernment to Karma Yoga'},tag:{hi:'गीता 2.39',en:'Gita 2.39'},verse:['एषा तेऽभिहिता सांख्ये बुद्धिर्योगे त्विमां शृणु ।','बुद्ध्या युक्तो यया पार्थ कर्मबन्धं प्रहास्यसि ॥ २.३९ ॥'],meaning:{hi:'अब उस बुद्धि को सुनो जिससे कर्म करते हुए समता बनी रहे और कर्म का बन्धन छूटे—घटना भीतर शुभ-अशुभ प्रभाव छोड़कर हमें बाँधे नहीं।',en:'Now hear the understanding by which equanimity is maintained in action and karmic bondage is relinquished—the event no longer binds through its pleasant or painful inner imprint.'},cue:{hi:'कर्म छोड़ना नहीं; कर्म करते हुए भीतर परिणाम-आधीनता छोड़ना इसका केन्द्र है।',en:'The point is not abandoning action, but relinquishing inner dependence upon its result.'}},
      {title:{hi:'थोड़ी समता भी पूरी है',en:'Even a little equanimity is whole'},tag:{hi:'गीता 2.40',en:'Gita 2.40'},verse:['नेहाभिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते ।','स्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात् ॥ २.४० ॥'],meaning:{hi:'इस साधन का आरम्भ नष्ट नहीं होता, विपरीत फल नहीं देता; थोड़ा-सा अभ्यास भी महान भय से बचाता है।',en:'No beginning on this path is lost, nor does it produce a contrary result; even a little of this practice protects from great fear.'},side:{kind:'story',quote:{hi:'समता थोड़ी भी पूरी है; बड़ी से बड़ी उपलब्धि पूरी होकर भी अधूरी है।',en:'Even a little equanimity is whole; the greatest achievement remains incomplete even when attained.'},text:{hi:'उपलब्धि चली जा सकती है; समता परिस्थिति से स्वतंत्रता का स्वाद देती है।',en:'Achievement can pass away; equanimity gives a taste of freedom from circumstance.'}},cue:{hi:'“छोटा अभ्यास” को कम महत्त्व नहीं, सुरक्षित और संचयी आरम्भ के रूप में रखें।',en:'Present “a little practice” not as insignificant, but as a safe beginning that is never lost.'}},
      {title:{hi:'एक उद्देश्य—एकनिष्ठ बुद्धि',en:'One objective—resolute intelligence'},tag:{hi:'गीता 2.41',en:'Gita 2.41'},verse:['व्यवसायात्मिका बुद्धिरेकेह कुरुनन्दन ।','बहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम् ॥ २.४१ ॥'],meaning:{hi:'निश्चयात्मक बुद्धि एक दिशा में रहती है; अनिश्चयशील बुद्धि की शाखाएँ अनन्त होती हैं। इच्छाएँ अनेक हैं, पर साधक का उद्देश्य—समता—एक है।',en:'Resolute intelligence is one-pointed; the irresolute mind branches endlessly. Desires are many, but the seeker’s objective—equanimity—is one.'},cue:{hi:'व्यस्तता और दिशा में अन्तर बताएँ: अनेक प्रयास भी एक स्पष्ट उद्देश्य के बिना बिखर सकते हैं।',en:'Distinguish activity from direction: many efforts can scatter without a clear objective.'}},
      {title:{hi:'भोग में उलझी बुद्धि',en:'Intelligence absorbed in enjoyment'},tag:{hi:'गीता 2.42–44',en:'Gita 2.42–44'},verse:['भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम् ।','व्यवसायात्मिका बुद्धिः समाधौ न विधीयते ॥ २.४४ ॥'],meaning:{hi:'भोग और ऐश्वर्य में आसक्त, उनसे चित्त हर लिए गए लोगों की बुद्धि आत्मस्थ समता में स्थिर नहीं होती।',en:'For those attached to enjoyment and power, whose attention is carried away by them, resolute intelligence does not become established in inner absorption.'},side:{kind:'cards',items:[{h:{hi:'पुराना उद्देश्य',en:'Old objective'},p:{hi:'अनुकूल पाना, प्रतिकूल से बचना',en:'Gain the favourable; avoid the adverse'}},{h:{hi:'नया उद्देश्य',en:'New objective'},p:{hi:'हर परिणाम में समता सुरक्षित रखना',en:'Preserve equanimity in every outcome'}}]},cue:{hi:'श्लोक 2.42–43 की पूरी चर्चा स्रोत में है; स्क्रीन पर पठनीयता हेतु 2.44 निष्कर्ष के रूप में रखा है।',en:'The source discusses 2.42–43 fully; 2.44 is shown as their concise conclusion for screen readability.'}},
      {title:{hi:'अपने को साधक मानना',en:'Accept oneself as a seeker'},lead:{hi:'उद्देश्य बदलना केवल विचार नहीं—स्वीकृति है: “मैं समता का साधक हूँ।” असाधन को पहचानना भी साधना का भाग है।',en:'Changing the objective is not merely an idea; it is the acceptance, “I am a seeker of equanimity.” Recognising what obstructs practice is part of practice.'},tag:{hi:'साधन बनाम असाधन',en:'Practice versus obstruction'},side:{kind:'cards',items:[{h:{hi:'ज्ञात असत्य',en:'Known untruth'},p:{hi:'जिसे मिथ्या जान लिया, फिर भी न छोड़ा।',en:'What is known as false, yet not relinquished.'}},{h:{hi:'अकरणीय कर्म',en:'What ought not be done'},p:{hi:'विवेक-विरुद्ध कर्म करते रहना।',en:'Continuing to act against discernment.'}},{h:{hi:'अयोग्य आश्रय',en:'Unworthy support'},p:{hi:'जो स्वयं अनित्य है, उसी पर स्थायित्व माँगना।',en:'Demanding permanence from what is itself impermanent.'}}]},cue:{hi:'तीसरे बिन्दु की विस्तृत चर्चा आगे के पाठों में आएगी—यहाँ केवल दिशा दें।',en:'The third point is developed in later lessons; here, give only the direction.'}},
      {type:'reflect',title:{hi:'आज मेरा उद्देश्य क्या है?',en:'What is my objective today?'},tag:{hi:'मनन · संकल्प',en:'Reflect · Resolve'},prompts:[{hi:'इच्छा और उद्देश्य में क्या अन्तर है?',en:'What is the difference between a desire and an objective?'},{hi:'क्या इच्छा-पूर्ति स्थायी रूप से सम्भव है?',en:'Can desire-fulfilment ever be permanent?'},{hi:'क्या मैं अपना उद्देश्य “समता” स्वीकार करने को तैयार हूँ?',en:'Am I ready to accept equanimity as my objective?'}],cue:{hi:'अन्तिम प्रश्न का सार्वजनिक उत्तर आवश्यक नहीं; इसे निजी संकल्प रहने दें।',en:'No public answer is required to the last question; allow it to remain a private resolve.'}}
    ]},
    {title:{hi:'करने योग्य',en:'What Ought to Be Done'},desc:{hi:'कर्म पर अधिकार, फल में समता और दूसरे के अधिकार की रक्षा।',en:'Responsibility for action, equanimity in result, and protecting another’s right.'},slides:[
      {type:'title',title:{hi:'करने योग्य',en:'What Ought to Be Done'},lead:{hi:'कर्म करना है—पर अपनी चाह की पूर्ति के लिए नहीं; विवेक और समता के साथ।',en:'Action is necessary—but not for satisfying one’s demand; act with discernment and equanimity.'},tag:{hi:'पाठ 05 · कर्मयोग का व्यवहार',en:'Lesson 05 · Karma Yoga in practice'},cue:{hi:'पिछले पाठ से जोड़ें: अकरणीय करना असाधन है; अब करणीय और उसकी विधि देखें।',en:'Connect to the prior lesson: doing what ought not be done obstructs practice; now examine right action and its method.'}},
      {title:{hi:'अधिकार केवल कर्म पर',en:'Responsibility is for action alone'},tag:{hi:'गीता 2.47',en:'Gita 2.47'},verse:['कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।','मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥ २.४७ ॥'],meaning:{hi:'अधिकार कर्म पर है, फल पर नहीं। फल को कर्म का हेतु न बनाओ और अकर्म में भी आसक्त न होओ।',en:'Your responsibility is for action, never for its fruits. Do not make the fruit your motive, and do not become attached to inaction.'},cue:{hi:'“अधिकार” को नियंत्रण से अधिक उत्तरदायित्व के अर्थ में खोलें।',en:'Unpack “right” here primarily as responsibility, not control.'}},
      {title:{hi:'एक श्लोक—चार निर्देश',en:'One verse—four directions'},tag:{hi:'गीता 2.47 का व्यवहार',en:'Applying Gita 2.47'},lead:{hi:'कर्मयोग परिणाम को नकारता नहीं; परिणाम पर अपनी माँग और नियंत्रण का भ्रम छोड़ता है।',en:'Karma Yoga does not deny results; it relinquishes our demand upon them and the illusion of control.'},side:{kind:'cards',items:[{h:{hi:'1 · कर्म करो',en:'1 · Act'},p:{hi:'करणीय करो; अकरणीय न करना अधिक महत्त्वपूर्ण।',en:'Do what ought to be done; more importantly, avoid what ought not.'}},{h:{hi:'2 · फल पर अधिकार नहीं',en:'2 · No claim on fruit'},p:{hi:'फल अनुकूल या प्रतिकूल परिस्थिति बनकर आता है।',en:'Fruit arrives as favourable or adverse circumstance.'}},{h:{hi:'3 · फल हेतु न बने',en:'3 · Fruit is not the motive'},p:{hi:'परिस्थिति बदलने या बचाए रखने के लिए कर्म न हो।',en:'Do not act merely to alter or preserve circumstance.'}},{h:{hi:'4 · अकर्म से आसक्ति नहीं',en:'4 · No attachment to inaction'},p:{hi:'“पाना नहीं तो करना क्यों?”—इस भ्रम से बचो।',en:'Avoid the error: “If nothing is mine to gain, why act?”'}}]},cue:{hi:'चारों को क्रम से लें; विशेष जोर “अकरणीय न करना” और “अकर्म से आसक्ति नहीं” पर दें।',en:'Take the four in order; stress refraining from wrong action and avoiding attachment to inaction.'}},
      {title:{hi:'समत्वं योग उच्यते',en:'Equanimity is called Yoga'},tag:{hi:'गीता 2.48',en:'Gita 2.48'},verse:['योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय ।','सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते ॥ २.४८ ॥'],meaning:{hi:'आसक्ति छोड़कर योग में स्थित हो कर्म करो; सिद्धि और असिद्धि में सम रहो—समत्व ही योग है।',en:'Established in Yoga, perform action abandoning attachment; remain equal in success and failure—equanimity is called Yoga.'},cue:{hi:'समता कर्म से पहले की दृष्टि, कर्म के बीच की सजगता और फल के बाद की स्थिति—तीनों में है।',en:'Equanimity belongs before action as vision, during it as awareness, and after it as response.'}},
      {title:{hi:'कर्म का नया मन्त्र',en:'A new maxim for action'},tag:{hi:'स्वार्थ से सेवा की ओर',en:'From self-claim to service'},lead:{hi:'मनुष्य सामान्यतः जो नहीं है उसे पाने और जो है उसे बचाने के लिए कर्म करता है। उद्देश्य समता हो तो दिशा बदलती है।',en:'We commonly act to gain what is absent and retain what is present. When equanimity becomes the objective, the direction changes.'},side:{kind:'story',quote:{hi:'अपने अधिकार का त्याग और दूसरे के अधिकार की रक्षा।',en:'Relinquish one’s own claim; protect the rights of others.'},text:{hi:'अपने संकल्प की पूर्ति नहीं—विवेक-सम्मत सीमा में दूसरे के हित और अधिकार की पूर्ति।',en:'Not fulfilment of one’s demand, but another’s welfare and rights within the limits of discernment.'}},cue:{hi:'“त्याग” को शोषण सहना न समझें; अगली स्लाइड की दो सीमाएँ साथ रखें।',en:'Do not equate relinquishment with accepting exploitation; pair it with the two safeguards on the next slide.'}},
      {title:{hi:'दो सुरक्षा-सीमाएँ',en:'Two safeguards'},lead:{hi:'दूसरे की इच्छा पूरी करना तभी करणीय है जब वह विवेक-विरुद्ध न हो और अपनी सामर्थ्य से बाहर न हो।',en:'Fulfilling another’s wish is appropriate only when it is not against discernment and not beyond one’s capacity.'},tag:{hi:'विवेक · सामर्थ्य · अहिंसा',en:'Discernment · capacity · non-harm'},side:{kind:'cards',items:[{h:{hi:'विवेक',en:'Discernment'},p:{hi:'माँग सही–गलत की कसौटी पर खरी हो।',en:'The request must withstand the test of right and wrong.'}},{h:{hi:'सामर्थ्य',en:'Capacity'},p:{hi:'जो सम्भव नहीं, उसका वचन भी करणीय नहीं।',en:'Do not promise what is genuinely beyond capacity.'}},{h:{hi:'शरीर और मन',en:'Body and mind'},p:{hi:'किसी को शारीरिक या मानसिक हानि न पहुँचे।',en:'Cause neither physical nor mental harm.'}}]},cue:{hi:'यहाँ “दूसरा” निकट परिवार से आरम्भ होकर व्यवहार की पूरी परिधि तक फैलता है।',en:'Here “the other” begins with close family and extends across one’s sphere of interaction.'}},
      {type:'reflect',title:{hi:'पसन्द नहीं—करणीय देखें',en:'Look beyond preference to what ought to be done'},tag:{hi:'आज का अभ्यास',en:'Practice for today'},prompts:[{hi:'अपने अधिकार की माँग छोड़कर किसके उचित अधिकार की रक्षा कर सकता हूँ?',en:'Whose rightful claim can I protect by loosening my own demand?'},{hi:'निर्णय पसन्द–नापसन्द से हो रहा है या करणीय–अकरणीय से?',en:'Is this decision guided by preference, or by what ought and ought not be done?'},{hi:'कर्म और फल—दोनों में समता कैसे बनाए रखूँ?',en:'How can I preserve equanimity through both action and result?'}],cue:{hi:'समापन में तीन सूत्र दोहराएँ: अधिकार-रक्षा, विवेक, समता।',en:'Close by repeating the three anchors: protecting rights, discernment, equanimity.'}}
    ]}
  ];

  const $=s=>document.querySelector(s), lang=()=>document.body.dataset.lang;
  let lesson=null, slide=0, notes=false;
  const text=v=>typeof v==='string'?v:(v?.[lang()]||'');
  function localize(){document.documentElement.lang=lang();document.querySelectorAll('[data-hi]').forEach(e=>e.textContent=e.dataset[lang()]);document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang()));$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';}
  function buildLibrary(){const g=$('#lessonGrid');g.innerHTML='';L.forEach((x,i)=>{const b=document.createElement('button');b.className='lesson-card';b.dataset.no=String(i+1).padStart(2,'0');b.innerHTML=`<span class="card-no">${lang()==='hi'?'पाठ':'LESSON'} ${String(i+1).padStart(2,'0')}</span><h2>${text(x.title)}</h2><p>${text(x.desc)}</p><span class="open-mark">${lang()==='hi'?'आरम्भ करें →':'Begin →'}</span>`;b.onclick=()=>openLesson(i);g.appendChild(b)});localize()}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return`<div class="cards">${s.items.map(i=>`<div class="mini"><b>${text(i.h)}</b><p>${text(i.p)}</p></div>`).join('')}</div>`;if(s.kind==='equation')return`<div class="panel equation">${s.rows.map(r=>`<div class="eq-row"><strong>${text(r[0])}</strong><span>→</span><strong>${text(r[1])}</strong></div>`).join('')}<p><b>${text(s.foot)}</b></p></div>`;if(s.kind==='story')return`<div class="story"><blockquote>${text(s.quote)}</blockquote><p>${text(s.text)}</p></div>`;return''}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title'){core=`<div class="slide-grid"><div><div class="eyebrow">${text(s.tag)}</div><h2>${text(s.title)}</h2><div class="rule"></div><p class="lead">${text(s.lead)}</p></div><div class="title-seal"><strong>${String(lesson+1).padStart(2,'0')}</strong></div></div>`}else if(s.type==='reflect'){core=`<div class="slide-grid single"><div><div class="eyebrow">${text(s.tag)}</div><h2>${text(s.title)}</h2><div class="prompt-list">${s.prompts.map(p=>`<div>${text(p)}</div>`).join('')}</div></div></div>`}else{const v=s.verse?`<div class="verse"><div class="verse-ref">${text(s.tag)}</div><p class="shloka">${s.verse.map((l,n)=>`${l}${n<s.verse.length-1?'<br>':''}`).join('')}</p><p class="meaning">${text(s.meaning)}</p></div>`:'';core=`<div class="slide-grid ${s.side?'':'single'}"><div><div class="eyebrow">${text(s.tag)}</div><h2>${text(s.title)}</h2>${s.lead?`<p class="lead">${text(s.lead)}</p>`:''}${v}</div>${s.side?`<div>${sideHTML(s.side)}</div>`:''}</div>`}return`<section class="slide ${dark?'dark':''} ${i===slide?'active':''}" aria-hidden="${i!==slide}"><span class="folio">${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span>${core}<aside class="notes" ${notes&&i===slide?'':'hidden'}><b>${lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE'}</b>${text(s.cue)}</aside></section>`}
  function renderDeck(){const x=L[lesson];$('#stage').innerHTML=x.slides.map((s,i)=>slideHTML(s,i,x.slides.length)).join('');$('#counter').textContent=`${slide+1} / ${x.slides.length}`;const p=$('#progress');p.innerHTML='';x.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function openLesson(i,replace=false){lesson=i;slide=0;notes=false;$('#library').hidden=true;$('#deck').hidden=false;$('#chrome').hidden=false;renderDeck();const u=new URL(location);u.searchParams.set('lesson',i+1);u.searchParams.set('lang',lang());history[replace?'replaceState':'pushState']({},'',u);document.title=`${text(L[i].title)} — ${lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons'}`}
  function closeDeck(push=true){lesson=null;$('#library').hidden=false;$('#deck').hidden=true;$('#chrome').hidden=true;buildLibrary();const u=new URL(location);u.searchParams.delete('lesson');u.searchParams.set('lang',lang());history[push?'pushState':'replaceState']({},'',u);document.title=lang()==='hi'?'गीता जीवन-पाठ — प्रथम पाँच पाठ':'Gita Life Lessons — First Five Lessons'}
  function go(n){if(lesson===null)return;const max=L[lesson].slides.length-1;if(n<0){closeDeck();return}if(n>max){if(lesson<L.length-1)openLesson(lesson+1);return}slide=n;notes=false;renderDeck()}
  function setLang(l){document.body.dataset.lang=l;localize();lesson===null?buildLibrary():renderDeck();const u=new URL(location);u.searchParams.set('lang',l);history.replaceState({},'',u)}
  document.querySelectorAll('.lang-switch button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#homeBtn').onclick=()=>closeDeck();$('#notesBtn').onclick=()=>{notes=!notes;renderDeck()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  addEventListener('keydown',e=>{if(lesson===null)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(999);if(e.key.toLowerCase()==='n'){$('#notesBtn').click()}if(e.key==='Escape'&&!document.fullscreenElement)closeDeck()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(lesson!==null&&Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});
  addEventListener('popstate',()=>init(false));
  function init(replace=true){const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';const n=Number(q.get('lesson'));if(n>=1&&n<=L.length)openLesson(n-1,replace);else closeDeck(false)}
  buildLibrary();init();
  </script>
