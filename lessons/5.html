  <script>
  const DATA={"title":{"hi":"करने योग्य","en":"What Ought to Be Done"},"desc":{"hi":"कर्म पर अधिकार, फल में समता और दूसरे के अधिकार की रक्षा।","en":"Responsibility for action, equanimity in result, and protecting another’s right."},"slides":[{"type":"title","title":{"hi":"करने योग्य","en":"What Ought to Be Done"},"lead":{"hi":"कर्म करना है—पर अपनी चाह की पूर्ति के लिए नहीं; विवेक और समता के साथ।","en":"Action is necessary—but not for satisfying one’s demand; act with discernment and equanimity."},"tag":{"hi":"पाठ 05 · कर्मयोग का व्यवहार","en":"Lesson 05 · Karma Yoga in practice"},"cue":{"hi":"पिछले पाठ से जोड़ें: अकरणीय करना असाधन है; अब करणीय और उसकी विधि देखें।","en":"Connect to the prior lesson: doing what ought not be done obstructs practice; now examine right action and its method."}},{"title":{"hi":"अधिकार केवल कर्म पर","en":"Responsibility is for action alone"},"tag":{"hi":"गीता 2.47","en":"Gita 2.47"},"verse":["कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।","मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥ २.४७ ॥"],"meaning":{"hi":"अधिकार कर्म पर है, फल पर नहीं। फल को कर्म का हेतु न बनाओ और अकर्म में भी आसक्त न होओ।","en":"Your responsibility is for action, never for its fruits. Do not make the fruit your motive, and do not become attached to inaction."},"cue":{"hi":"“अधिकार” को नियंत्रण से अधिक उत्तरदायित्व के अर्थ में खोलें।","en":"Unpack “right” here primarily as responsibility, not control."}},{"title":{"hi":"एक श्लोक—चार निर्देश","en":"One verse—four directions"},"tag":{"hi":"गीता 2.47 का व्यवहार","en":"Applying Gita 2.47"},"lead":{"hi":"कर्मयोग परिणाम को नकारता नहीं; परिणाम पर अपनी माँग और नियंत्रण का भ्रम छोड़ता है।","en":"Karma Yoga does not deny results; it relinquishes our demand upon them and the illusion of control."},"side":{"kind":"cards","items":[{"h":{"hi":"1 · कर्म करो","en":"1 · Act"},"p":{"hi":"करणीय करो; अकरणीय न करना अधिक महत्त्वपूर्ण।","en":"Do what ought to be done; more importantly, avoid what ought not."}},{"h":{"hi":"2 · फल पर अधिकार नहीं","en":"2 · No claim on fruit"},"p":{"hi":"फल अनुकूल या प्रतिकूल परिस्थिति बनकर आता है।","en":"Fruit arrives as favourable or adverse circumstance."}},{"h":{"hi":"3 · फल हेतु न बने","en":"3 · Fruit is not the motive"},"p":{"hi":"परिस्थिति बदलने या बचाए रखने के लिए कर्म न हो।","en":"Do not act merely to alter or preserve circumstance."}},{"h":{"hi":"4 · अकर्म से आसक्ति नहीं","en":"4 · No attachment to inaction"},"p":{"hi":"“पाना नहीं तो करना क्यों?”—इस भ्रम से बचो।","en":"Avoid the error: “If nothing is mine to gain, why act?”"}}]},"cue":{"hi":"चारों को क्रम से लें; विशेष जोर “अकरणीय न करना” और “अकर्म से आसक्ति नहीं” पर दें।","en":"Take the four in order; stress refraining from wrong action and avoiding attachment to inaction."}},{"title":{"hi":"समत्वं योग उच्यते","en":"Equanimity is called Yoga"},"tag":{"hi":"गीता 2.48","en":"Gita 2.48"},"verse":["योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय ।","सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते ॥ २.४८ ॥"],"meaning":{"hi":"आसक्ति छोड़कर योग में स्थित हो कर्म करो; सिद्धि और असिद्धि में सम रहो—समत्व ही योग है।","en":"Established in Yoga, perform action abandoning attachment; remain equal in success and failure—equanimity is called Yoga."},"cue":{"hi":"समता कर्म से पहले की दृष्टि, कर्म के बीच की सजगता और फल के बाद की स्थिति—तीनों में है।","en":"Equanimity belongs before action as vision, during it as awareness, and after it as response."}},{"title":{"hi":"कर्म का नया मन्त्र","en":"A new maxim for action"},"tag":{"hi":"स्वार्थ से सेवा की ओर","en":"From self-claim to service"},"lead":{"hi":"मनुष्य सामान्यतः जो नहीं है उसे पाने और जो है उसे बचाने के लिए कर्म करता है। उद्देश्य समता हो तो दिशा बदलती है।","en":"We commonly act to gain what is absent and retain what is present. When equanimity becomes the objective, the direction changes."},"side":{"kind":"story","quote":{"hi":"अपने अधिकार का त्याग और दूसरे के अधिकार की रक्षा।","en":"Relinquish one’s own claim; protect the rights of others."},"text":{"hi":"अपने संकल्प की पूर्ति नहीं—विवेक-सम्मत सीमा में दूसरे के हित और अधिकार की पूर्ति।","en":"Not fulfilment of one’s demand, but another’s welfare and rights within the limits of discernment."}},"cue":{"hi":"“त्याग” को शोषण सहना न समझें; अगली स्लाइड की दो सीमाएँ साथ रखें।","en":"Do not equate relinquishment with accepting exploitation; pair it with the two safeguards on the next slide."}},{"title":{"hi":"दो सुरक्षा-सीमाएँ","en":"Two safeguards"},"lead":{"hi":"दूसरे की इच्छा पूरी करना तभी करणीय है जब वह विवेक-विरुद्ध न हो और अपनी सामर्थ्य से बाहर न हो।","en":"Fulfilling another’s wish is appropriate only when it is not against discernment and not beyond one’s capacity."},"tag":{"hi":"विवेक · सामर्थ्य · अहिंसा","en":"Discernment · capacity · non-harm"},"side":{"kind":"cards","items":[{"h":{"hi":"विवेक","en":"Discernment"},"p":{"hi":"माँग सही–गलत की कसौटी पर खरी हो।","en":"The request must withstand the test of right and wrong."}},{"h":{"hi":"सामर्थ्य","en":"Capacity"},"p":{"hi":"जो सम्भव नहीं, उसका वचन भी करणीय नहीं।","en":"Do not promise what is genuinely beyond capacity."}},{"h":{"hi":"शरीर और मन","en":"Body and mind"},"p":{"hi":"किसी को शारीरिक या मानसिक हानि न पहुँचे।","en":"Cause neither physical nor mental harm."}}]},"cue":{"hi":"यहाँ “दूसरा” निकट परिवार से आरम्भ होकर व्यवहार की पूरी परिधि तक फैलता है।","en":"Here “the other” begins with close family and extends across one’s sphere of interaction."}},{"type":"reflect","title":{"hi":"पसन्द नहीं—करणीय देखें","en":"Look beyond preference to what ought to be done"},"tag":{"hi":"आज का अभ्यास","en":"Practice for today"},"prompts":[{"hi":"अपने अधिकार की माँग छोड़कर किसके उचित अधिकार की रक्षा कर सकता हूँ?","en":"Whose rightful claim can I protect by loosening my own demand?"},{"hi":"निर्णय पसन्द–नापसन्द से हो रहा है या करणीय–अकरणीय से?","en":"Is this decision guided by preference, or by what ought and ought not be done?"},{"hi":"कर्म और फल—दोनों में समता कैसे बनाए रखूँ?","en":"How can I preserve equanimity through both action and result?"}],"cue":{"hi":"समापन में तीन सूत्र दोहराएँ: अधिकार-रक्षा, विवेक, समता।","en":"Close by repeating the three anchors: protecting rights, discernment, equanimity."}}]}, CHAPTER=5;
  const $=s=>document.querySelector(s), lang=()=>document.body.dataset.lang;
  let slide=0,notes=false;
  const text=v=>typeof v==='string'?v:(v?.[lang()]||'');
  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return '<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='equation')return '<div class="panel equation">'+s.rows.map(r=>'<div class="eq-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'<p><b>'+text(s.foot)+'</b></p></div>';if(s.kind==='story')return '<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title'){core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>'}else if(s.type==='reflect'){core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>'}else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+s.verse.join('<br>')+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return '<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){document.querySelector('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}
  function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}
  function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});
  const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
</script>
