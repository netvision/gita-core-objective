  <script>
  const DATA={"title":{"hi":"कर्ता है ही नहीं","en":"There Is No Independent Doer"},"slides":[{"type":"title","title":{"hi":"कर्ता है ही नहीं","en":"There Is No Independent Doer"},"lead":{"hi":"कर्मबन्धन का मूल “मैं कर्ता हूँ” की मान्यता है—पर क्या वास्तव में कोई अलग कर्ता है?","en":"Bondage begins with the belief “I am the doer”—but is there really a separate doer?"},"tag":{"hi":"पाठ 10 · कर्तापन की मान्यता","en":"Lesson 10 · The belief in doership"},"cue":{"hi":"पाठ 9 से जोड़ें: अहम् के रहते कर्ता रहता है; अब कर्तापन की वास्तविकता जाँची जाती है।","en":"Connect to Lesson 9: while ego remains, doership remains; now the reality of doership is examined."}},{"title":{"hi":"गुण ही गुणों में बरतते हैं","en":"The qualities act among qualities"},"tag":{"hi":"गीता 3.27–3.28","en":"Gita 3.27–3.28"},"verse":["प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः ।","अहङ्कारविमूढात्मा कर्ताहमिति मन्यते ॥ ३.२७ ॥","__GAP__","तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः ।","गुणा गुणेषु वर्तन्त इति मत्वा न सज्जते ॥ ३.२८ ॥"],"meaning":{"hi":"सभी कर्म प्रकृति के गुणों से होते हैं; अहंकार से मोहित व्यक्ति “मैं कर्ता हूँ” मानता है, जबकि तत्त्वज्ञ गुणों को गुणों में बरतते देखकर आसक्त नहीं होता।","en":"All actions are performed by nature’s qualities; the ego-deluded person thinks “I am the doer,” while one who sees qualities acting among qualities is not attached."},"cue":{"hi":"दोनों श्लोकों का भेद रखें: पहला भ्रम बताता है, दूसरा तत्त्वदृष्टि।","en":"Keep the contrast clear: the first verse names the delusion; the second gives the vision of truth."}},{"title":{"hi":"“है”, “यह” और “मैं हूँ”","en":"“Is,” “this,” and “I am”"},"tag":{"hi":"कर्तापन कैसे बनता है","en":"How doership appears"},"lead":{"hi":"अपरिवर्तनशील अकर्ता “है” और क्रियाशील प्रकृति “यह” के सम्बन्ध से “मैं हूँ” की मान्यता उठती है—यही अपने को कर्ता मानती है।","en":"From the assumed relation between the changeless non-doer (“is”) and active nature (“this”), the belief “I am” arises and claims doership."},"side":{"kind":"cards","items":[{"h":{"hi":"“है”","en":"“Is”"},"p":{"hi":"आत्मा · पुरुष · अकर्ता · सम","en":"Self · purusha · non-doer · equanimous"}},{"h":{"hi":"“यह”","en":"“This”"},"p":{"hi":"प्रकृति · संसार · विकारशील","en":"Nature · world · ever-changing"}},{"h":{"hi":"“मैं हूँ”","en":"“I am”"},"p":{"hi":"सम्बन्ध से बनी अहम् और कर्ता की मान्यता","en":"The belief in ego and doership born of the relation"}}]},"cue":{"hi":"पाठ के शब्दों को ज्यों का त्यों रखें और स्पष्ट करें कि कर्ता “मान्यता” है, कोई तीसरा स्वतन्त्र तत्त्व नहीं।","en":"Retain the lesson’s vocabulary and clarify that the doer is a belief, not a third independent principle."}},{"title":{"hi":"क्रिया “हो रही है”","en":"Action “is happening”"},"tag":{"hi":"स्वाभाविक प्रकृति","en":"Nature’s spontaneous activity"},"lead":{"hi":"हृदय की धड़कन, रक्त का संचालन, भोजन का पचना—क्रियाएँ स्वाभाविक रूप से हो रही हैं; उन्हें करने वाला अलग व्यक्ति दिखाई नहीं देता।","en":"Heartbeat, circulation and digestion occur naturally; no separate agent performing them can be found."},"side":{"kind":"story","quote":{"hi":"“कर रहा हूँ” से “हो रहा है” तक।","en":"From “I am doing” to “it is happening.”"},"text":{"hi":"इस स्वीकृति का अनुभव कर्तापन की मान्यता को मिटाता है; उसी से कर्मबन्धन छूटना सम्भव होता है।","en":"Experiencing this recognition dissolves the belief in doership, making release from bondage possible."}},"cue":{"hi":"यह बौद्धिक वाक्य नहीं; किसी जीवित शारीरिक प्रक्रिया की ओर ध्यान ले जाकर इसे अनुभव के निकट लाएँ।","en":"Do not leave this as an idea; bring it near experience by observing a living bodily process."}},{"title":{"hi":"ट्रेडमिल कौन चला रहा है?","en":"Who is moving the treadmill?"},"tag":{"hi":"पाठ 7 के उदाहरण की पुनर्दृष्टि","en":"Revisiting Lesson 7’s example"},"lead":{"hi":"चलती ट्रेडमिल पर खड़े होने से आप चल रहे हैं—या आपके चलने से ट्रेडमिल चल रही है?","en":"Are you moving because you stand on a moving treadmill—or is the treadmill moving because you walk?"},"side":{"kind":"chain","rows":[[{"hi":"प्रकृति की गति","en":"Nature’s motion"},{"hi":"शरीर की क्रिया","en":"Bodily action"}],[{"hi":"शरीर की क्रिया","en":"Bodily action"},{"hi":"“मैं कर रहा हूँ”","en":"“I am doing”"}],[{"hi":"जाँच","en":"Inquiry"},{"hi":"कर्ता की मान्यता","en":"Belief in a doer"}]]},"cue":{"hi":"उदाहरण को कारण की दिशा जाँचने दें; निष्कर्ष श्रोताओं पर थोपा न जाए।","en":"Let the example examine the direction of causality; do not force the conclusion."}},{"title":{"hi":"नदी स्वयं बहा रही है","en":"The river carries the raft"},"tag":{"hi":"River rafting का उदाहरण","en":"The river-rafting example"},"lead":{"hi":"Raft नदी में उतरते ही बहती है। उसमें बैठा व्यक्ति मानता है कि वह rafting कर रहा है—पर raft उसकी वजह से नहीं बहती।","en":"The raft begins moving as soon as it enters the river. Its passenger claims to be rafting, but the raft does not flow because of that passenger."},"side":{"kind":"story","quote":{"hi":"“बहाव पहले से है; यात्री कर्तापन जोड़ता है।”","en":"“The current is already moving; the passenger adds doership.”"},"text":{"hi":"प्रकृति में क्रिया हो रही है। स्वयं को उस पर बैठाकर “मेरी वजह से” कहना कर्मबन्धन की मान्यता है।","en":"Action is occurring in nature. Placing oneself upon it and saying “because of me” is the belief that binds."}},"cue":{"hi":"चित्रात्मक उदाहरण को श्लोक 3.28 के “गुणा गुणेषु वर्तन्ते” से जोड़ें।","en":"Connect the image to “the qualities act among qualities” in Gita 3.28."}},{"title":{"hi":"मान्यता मिट सकती है","en":"A belief can dissolve"},"tag":{"hi":"इसीलिए मुक्ति सम्भव है","en":"Why freedom is possible"},"lead":{"hi":"कर्तापन कोई स्वतन्त्र सत्य नहीं, सम्बन्ध से बनी मान्यता है। इसलिए उसका मिटना—और कर्मबन्धन से छूटना—सम्भव है।","en":"Doership is not an independent reality but a belief born of relation. Therefore it can dissolve—and bondage to action can end."},"side":{"kind":"cards","items":[{"h":{"hi":"पहचान","en":"Recognition"},"p":{"hi":"क्रिया और प्रकृति का तथ्य देखें।","en":"See the fact of action and nature."}},{"h":{"hi":"स्वीकृति","en":"Acceptance"},"p":{"hi":"क्रियाएँ स्वाभाविक रूप से हो रही हैं।","en":"Actions are naturally occurring."}},{"h":{"hi":"अनासक्ति","en":"Non-attachment"},"p":{"hi":"“मैं कर्ता” की पकड़ ढीली होती है।","en":"The grip of “I am the doer” loosens."}}]},"cue":{"hi":"मुक्ति का अर्थ क्रिया का लोप नहीं; कर्तापन की झूठी मिल्कियत का लोप है।","en":"Freedom does not mean action disappears; the false ownership of action disappears."}},{"type":"reflect","title":{"hi":"कर्ता की जाँच","en":"Examine the doer"},"tag":{"hi":"चर्चा और आत्म-अवलोकन","en":"Discussion and self-observation"},"prompts":[{"hi":"क्रिया हो रही है या आप कर रहे हैं?","en":"Is action happening, or are you doing it?"},{"hi":"अगर आप कर रहे हैं तो हृदय की धड़कन, रक्त-संचालन या पाचन को बन्द कर सकते हैं?","en":"If you are doing it, can you stop heartbeat, circulation or digestion?"}],"cue":{"hi":"दोनों प्रश्न PDF से हैं। इन्हें तर्क-वितर्क नहीं, प्रत्यक्ष जाँच का निमन्त्रण बनाएँ।","en":"Both questions are from the PDF. Use them as invitations to direct inquiry, not debate."}}]},CHAPTER=10;

  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return'<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='chain')return'<div class="panel chain">'+s.rows.map(r=>'<div class="chain-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'</div>';if(s.kind==='story')return'<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function verses(lines){return lines.map(v=>v==='__GAP__'?'<span class="gap"></span>':v).join('<br>')}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title')core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>';else if(s.type==='reflect')core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>';else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+verses(s.verse)+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return'<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){$('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
  </script>
</body>
