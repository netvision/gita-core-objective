  <script>
  const DATA={"title":{"hi":"उद्देश्य परिवर्तन","en":"Changing the Objective"},"desc":{"hi":"इच्छा-पूर्ति से समता की ओर—साधक की बुद्धि एक दिशा में कैसे स्थिर हो?","en":"From desire-fulfilment to equanimity—how does a seeker become one-pointed?"},"slides":[{"type":"title","title":{"hi":"उद्देश्य परिवर्तन","en":"Changing the Objective"},"lead":{"hi":"जीवन का लक्ष्य परिस्थिति को अपने अनुकूल करना नहीं—हर परिस्थिति में समता को सुरक्षित रखना हो।","en":"Let life’s objective be not to bend circumstance to preference, but to preserve equanimity in every circumstance."},"tag":{"hi":"पाठ 04 · एकनिष्ठ बुद्धि","en":"Lesson 04 · Resolute intelligence"},"cue":{"hi":"भेद रखें: इच्छाएँ अनेक हो सकती हैं, पर जीवन का उद्देश्य एक दिशा देता है।","en":"Distinguish many desires from the one direction given by an objective."}},{"title":{"hi":"विवेक से कर्मयोग तक","en":"From discernment to Karma Yoga"},"tag":{"hi":"गीता 2.39","en":"Gita 2.39"},"verse":["एषा तेऽभिहिता सांख्ये बुद्धिर्योगे त्विमां शृणु ।","बुद्ध्या युक्तो यया पार्थ कर्मबन्धं प्रहास्यसि ॥ २.३९ ॥"],"meaning":{"hi":"अब उस बुद्धि को सुनो जिससे कर्म करते हुए समता बनी रहे और कर्म का बन्धन छूटे—घटना भीतर शुभ-अशुभ प्रभाव छोड़कर हमें बाँधे नहीं।","en":"Now hear the understanding by which equanimity is maintained in action and karmic bondage is relinquished—the event no longer binds through its pleasant or painful inner imprint."},"cue":{"hi":"कर्म छोड़ना नहीं; कर्म करते हुए भीतर परिणाम-आधीनता छोड़ना इसका केन्द्र है।","en":"The point is not abandoning action, but relinquishing inner dependence upon its result."}},{"title":{"hi":"थोड़ी समता भी पूरी है","en":"Even a little equanimity is whole"},"tag":{"hi":"गीता 2.40","en":"Gita 2.40"},"verse":["नेहाभिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते ।","स्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात् ॥ २.४० ॥"],"meaning":{"hi":"इस साधन का आरम्भ नष्ट नहीं होता, विपरीत फल नहीं देता; थोड़ा-सा अभ्यास भी महान भय से बचाता है।","en":"No beginning on this path is lost, nor does it produce a contrary result; even a little of this practice protects from great fear."},"side":{"kind":"story","quote":{"hi":"समता थोड़ी भी पूरी है; बड़ी से बड़ी उपलब्धि पूरी होकर भी अधूरी है।","en":"Even a little equanimity is whole; the greatest achievement remains incomplete even when attained."},"text":{"hi":"उपलब्धि चली जा सकती है; समता परिस्थिति से स्वतंत्रता का स्वाद देती है।","en":"Achievement can pass away; equanimity gives a taste of freedom from circumstance."}},"cue":{"hi":"“छोटा अभ्यास” को कम महत्त्व नहीं, सुरक्षित और संचयी आरम्भ के रूप में रखें।","en":"Present “a little practice” not as insignificant, but as a safe beginning that is never lost."}},{"title":{"hi":"एक उद्देश्य—एकनिष्ठ बुद्धि","en":"One objective—resolute intelligence"},"tag":{"hi":"गीता 2.41","en":"Gita 2.41"},"verse":["व्यवसायात्मिका बुद्धिरेकेह कुरुनन्दन ।","बहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम् ॥ २.४१ ॥"],"meaning":{"hi":"निश्चयात्मक बुद्धि एक दिशा में रहती है; अनिश्चयशील बुद्धि की शाखाएँ अनन्त होती हैं। इच्छाएँ अनेक हैं, पर साधक का उद्देश्य—समता—एक है।","en":"Resolute intelligence is one-pointed; the irresolute mind branches endlessly. Desires are many, but the seeker’s objective—equanimity—is one."},"cue":{"hi":"व्यस्तता और दिशा में अन्तर बताएँ: अनेक प्रयास भी एक स्पष्ट उद्देश्य के बिना बिखर सकते हैं।","en":"Distinguish activity from direction: many efforts can scatter without a clear objective."}},{"title":{"hi":"भोग में उलझी बुद्धि","en":"Intelligence absorbed in enjoyment"},"tag":{"hi":"गीता 2.42–44","en":"Gita 2.42–44"},"verse":["भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम् ।","व्यवसायात्मिका बुद्धिः समाधौ न विधीयते ॥ २.४४ ॥"],"meaning":{"hi":"भोग और ऐश्वर्य में आसक्त, उनसे चित्त हर लिए गए लोगों की बुद्धि आत्मस्थ समता में स्थिर नहीं होती।","en":"For those attached to enjoyment and power, whose attention is carried away by them, resolute intelligence does not become established in inner absorption."},"side":{"kind":"cards","items":[{"h":{"hi":"पुराना उद्देश्य","en":"Old objective"},"p":{"hi":"अनुकूल पाना, प्रतिकूल से बचना","en":"Gain the favourable; avoid the adverse"}},{"h":{"hi":"नया उद्देश्य","en":"New objective"},"p":{"hi":"हर परिणाम में समता सुरक्षित रखना","en":"Preserve equanimity in every outcome"}}]},"cue":{"hi":"श्लोक 2.42–43 की पूरी चर्चा स्रोत में है; स्क्रीन पर पठनीयता हेतु 2.44 निष्कर्ष के रूप में रखा है।","en":"The source discusses 2.42–43 fully; 2.44 is shown as their concise conclusion for screen readability."}},{"title":{"hi":"अपने को साधक मानना","en":"Accept oneself as a seeker"},"lead":{"hi":"उद्देश्य बदलना केवल विचार नहीं—स्वीकृति है: “मैं समता का साधक हूँ।” असाधन को पहचानना भी साधना का भाग है।","en":"Changing the objective is not merely an idea; it is the acceptance, “I am a seeker of equanimity.” Recognising what obstructs practice is part of practice."},"tag":{"hi":"साधन बनाम असाधन","en":"Practice versus obstruction"},"side":{"kind":"cards","items":[{"h":{"hi":"ज्ञात असत्य","en":"Known untruth"},"p":{"hi":"जिसे मिथ्या जान लिया, फिर भी न छोड़ा।","en":"What is known as false, yet not relinquished."}},{"h":{"hi":"अकरणीय कर्म","en":"What ought not be done"},"p":{"hi":"विवेक-विरुद्ध कर्म करते रहना।","en":"Continuing to act against discernment."}},{"h":{"hi":"अयोग्य आश्रय","en":"Unworthy support"},"p":{"hi":"जो स्वयं अनित्य है, उसी पर स्थायित्व माँगना।","en":"Demanding permanence from what is itself impermanent."}}]},"cue":{"hi":"तीसरे बिन्दु की विस्तृत चर्चा आगे के पाठों में आएगी—यहाँ केवल दिशा दें।","en":"The third point is developed in later lessons; here, give only the direction."}},{"type":"reflect","title":{"hi":"आज मेरा उद्देश्य क्या है?","en":"What is my objective today?"},"tag":{"hi":"मनन · संकल्प","en":"Reflect · Resolve"},"prompts":[{"hi":"इच्छा और उद्देश्य में क्या अन्तर है?","en":"What is the difference between a desire and an objective?"},{"hi":"क्या इच्छा-पूर्ति स्थायी रूप से सम्भव है?","en":"Can desire-fulfilment ever be permanent?"},{"hi":"क्या मैं अपना उद्देश्य “समता” स्वीकार करने को तैयार हूँ?","en":"Am I ready to accept equanimity as my objective?"}],"cue":{"hi":"अन्तिम प्रश्न का सार्वजनिक उत्तर आवश्यक नहीं; इसे निजी संकल्प रहने दें।","en":"No public answer is required to the last question; allow it to remain a private resolve."}}]}, CHAPTER=4;
  const $=s=>document.querySelector(s), lang=()=>document.body.dataset.lang;
  let slide=0,notes=false;
  const text=v=>typeof v==='string'?v:(v?.[lang()]||'');
  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return '<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='equation')return '<div class="panel equation">'+s.rows.map(r=>'<div class="eq-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'<p><b>'+text(s.foot)+'</b></p></div>';if(s.kind==='story')return '<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title'){core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>'}else if(s.type==='reflect'){core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>'}else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+s.verse.join('<br>')+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return '<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){document.querySelector('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}
  function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}
  function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});
  const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
</script>
