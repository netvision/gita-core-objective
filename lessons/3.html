  <script>
  const DATA={"title":{"hi":"नित्य/अनित्य का भेद","en":"Distinguishing the Eternal and Impermanent"},"desc":{"hi":"जो बदलता है वह दृश्य है; जो परिवर्तन को जानता है, उसका आधार क्या है?","en":"What changes is seen; what is the ground that knows the change?"},"slides":[{"type":"title","title":{"hi":"नित्य / अनित्य का भेद","en":"The Eternal / Impermanent"},"lead":{"hi":"परिवर्तन को देखकर उस अपरिवर्तनशील “है” की ओर मुड़ना, जिसमें सब प्रतीत होता है।","en":"Seeing change, turn toward the unchanging “is-ness” in which everything appears."},"tag":{"hi":"पाठ 03 · सत् का विवेक","en":"Lesson 03 · Discerning the real"},"cue":{"hi":"पिछले पाठ से जोड़ें: परिस्थिति अनित्य है; अब उसके आधार की जाँच है।","en":"Connect to the prior lesson: circumstance is impermanent; now investigate its ground."}},{"title":{"hi":"सत् और असत् की सीमा","en":"The boundary of real and unreal"},"tag":{"hi":"गीता 2.16","en":"Gita 2.16"},"verse":["नासतो विद्यते भावो नाभावो विद्यते सतः ।","उभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः ॥ २.१६ ॥"],"meaning":{"hi":"असत् की स्थायी सत्ता नहीं और सत् का अभाव नहीं। तत्त्वदर्शियों ने दोनों की सीमा देखी है। सरल कसौटी: जो है वह बदलता नहीं; जो बदलता है, वह स्थिर रूप से “है” नहीं।","en":"The unreal has no lasting being; the real never ceases to be. Seers discern the limit of both. Put simply: the real does not change; what changes has no stable being."},"cue":{"hi":"इसे बौद्धिक नारा न बनाएँ; आगे के अनुभवजन्य उदाहरणों से खोलें।","en":"Do not leave this as an abstract slogan; unfold it through the experiential examples that follow."}},{"title":{"hi":"अविनाशी आधार","en":"The indestructible ground"},"tag":{"hi":"गीता 2.17","en":"Gita 2.17"},"verse":["अविनाशि तु तद्विद्धि येन सर्वमिदं ततम् ।","विनाशमव्ययस्यास्य न कश्चित्कर्तुमर्हति ॥ २.१७ ॥"],"meaning":{"hi":"जिससे यह सब व्याप्त है, उसे अविनाशी जानो; उस अव्यय का विनाश कोई नहीं कर सकता। दृश्य बदलता है—“होने” का प्रकाश बना रहता है।","en":"Know as indestructible that by which all this is pervaded; none can destroy the immutable. The seen changes, while the light of being remains."},"cue":{"hi":"“है” को किसी वस्तु की तरह न रखें; वह वह आधार है जिसमें वस्तु ज्ञात होती है।","en":"Do not present “is-ness” as another object; it is the ground in which an object is known."}},{"title":{"hi":"प्रवाह बदलता है—आधार नहीं","en":"The flow changes—the ground does not"},"lead":{"hi":"नदी का जल, वेग और सामग्री बदलती रहती है; आधार-शिला बनी रहती है। बाल्य, यौवन और वृद्धावस्था बदलते हैं—फिर भी हम कहते हैं, “मैं वही हूँ।”","en":"A river’s water, speed, and contents keep changing; the foundation stone remains. Childhood, youth, and old age change—yet we say, “I am the same.”"},"tag":{"hi":"दृश्य और द्रष्टा का संकेत","en":"A pointer to the seen and the knower"},"side":{"kind":"cards","items":[{"h":{"hi":"बदलता दृश्य","en":"Changing appearance"},"p":{"hi":"शरीर, अवस्था, परिस्थिति, विचार","en":"Body, stage, circumstance, thought"}},{"h":{"hi":"निरन्तर जानना","en":"Continuous knowing"},"p":{"hi":"परिवर्तन की उपस्थिति और अनुपस्थिति—दोनों का साक्षी","en":"Witness of both the presence and absence of change"}}]},"cue":{"hi":"“मैं वही हूँ” वाक्य पर विराम दें; श्रोता अपने अनुभव में निरन्तरता देखें।","en":"Pause on “I am the same”; let listeners notice continuity in direct experience."}},{"title":{"hi":"माला में धागा","en":"The thread in a garland"},"lead":{"hi":"फूल अलग-अलग दिखते हैं; धागा उन्हें एक माला बनाता है। फूल बदले जा सकते हैं—धागे के बिना माला का रूप टिकता नहीं।","en":"Flowers appear distinct; the thread holds them as one garland. Flowers may be replaced, but without the thread the garland does not hold."},"tag":{"hi":"संवाद-अभ्यास","en":"Dialogue exercise"},"side":{"kind":"story","quote":{"hi":"दृश्य फूल हैं; “है” वह धागा है जिसमें दृश्य प्रकट है।","en":"Appearances are the flowers; “is-ness” is the thread in which they appear."},"text":{"hi":"क्या फूल और धागा एक हैं? क्या फूल अलग हो सकते हैं? क्या धागे के बिना माला रह सकती है?","en":"Are flower and thread the same? Can flowers be separated? Can the garland remain without its thread?"}},"cue":{"hi":"इन तीन प्रश्नों को क्रम से रखें; निष्कर्ष श्रोताओं से आने दें।","en":"Ask the three questions in sequence and let the conclusion arise from the audience."}},{"type":"reflect","title":{"hi":"“वृक्ष है” से पहले “है”","en":"Before “the tree is”—notice “is”"},"tag":{"hi":"अभ्यास · हर 30 मिनट में 2 मिनट","en":"Practice · 2 minutes every 30 minutes"},"prompts":[{"hi":"पहले वृक्ष को मानकर “यह वृक्ष है” न देखें।","en":"Do not begin by assuming the tree and then saying, “the tree is.”"},{"hi":"देखें—“है” के प्रकाश में वृक्ष प्रतीत हो रहा है।","en":"Notice: the tree appears in the light of “is-ness.”"},{"hi":"दृश्य से अधिक महत्त्व उसके अपरिवर्तनशील आधार को दें।","en":"Give greater importance to the unchanging ground than to the appearance."}],"cue":{"hi":"इसे केवल भाषा-परिवर्तन नहीं, ध्यान की दिशा बदलना बताएँ।","en":"Present this not as wordplay, but as a shift in the direction of attention."}}]}, CHAPTER=3;

  let slide=0,notes=false;

  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return '<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='equation')return '<div class="panel equation">'+s.rows.map(r=>'<div class="eq-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'<p><b>'+text(s.foot)+'</b></p></div>';if(s.kind==='story')return '<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title'){core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>'}else if(s.type==='reflect'){core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>'}else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+s.verse.join('<br>')+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return '<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){document.querySelector('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}
  function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}
  function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});
  const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
</script>
</body>
