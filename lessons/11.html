    .chrome{position:fixed;z-index:10;inset:auto 0 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:15px;padding:13px clamp(18px,4vw,56px) max(13px,env(safe-area-inset-bottom));color:#f7ecdb;background:linear-gradient(transparent,rgba(20,10,8,.9) 42%)}.chrome button{min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.22);background:rgba(39,19,15,.78);color:white;border-radius:999px;padding:8px 13px;cursor:pointer}.chrome button:hover{background:var(--saffron)}.chrome-left,.chrome-right{display:flex;align-items:center;gap:8px}.chrome-right{justify-content:flex-end}.progress{display:flex;align-items:center;gap:8px}.progress .dot{min-width:7px;width:7px;min-height:7px;height:7px;padding:0;border:0;background:rgba(255,255,255,.4)}.progress .dot.active{width:25px;background:var(--gold)}.counter{font-size:.78rem;min-width:48px;text-align:center}.keys{font-size:.74rem;opacity:.7}.notes{position:absolute;z-index:8;right:25px;bottom:82px;width:min(390px,calc(100vw - 50px));padding:18px 20px;background:#fff8e9;color:#34221c;border-top:4px solid var(--gold);box-shadow:var(--shadow);font-size:.94rem;line-height:1.5}.notes b{display:block;color:var(--saffron);font-size:.72rem;letter-spacing:.12em;margin-bottom:7px}

  <script>
  const DATA={"title":{"hi":"क्या कर्म करें, क्या नहीं करें","en":"What to Do and What Not to Do"},"slides":[{"type":"title","title":{"hi":"क्या कर्म करें, क्या नहीं करें","en":"What to Do and What Not to Do"},"lead":{"hi":"कर्म का चयन चाह से होगा, सुविधा से—या उस उद्देश्य से जिसके लिए जीवन और कर्म हैं?","en":"Should action be chosen by desire and convenience—or by the purpose life and action are meant to serve?"},"tag":{"hi":"पाठ 11 · कर्म-चयन की कसौटी","en":"Lesson 11 · The criterion for choosing action"},"cue":{"hi":"प्रारम्भ में श्रोताओं से कोई वर्तमान निर्णय मन में रखने को कहें।","en":"Invite listeners to hold one current decision in mind as the lesson begins."}},{"title":{"hi":"राग-द्वेष के वश में न हों","en":"Do not submit to attraction and aversion"},"tag":{"hi":"गीता 3.34","en":"Gita 3.34"},"verse":["इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ ।","तयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ ॥ ३.३४ ॥"],"meaning":{"hi":"प्रत्येक इन्द्रिय-विषय में राग और द्वेष स्थित हैं; उनके वश में न हों, क्योंकि वे कल्याण-पथ के विघ्नकारी शत्रु हैं।","en":"Attraction and aversion lie in every field of the senses; do not come under their sway, for they obstruct the path of wellbeing."},"cue":{"hi":"राग-द्वेष को अच्छा लगना और अच्छा न लगना—दोनों की स्वचालित खींच—के रूप में स्पष्ट करें।","en":"Explain attraction and aversion as the automatic pull of liking and disliking."}},{"title":{"hi":"चाह नहीं—उद्देश्य","en":"Not preference—purpose"},"tag":{"hi":"कर्म-चयन का पहला सूत्र","en":"The first rule of choosing action"},"lead":{"hi":"महत्त्व चाह की पूर्ति को नहीं, उद्देश्य की पूर्ति को दें। अनुकूलता–प्रतिकूलता से दृष्टि हटाकर लक्ष्य पर रखें।","en":"Give priority not to fulfilling desire but to fulfilling the purpose. Shift attention from comfort and discomfort to the aim."},"side":{"kind":"story","quote":{"hi":"“परीक्षा लक्ष्य हो तो सभी विषय पढ़ने पड़ते हैं।”","en":"“When the examination is the goal, every subject must be studied.”"},"text":{"hi":"किसी विषय में रुचि कम हो या खेल की ओर आकर्षण अधिक—जागृत लक्ष्य विद्यार्थी की दृष्टि फिर परीक्षा पर लाता है।","en":"A subject may be disliked and play may attract more strongly; an awakened goal returns the student’s attention to the examination."}},"cue":{"hi":"उदाहरण का निष्कर्ष दमन नहीं, प्राथमिकता है—रुचि दिखती है पर निर्णय लक्ष्य से होता है।","en":"The point is not suppression but priority: preference is seen, while the decision follows the goal."}},{"title":{"hi":"स्वधर्म की दिशा","en":"The direction of svadharma"},"tag":{"hi":"गीता 3.35","en":"Gita 3.35"},"verse":["श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् ।","स्वधर्मे निधनं श्रेयः परधर्मो भयावहः ॥ ३.३५ ॥"],"meaning":{"hi":"अच्छी तरह किए दूसरे के धर्म से गुणहीन अपना धर्म श्रेष्ठ है; स्वधर्म में मरना भी कल्याणकारी है, परधर्म भयावह है।","en":"One’s own dharma, even imperfectly lived, is better than another’s well performed; even death in one’s own dharma is preferable, while another’s is fraught with fear."},"cue":{"hi":"PDF इस श्लोक के दो अर्थ खोलता है—स्व में स्थित रहना और स्वीकार की हुई भूमिका निभाना।","en":"The PDF develops two senses of this verse: abiding in the Self and fulfilling one’s accepted role."}},{"title":{"hi":"स्वधर्म—दो अर्थ","en":"Svadharma—two senses"},"tag":{"hi":"स्वाश्रितता और भूमिका","en":"Self-reliance and rightful role"},"lead":{"hi":"पहला: “स्व” में स्थित, पाने की चाह और खोने के भय से अनाश्रित रहना। दूसरा: स्वीकारे व्यक्तित्व की उचित भूमिका निभाना।","en":"First: abide in the Self, independent of the desire to gain and fear of loss. Second: fulfil the rightful role of the personality one has accepted."},"side":{"kind":"cards","items":[{"h":{"hi":"पिता","en":"Parent"},"p":{"hi":"बच्चों की रक्षा और मार्गदर्शन।","en":"Protection and guidance of children."}},{"h":{"hi":"विद्यार्थी","en":"Student"},"p":{"hi":"पढ़ाई, अनुशासन और जिज्ञासा।","en":"Study, discipline and inquiry."}},{"h":{"hi":"पुत्र","en":"Child"},"p":{"hi":"माता-पिता का आदर और सेवा।","en":"Respect and service toward parents."}}]},"cue":{"hi":"भूमिकाएँ उदाहरण हैं, स्थायी पहचान नहीं; कसौटी है उस भूमिका का उचित उत्तरदायित्व।","en":"The roles are examples, not permanent identities; the criterion is the rightful responsibility within the role."}},{"title":{"hi":"स्वाभाविक रुचि को साधन बनाएँ","en":"Use natural inclination as a means"},"tag":{"hi":"जीविका और स्वभाव","en":"Livelihood and disposition"},"lead":{"hi":"जीविका के लिए उसी कर्म को चुनें जिसमें स्वाभाविक रुचि हो—कला, संगीत, नृत्य, खेल या कोई अन्य क्षेत्र।","en":"For livelihood, choose work aligned with natural inclination—art, music, dance, sport or another field."},"side":{"kind":"cards","items":[{"h":{"hi":"गलत माप","en":"A mistaken measure"},"p":{"hi":"सफलता को केवल धन की उपलब्धि मानना।","en":"Measuring success only by money acquired."}},{"h":{"hi":"परिणाम","en":"Consequence"},"p":{"hi":"परिश्रम बोझ लगता है और अशान्ति बनी रहती है।","en":"Effort feels burdensome and restlessness persists."}},{"h":{"hi":"सही उपयोग","en":"Right use"},"p":{"hi":"रुचि को कर्मबन्धन से मुक्ति के उद्देश्य में लगाना।","en":"Use inclination in service of freedom from bondage to action."}}]},"cue":{"hi":"PDF का “career” उदाहरण रखें, पर सफलता को केवल सुविधा या आय से न जोड़ें।","en":"Retain the PDF’s career example without equating success merely with comfort or income."}},{"title":{"hi":"एक निर्णय-कसौटी","en":"A criterion for decisions"},"tag":{"hi":"उद्देश्य · भूमिका · स्वभाव","en":"Purpose · role · disposition"},"lead":{"hi":"करणीय वही है जो उद्देश्य को पूरा करे, राग-द्वेष के वश में न हो, उचित भूमिका निभाए और स्वाभाविक क्षमता का सदुपयोग करे।","en":"Right action fulfils the purpose, is not ruled by attraction or aversion, honours rightful role and uses natural capacity well."},"side":{"kind":"chain","rows":[[{"hi":"चाह की जाँच","en":"Examine preference"},{"hi":"राग-द्वेष से दूरी","en":"Step back from attraction and aversion"}],[{"hi":"भूमिका की जाँच","en":"Examine the role"},{"hi":"स्वधर्म","en":"Svadharma"}],[{"hi":"दिशा की जाँच","en":"Examine direction"},{"hi":"कर्मबन्धन से मुक्ति","en":"Freedom from bondage"}]]},"cue":{"hi":"इसे यांत्रिक सूत्र न बनाएँ; विवेक से तीनों कसौटियों को एक साथ देखें।","en":"Do not turn this into a mechanical formula; hold all three criteria together with discernment."}},{"type":"reflect","title":{"hi":"अपनी रुचि और दिशा देखें","en":"Examine inclination and direction"},"tag":{"hi":"चर्चा और आत्म-अवलोकन","en":"Discussion and self-observation"},"prompts":[{"hi":"आपकी स्वाभाविक रुचि किसमें है?","en":"Where does your natural inclination lie?"},{"hi":"उस रुचि का कर्मबन्धन से मुक्त होने में कैसे उपयोग कर सकते हैं?","en":"How can that inclination be used to become free from bondage to action?"}],"cue":{"hi":"दोनों प्रश्न PDF से हैं। रुचि को केवल career नहीं, सेवा और आन्तरिक उद्देश्य से भी जोड़ें।","en":"Both questions are from the PDF. Connect inclination not only with career, but also with service and the inward purpose."}}]},CHAPTER=11;
  const $=s=>document.querySelector(s),lang=()=>document.body.dataset.lang;let slide=0,notes=false;const text=v=>typeof v==='string'?v:(v?.[lang()]||'');
  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return'<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='chain')return'<div class="panel chain">'+s.rows.map(r=>'<div class="chain-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'</div>';if(s.kind==='story')return'<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function verses(lines){return lines.map(v=>v==='__GAP__'?'<span class="gap"></span>':v).join('<br>')}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title')core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>';else if(s.type==='reflect')core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>';else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+verses(s.verse)+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return'<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){$('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
  </script>
</body>
