  <script>
  const DATA={"title":{"hi":"कर्म करने के लिए हम बाध्य हैं","en":"We Are Compelled to Act"},"slides":[{"type":"title","title":{"hi":"कर्म करने के लिए हम बाध्य हैं","en":"We Are Compelled to Act"},"lead":{"hi":"यदि समझने—ज्ञान—से ही काम चल जाए, तो कर्म करने की आवश्यकता क्या है?","en":"If understanding—knowledge—were enough, why would action still be necessary?"},"tag":{"hi":"पाठ 07 · कर्म की अनिवार्यता","en":"Lesson 07 · The necessity of action"},"cue":{"hi":"अर्जुन के प्रश्न से आरम्भ करें: ज्ञान और कर्म को विरोधी मान लेने पर यह शंका स्वाभाविक है।","en":"Begin with Arjuna’s question: this doubt naturally arises when knowledge and action are treated as opposites."}},{"title":{"hi":"क्षणमात्र भी अकर्म नहीं","en":"Not even a moment without action"},"tag":{"hi":"गीता 3.5","en":"Gita 3.5"},"verse":["न हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत् ।","कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः ॥ ३.५ ॥"],"meaning":{"hi":"कोई क्षणमात्र भी बिना कर्म किए नहीं रह सकता; प्रकृति से उत्पन्न गुण प्रत्येक व्यक्ति को कर्म में प्रवृत्त करते हैं।","en":"No one can remain without action even for a moment; the qualities born of nature impel everyone to act."},"cue":{"hi":"“अवशः” पर ध्यान दें—यह दबाव बाहर से कम, प्रकृति की सतत क्रियाशीलता से अधिक है।","en":"Emphasise “impelled”: the force is less an external command than nature’s ceaseless activity."}},{"title":{"hi":"दो तत्त्व—एक सम्बन्ध","en":"Two principles—and a relation"},"tag":{"hi":"“है” · “यह” · “मैं हूँ”","en":"“Is” · “this” · “I am”"},"lead":{"hi":"पाठ एक अक्रिय साक्षी और सदा क्रियाशील प्रकृति का भेद रखता है; दोनों के सम्बन्ध से कर्ता-व्यक्तित्व की मान्यता बनती है।","en":"The lesson distinguishes the inactive witness from ever-active nature; their assumed relation gives rise to the personality that claims doership."},"side":{"kind":"cards","items":[{"h":{"hi":"“है” — पुरुष","en":"“Is” — purusha"},"p":{"hi":"सर्वदा अक्रिय; अकर्म, पूर्ण समता और अकर्ता।","en":"Ever inactive: non-action, complete equanimity, the non-doer."}},{"h":{"hi":"“यह” — प्रकृति","en":"“This” — prakriti"},"p":{"hi":"सदैव बदलती और क्रियाशील।","en":"Always changing and active."}},{"h":{"hi":"“मैं हूँ” — व्यक्तित्व","en":"“I am” — personality"},"p":{"hi":"सम्बन्ध से उत्पन्न कर्ता और कर्म का आधार।","en":"The assumed doer and basis of action born from their relation."}}]},"cue":{"hi":"इन शब्दों को दार्शनिक परिभाषा की तरह नहीं, PDF की व्याख्यात्मक भाषा की तरह रखें।","en":"Present these terms as the PDF’s explanatory vocabulary, not as exhaustive philosophical definitions."}},{"title":{"hi":"क्रियाएँ अपने आप हो रही हैं","en":"Actions are happening naturally"},"tag":{"hi":"शरीर में प्रकृति का प्रवाह","en":"Nature at work in the body"},"lead":{"hi":"भोजन का पचना, रक्त का संचालन और श्वासों का आना—इन क्रियाओं को व्यक्तित्व आरम्भ या बन्द नहीं करता।","en":"Digestion, circulation and breathing are not started or stopped by the personality."},"side":{"kind":"chain","rows":[[{"hi":"भोजन","en":"Food"},{"hi":"पाचन","en":"Digestion"}],[{"hi":"हृदय","en":"Heart"},{"hi":"धड़कन","en":"Beating"}],[{"hi":"श्वास","en":"Breath"},{"hi":"आगमन–निर्गमन","en":"Inflow–outflow"}]]},"cue":{"hi":"श्रोताओं से पूछें: इनमें से किस क्रिया को आपने आज सचेत रूप से चालू किया?","en":"Ask: which of these processes did you consciously switch on today?"}},{"title":{"hi":"चलती ट्रेडमिल का उदाहरण","en":"The moving treadmill"},"tag":{"hi":"जब तक ऊपर हैं, चलना होगा","en":"While on it, movement is unavoidable"},"lead":{"hi":"चलती ट्रेडमिल पर खड़े रहकर न चलना सम्भव नहीं। रुकने के लिए उससे उतरना होगा।","en":"Standing still on a moving treadmill is impossible; to stop, one must step off."},"side":{"kind":"story","quote":{"hi":"“जब तक कर्ता है, तब तक कर्म करना अनिवार्य है।”","en":"“As long as the doer remains, action is unavoidable.”"},"text":{"hi":"ट्रेडमिल प्रकृति की क्रियाशीलता है; उस पर खड़ा “मैं हूँ” अपने को गति का कर्ता मानता है।","en":"The treadmill is nature’s activity; the “I am” standing upon it takes itself to be the author of movement."}},"cue":{"hi":"उदाहरण का उद्देश्य कर्म रोकना नहीं, कर्ता की मान्यता को देखना है।","en":"The example is not an instruction to stop action; it reveals the assumption of doership."}},{"title":{"hi":"स्वतन्त्रता कहाँ है?","en":"Where does freedom lie?"},"tag":{"hi":"अकर्म नहीं—कर्म की दिशा","en":"Not inaction—the direction of action"},"lead":{"hi":"मनुष्य के पास कर्म न करने की स्वतन्त्रता नहीं; इतनी स्वतन्त्रता है कि कर्म को बन्धन से मुक्ति की ओर लगाए या बन्धन बनाए रखने में।","en":"We are not free to avoid action; we are free to direct action toward release from bondage or toward maintaining bondage."},"side":{"kind":"cards","items":[{"h":{"hi":"मुक्ति की दिशा","en":"Toward freedom"},"p":{"hi":"कर्तापन और स्वार्थ की पकड़ ढीली करने वाला कर्म।","en":"Action that loosens doership and self-interest."}},{"h":{"hi":"बन्धन की दिशा","en":"Toward bondage"},"p":{"hi":"“मेरे लिए” और “मैं कर रहा हूँ” को पुष्ट करने वाला कर्म।","en":"Action that reinforces “for me” and “I am doing.”"}}]},"cue":{"hi":"अगले पाठ का सेतु बनाएँ: कर्म अनिवार्य है; अब प्रश्न है—उसे कैसे किया जाए?","en":"Bridge to the next lesson: action is unavoidable; the question now is how it should be done."}},{"type":"reflect","title":{"hi":"क्रिया को फिर से देखें","en":"Look again at action"},"tag":{"hi":"चर्चा और आत्म-अवलोकन","en":"Discussion and self-observation"},"prompts":[{"hi":"स्वाभाविक रूप से क्रिया हो रही है या हम कर रहे हैं?","en":"Is action occurring naturally, or are we doing it?"},{"hi":"अगर हम कर रहे हैं, तो उसे शुरू या बन्द करने में क्या हम स्वतन्त्र हैं?","en":"If we are doing it, are we free to start or stop it?"}],"cue":{"hi":"दोनों प्रश्न PDF से हैं। उत्तर से पहले किसी एक शारीरिक क्रिया को प्रत्यक्ष देखें।","en":"Both questions are from the PDF. Before answering, directly observe one bodily process."}}]},CHAPTER=7;
  const $=s=>document.querySelector(s),lang=()=>document.body.dataset.lang;let slide=0,notes=false;const text=v=>typeof v==='string'?v:(v?.[lang()]||'');
  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return'<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='chain')return'<div class="panel chain">'+s.rows.map(r=>'<div class="chain-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'</div>';if(s.kind==='story')return'<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function verses(lines){return lines.map(v=>v==='__GAP__'?'<span class="gap"></span>':v).join('<br>')}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title')core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>';else if(s.type==='reflect')core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>';else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+verses(s.verse)+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return'<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){$('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
  </script>
</body>
