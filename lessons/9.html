  <script>

AP__","नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन ।","न चास्य सर्वभूतेषु कश्चिदर्थव्यपाश्रयः ॥ ३.१८ ॥"],"meaning":{"hi":"जो आत्मा में रमण, तृप्ति और सन्तोष पाता है, उसके लिए कोई कर्तव्य शेष नहीं; कर्म या अकर्म से उसका स्वार्थ-संबंध नहीं रहता।","en":"One who delights, is fulfilled and rests content in the Self has no duty left; neither action nor inaction serves a selfish end."},"cue":{"hi":"“कोई कर्तव्य नहीं” को आलस्य नहीं, पूर्ण तृप्ति और स्वार्थ-रहितता की परिणति के रूप में समझाएँ।","en":"Explain “no duty remains” not as laziness, but as the culmination of complete contentment and freedom from self-interest."}},{"title":{"hi":"माप—पूर्ण सन्तुष्टि","en":"The measure—complete contentment"},"tag":{"hi":"अचाह की स्थिति","en":"The state of non-wanting"},"lead":{"hi":"इस प्रकार कर्म तब तक करना है जब तक किसी भी प्रकार की किंचित चाह शेष है। पूर्ण सन्तुष्टि का अर्थ है—पाने को कुछ नहीं, बचाने को कुछ नहीं।","en":"Act in this way while even the slightest demand remains. Complete contentment means nothing to acquire and nothing to protect."},"side":{"kind":"cards","items":[{"h":{"hi":"आत्मरति","en":"Delight in the Self"},"p":{"hi":"रमण बाहर की वस्तु पर आश्रित नहीं।","en":"Delight no longer depends on an external object."}},{"h":{"hi":"आत्मतृप्ति","en":"Fulfilment in the Self"},"p":{"hi":"अपूर्णता की माँग शेष नहीं।","en":"No demand born of incompleteness remains."}},{"h":{"hi":"आत्मसन्तोष","en":"Contentment in the Self"},"p":{"hi":"कर्म और अकर्म से निजी प्रयोजन नहीं।","en":"Neither action nor inaction serves a private end."}}]},"cue":{"hi":"अचाह को निष्क्रियता नहीं, भीतर की अनाश्रित पूर्णता कहें।","en":"Present non-wanting not as passivity, but as inward, independent completeness."}},{"title":{"hi":"चाह का मूल—अहम्","en":"The root of wanting—the ego"},"tag":{"hi":"“मैं हूँ” से कर्ता तक","en":"From “I am” to the doer"},"lead":{"hi":"जब तक अहम् का किंचित अस्तित्व है, कर्ता उपस्थित है; तब पाने, करने या न करने की चाह भी रहती है।","en":"As long as even a trace of ego remains, the doer remains—with the urge to gain, to act or not to act."},"side":{"kind":"chain","rows":[[{"hi":"अहम्","en":"Ego"},{"hi":"कर्ता","en":"Doer"}],[{"hi":"कर्ता","en":"Doer"},{"hi":"चाह","en":"Wanting"}],[{"hi":"चाह","en":"Wanting"},{"hi":"परिस्थिति का असर","en":"Impact of circumstance"}],[{"hi":"असर","en":"Impact"},{"hi":"कर्मबन्धन","en":"Bondage to action"}]]},"cue":{"hi":"यहाँ सफलता का माप बाहरी उपलब्धि नहीं, परिस्थिति के असर से मुक्ति है।","en":"Here success is measured not by achievement, but by freedom from the impact of circumstance."}},{"title":{"hi":"कर्म और अकर्म—दोनों से अप्रयोजन","en":"No private end in action or inaction"},"tag":{"hi":"स्वार्थ-संबंध का अन्त","en":"The end of self-interest"},"lead":{"hi":"मुक्त व्यक्ति को कर्म करने से कुछ पाना नहीं और न करने से कुछ बचाना नहीं; किसी प्राणी पर किंचित स्वार्थ-आश्रय भी नहीं।","en":"The free person gains nothing through action and protects nothing through inaction; no being is treated as a support for self-interest."},"side":{"kind":"story","quote":{"hi":"“तृप्ति बाहर से आए—यह अपेक्षा समाप्त।”","en":"“The expectation that fulfilment must come from outside has ended.”"},"text":{"hi":"इसीलिए कर्म चलता रह सकता है, पर कर्मबन्धन का आधार नहीं रहता।","en":"Action may continue, but the basis of bondage to action is gone."}},"cue":{"hi":"कर्म का दृश्य रूप बना रह सकता है; बदलता है उसका निजी प्रयोजन और आश्रय।","en":"The outward form of action may remain; what changes is its private purpose and dependence."}},{"type":"reflect","title":{"hi":"सफलता का सही माप","en":"The true measure of success"},"tag":{"hi":"चर्चा और आत्म-अवलोकन","en":"Discussion and self-observation"},"prompts":[{"hi":"सफलता—कर्मबन्धन से मुक्ति—के लिए क्या आवश्यक है?","en":"What is necessary for success—freedom from bondage to action?"},{"hi":"सफलता में बाधा क्या है?","en":"What obstructs that success?"}],"cue":{"hi":"दोनों प्रश्न PDF से हैं। उत्तर को “अचाह”, “अहम्” और “असर” से जोड़कर देखें।","en":"Both questions are from the PDF. Relate the answers to non-wanting, ego and the impact of circumstance."}}]},CHAPTER=9;

  function render(){$('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
  </script>
</body>
</html>
