  <script>
  const DATA={"title":{"hi":"मोह","en":"Attachment & Delusion"},"desc":{"hi":"संबंध, चाह और संदेह—निर्णय को क्या संचालित करता है?","en":"Relationships, wanting, and doubt—what drives a decision?"},"slides":[{"type":"title","title":{"hi":"मोह","en":"Attachment & Delusion"},"lead":{"hi":"जब संबंध और सिद्धान्त आमने-सामने हों, तब निर्णय की कसौटी क्या हो?","en":"When relationship and principle stand opposed, what should decide our action?"},"tag":{"hi":"पाठ 01 · अर्जुन-विषाद","en":"Lesson 01 · Arjuna’s crisis"},"cue":{"hi":"आरम्भ में “मोह” को केवल भावुकता नहीं, निर्णय को धुँधला करने वाली आसक्ति के रूप में रखें।","en":"Frame attachment not merely as emotion, but as attachment that clouds judgment."}},{"title":{"hi":"संबंध या सिद्धान्त?","en":"Relationship or principle?"},"lead":{"hi":"दुर्योधन द्रोणाचार्य को विपक्ष के उन्हीं योद्धाओं की याद दिलाता है जिन्हें वे भली-भाँति जानते थे। उसे आशंका थी—स्नेह कहीं कर्तव्य पर भारी न पड़ जाए।","en":"Duryodhana reminds Dronacharya of warriors he already knew. His concern was that affection might outweigh duty."},"tag":{"hi":"प्रसंग · अध्याय 1, श्लोक 3–8","en":"Context · Chapter 1, verses 3–8"},"side":{"kind":"cards","items":[{"h":{"hi":"परिस्थिति","en":"The situation"},"p":{"hi":"प्रिय व्यक्ति विरोधी पक्ष में भी हो सकता है।","en":"A loved person may stand on the opposing side."}},{"h":{"hi":"निर्णय","en":"The decision"},"p":{"hi":"प्राथमिकता किसे—संबंध को या सिद्धान्त को?","en":"Which takes priority—relationship or principle?"}}]},"cue":{"hi":"श्रोताओं से तुरंत उत्तर न लें; उन्हें अपने जीवन की किसी ऐसी स्थिति को याद करने दें।","en":"Do not seek an instant answer; let listeners recall a similar conflict in their own lives."}},{"title":{"hi":"चिन्ता और शोक की जड़","en":"The root of anxiety and grief"},"lead":{"hi":"अर्जुन राज्य चाहता है, पर स्वजनों का विनाश नहीं। एक ही चाह के दो चेहरे हैं।","en":"Arjuna wants the kingdom, but not the destruction of his kin. One wanting has two faces."},"tag":{"hi":"प्रसंग · अध्याय 1, श्लोक 22–25","en":"Context · Chapter 1, verses 22–25"},"side":{"kind":"equation","rows":[[{"hi":"जो नहीं है","en":"What is absent"},{"hi":"मिल जाए","en":"must be gained"}],[{"hi":"जो है","en":"What is present"},{"hi":"नष्ट न हो","en":"must not be lost"}]],"foot":{"hi":"प्राप्ति की इच्छा + खोने का भय = चाह","en":"Desire to gain + fear of loss = wanting"}},"cue":{"hi":"समझाएँ कि परिस्थिति नहीं, उससे जुड़ी अपनी चाह भीतर चिन्ता पैदा करती है।","en":"Emphasize that anxiety arises from our wanting attached to the situation—not from the situation itself."}},{"title":{"hi":"संदेह बार-बार तर्क देता है","en":"Doubt keeps arguing"},"lead":{"hi":"अर्जुन युद्ध न करने के निर्णय के पक्ष में अनेक तर्क देता है। जब निर्णय दृढ़ हो, उसे बार-बार प्रमाणित करने की आवश्यकता नहीं रहती।","en":"Arjuna offers many arguments for not fighting. A truly firm decision does not need repeated self-justification."},"tag":{"hi":"प्रसंग · अध्याय 1, श्लोक 38–44","en":"Context · Chapter 1, verses 38–44"},"side":{"kind":"story","quote":{"hi":"अधिक तर्क कभी-कभी अधिक स्पष्टता नहीं—भीतर के संदेह का संकेत होते हैं।","en":"More arguments do not always mean more clarity; sometimes they reveal inner doubt."},"text":{"hi":"निर्णय के पीछे भय, आसक्ति या सत्य—किसकी आवाज़ है?","en":"Behind the decision, whose voice is speaking: fear, attachment, or truth?"}},"cue":{"hi":"यहाँ तर्क-विरोध नहीं करें; केवल आत्म-औचित्य और स्पष्ट विवेक में भेद रखें।","en":"Do not oppose reasoning; distinguish self-justification from clear discernment."}},{"type":"reflect","title":{"hi":"अपने निर्णय को देखें","en":"Examine your decision"},"tag":{"hi":"मनन · संवाद","en":"Reflect · Discuss"},"prompts":[{"hi":"कब संबंध और सिद्धान्त में टकराव हुआ?","en":"When did relationship and principle conflict for you?"},{"hi":"आज की किसी चिन्ता में—क्या पाने की इच्छा या खोने का भय है?","en":"In a current worry, what do you wish to gain or fear losing?"},{"hi":"किस निर्णय को आप बार-बार उचित ठहरा रहे हैं?","en":"Which decision are you repeatedly trying to justify?"}],"cue":{"hi":"एक प्रश्न चुनें और दो मिनट मौन दें; फिर इच्छुक लोगों से अनुभव साझा करवाएँ।","en":"Choose one question, allow two minutes of silence, then invite voluntary sharing."}}]}, CHAPTER=1;
  const $=s=>document.querySelector(s), lang=()=>document.body.dataset.lang;

  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}
  function sideHTML(s){if(!s)return'';if(s.kind==='cards')return '<div class="cards">'+s.items.map(i=>'<div class="mini"><b>'+text(i.h)+'</b><p>'+text(i.p)+'</p></div>').join('')+'</div>';if(s.kind==='equation')return '<div class="panel equation">'+s.rows.map(r=>'<div class="eq-row"><strong>'+text(r[0])+'</strong><span>→</span><strong>'+text(r[1])+'</strong></div>').join('')+'<p><b>'+text(s.foot)+'</b></p></div>';if(s.kind==='story')return '<div class="story"><blockquote>'+text(s.quote)+'</blockquote><p>'+text(s.text)+'</p></div>';return''}
  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title'){core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>'}else if(s.type==='reflect'){core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>'}else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+s.verse.join('<br>')+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return '<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){document.querySelector('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}
  function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}
  function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});
  const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
</script>
</body>
