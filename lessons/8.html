  <script>
  const DATA={"title":{"hi":"कर्म कैसे करना चाहिए","en":"How Action Should Be Done"},"slides":[{"type":"title","title":{"hi":"कर्म कैसे करना चाहिए","en":"How Action Should Be Done"},"lead":{"hi":"कर्म अनिवार्य है—पर उसे किस प्रकार करें कि वही कर्म बन्धन से मुक्त करे?","en":"Action is unavoidable—but how can the same action free us from bondage?"},"tag":{"hi":"पाठ 08 · यज्ञरूप कर्म","en":"Lesson 08 · Action as yajña"},"cue":{"hi":"पाठ 7 से जोड़ें: प्रश्न अब कर्म करना या न करना नहीं, कर्म का भाव और उद्देश्य है।","en":"Connect to Lesson 7: the issue is no longer action versus inaction, but the spirit and purpose of action."}},{"title":{"hi":"कर्म को यज्ञ बनाओ","en":"Make action an offering"},"tag":{"hi":"गीता 3.9","en":"Gita 3.9"},"verse":["यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः ।","तदर्थं कर्म कौन्तेय मुक्तसङ्गः समाचर ॥ ३.९ ॥"],"meaning":{"hi":"यज्ञ के लिए किए कर्म के अतिरिक्त अन्य कर्म बाँधते हैं; इसलिए आसक्ति से मुक्त होकर यज्ञ के निमित्त कर्तव्य कर्म करो।","en":"Action other than that done for yajña binds; therefore perform duty for that offering, free from attachment."},"cue":{"hi":"यहाँ यज्ञ को केवल अनुष्ठान नहीं, देने के भाव में किया गया कर्म समझाएँ।","en":"Explain yajña here not merely as ritual, but as action performed in the spirit of giving."}},{"title":{"hi":"यज्ञ का अर्थ—केवल देना","en":"Yajña means giving"},"tag":{"hi":"दूसरे के हित के लिए","en":"For another’s welfare"},"lead":{"hi":"जो परिस्थिति, सामग्री या सामर्थ्य हमारे पास है, उसका उपयोग दूसरे के उचित अभाव और हित की पूर्ति में हो।","en":"Whatever circumstance, resources or capacity we have is used to meet another’s rightful need and welfare."},"side":{"kind":"cards","items":[{"h":{"hi":"क्रियात्मक यज्ञ","en":"Yajña in action"},"p":{"hi":"कर्म करके दूसरे के उचित हित में योगदान।","en":"Contribute through action to another’s rightful welfare."}},{"h":{"hi":"भावात्मक यज्ञ","en":"Yajña in attitude"},"p":{"hi":"किसी के प्रति बुरा भाव न रखना।","en":"Do not harbour ill will toward anyone."}},{"h":{"hi":"विवेक की सीमा","en":"The boundary of discernment"},"p":{"hi":"दूसरे का संकल्प अहितकारी हो तो उसे पूरा करना कर्तव्य नहीं।","en":"A harmful wish is not a duty merely because another person holds it."}}]},"cue":{"hi":"“दूसरे के संकल्प” के साथ PDF की स्पष्ट सीमा जोड़ें—अहित करने वाला कर्म यज्ञ नहीं।","en":"Pair “another’s wish” with the PDF’s explicit limit: harmful action is not yajña."}},{"title":{"hi":"यज्ञ-कुण्ड का दृश्य","en":"The yajña-kund image"},"tag":{"hi":"सब कुछ अग्नि के लिए","en":"Everything is for the fire"},"lead":{"hi":"किसी के सामने सामग्री अधिक है, किसी के सामने कम; उद्देश्य एक है—जो मिला है उसकी आहुति देना।","en":"Some have more material, some less; the purpose is one—to offer whatever has been received."},"side":{"kind":"story","quote":{"hi":"“अपने लिए कुछ भी नहीं।”","en":"“Nothing is kept for oneself.”"},"text":{"hi":"यज्ञ में कोई सामग्री बचाकर घर नहीं ले जाता। वह जानता है कि यह सामग्री आहुति के लिए ही है—यही कर्म करने की विद्या है।","en":"No participant saves the offerings to take home. They are understood to exist for the offering—this is the art of action."}},"cue":{"hi":"सामग्री को धन तक सीमित न करें; समय, कौशल, अवसर और सामर्थ्य भी इसमें आते हैं।","en":"Do not reduce material to money; it includes time, skill, opportunity and capacity."}},{"title":{"hi":"यज्ञ का शेष—मुक्ति","en":"What remains of yajña—freedom"},"tag":{"hi":"गीता 3.13","en":"Gita 3.13"},"verse":["यज्ञशिष्टाशिनः सन्तो मुच्यन्ते सर्वकिल्बिषैः ।","भुञ्जते ते त्वघं पापा ये पचन्त्यात्मकारणात् ॥ ३.१३ ॥"],"meaning":{"hi":"यज्ञ से बचे अन्न को ग्रहण करने वाले पापों से मुक्त होते हैं; केवल अपने पोषण के लिए पकाने वाले पाप को ही खाते हैं।","en":"Those who partake of what remains after yajña are freed from faults; those who cook only for themselves partake of wrongdoing."},"cue":{"hi":"श्लोक को भोजन से आगे कर्म के स्वार्थी या अर्पित भाव के भेद तक खोलें।","en":"Extend the verse beyond food to the distinction between self-serving and offered action."}},{"title":{"hi":"फल—समता और शान्ति","en":"The fruit—equanimity and peace"},"tag":{"hi":"भस्म नहीं, आशीर्वाद","en":"Not possession, but blessing"},"lead":{"hi":"यज्ञ के बाद भस्म आशीर्वाद की तरह मिलती है; यज्ञरूप कर्म के बाद समता, शान्ति और उद्देश्य-पूर्ति शेष रहती है।","en":"Ash is received as a blessing after yajña; after action-as-offering, equanimity, peace and fulfilment of purpose remain."},"side":{"kind":"chain","rows":[[{"hi":"जो मिला","en":"What is received"},{"hi":"आहुति","en":"Offering"}],[{"hi":"दूसरे का हित","en":"Another’s welfare"},{"hi":"यज्ञ","en":"Yajña"}],[{"hi":"यज्ञ का शेष","en":"What remains"},{"hi":"समता · शान्ति","en":"Equanimity · peace"}]]},"cue":{"hi":"लाभ को बाहरी प्रतिफल नहीं, भीतर की समता और कर्मबन्धन की शिथिलता के रूप में रखें।","en":"Frame the gain not as external reward, but as inner equanimity and loosening of bondage."}},{"title":{"hi":"परिस्थिति साधन है","en":"Circumstance is material for offering"},"tag":{"hi":"अनुकूलता और प्रतिकूलता","en":"Favourable and adverse conditions"},"lead":{"hi":"परिस्थिति को पाने या बचाने की वस्तु नहीं, उद्देश्य और दूसरे के हित में उपयोग होने वाली सामग्री समझें।","en":"Treat circumstance not as something to acquire or preserve, but as material to be used for the purpose and another’s welfare."},"side":{"kind":"cards","items":[{"h":{"hi":"अनुकूलता","en":"Favourable conditions"},"p":{"hi":"उपलब्ध सामर्थ्य को अर्पित करें।","en":"Offer the capacity now available."}},{"h":{"hi":"प्रतिकूलता","en":"Adverse conditions"},"p":{"hi":"समता और विवेक के अभ्यास में उपयोग करें।","en":"Use them to practise equanimity and discernment."}}]},"cue":{"hi":"यह स्लाइड PDF के दूसरे चर्चा-प्रश्न की तैयारी है।","en":"This slide prepares the PDF’s second discussion question."}},{"type":"reflect","title":{"hi":"कर्म का उद्देश्य जाँचें","en":"Examine the purpose of action"},"tag":{"hi":"चर्चा और आत्म-अवलोकन","en":"Discussion and self-observation"},"prompts":[{"hi":"कर्म का उद्देश्य समता की पूर्ति हो, या अप्राप्त की प्राप्ति और प्राप्त की रक्षा?","en":"Should action fulfil equanimity, or acquire what is absent and protect what is possessed?"},{"hi":"अनुकूल या प्रतिकूल परिस्थिति का उपयोग किस प्रकार हो सकता है?","en":"How can favourable or adverse circumstances be used?"}],"cue":{"hi":"दोनों प्रश्न PDF से हैं। किसी आज के कर्म को लेकर उसके उद्देश्य और उपयोग को जाँचें।","en":"Both questions are from the PDF. Examine the purpose and use of one action from today."}}]},CHAPTER=8;
  const $=s=>document.querySelector(s),lang=()=>document.body.dataset.lang;let slide=0,notes=false;const text=v=>typeof v==='string'?v:(v?.[lang()]||'');
  function localize(){document.documentElement.lang=lang();$('#langBtn').textContent=lang()==='hi'?'EN':'हिं';document.title=text(DATA.title)+' — '+(lang()==='hi'?'गीता जीवन-पाठ':'Gita Life Lessons')}

  function slideHTML(s,i,total){const dark=s.type==='title'||s.type==='reflect';let core='';if(s.type==='title')core='<div class="slide-grid"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="rule"></div><p class="lead">'+text(s.lead)+'</p></div><div class="title-seal"><strong>'+String(CHAPTER).padStart(2,'0')+'</strong></div></div>';else if(s.type==='reflect')core='<div class="slide-grid single"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2><div class="prompt-list">'+s.prompts.map(p=>'<div>'+text(p)+'</div>').join('')+'</div></div></div>';else{const v=s.verse?'<div class="verse"><div class="verse-ref">'+text(s.tag)+'</div><p class="shloka">'+verses(s.verse)+'</p><p class="meaning">'+text(s.meaning)+'</p></div>':'';core='<div class="slide-grid '+(s.side?'':'single')+'"><div><div class="eyebrow">'+text(s.tag)+'</div><h2>'+text(s.title)+'</h2>'+(s.lead?'<p class="lead">'+text(s.lead)+'</p>':'')+v+'</div>'+(s.side?'<div>'+sideHTML(s.side)+'</div>':'')+'</div>'}return'<section class="slide '+(dark?'dark':'')+' '+(i===slide?'active':'')+'" aria-hidden="'+(i!==slide)+'"><span class="folio">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>'+core+'<aside class="notes" '+(notes&&i===slide?'':'hidden')+'><b>'+(lang()==='hi'?'वक्ता-सूत्र':'SPEAKER CUE')+'</b>'+text(s.cue)+'</aside></section>'}
  function render(){$('#stage').innerHTML=DATA.slides.map((s,i)=>slideHTML(s,i,DATA.slides.length)).join('');$('#counter').textContent=(slide+1)+' / '+DATA.slides.length;const p=$('#progress');p.innerHTML='';DATA.slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===slide?' active':'');b.title=String(i+1);b.setAttribute('aria-label',(lang()==='hi'?'स्लाइड ':'Slide ')+(i+1));b.onclick=()=>go(i);p.appendChild(b)});localize()}
  function syncUrl(){const u=new URL(location);u.searchParams.set('lang',lang());if(slide)u.searchParams.set('slide',slide+1);else u.searchParams.delete('slide');history.replaceState({},'',u)}function go(n){slide=Math.max(0,Math.min(DATA.slides.length-1,n));notes=false;render();syncUrl()}function setLang(l){document.body.dataset.lang=l;render();syncUrl()}
  $('#langBtn').onclick=()=>setLang(lang()==='hi'?'en':'hi');$('#notesBtn').onclick=()=>{notes=!notes;render()};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(slide+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(slide-1)}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.slides.length-1);if(e.key.toLowerCase()==='n')$('#notesBtn').click();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});
  let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55)go(slide+(d<0?1:-1))},{passive:true});const q=new URLSearchParams(location.search);document.body.dataset.lang=q.get('lang')==='en'?'en':'hi';slide=Math.max(0,Math.min(DATA.slides.length-1,(Number(q.get('slide'))||1)-1));render();
  </script>
</body>
