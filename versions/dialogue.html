  <title>गीता का मुख्य उद्देश्य — संवाद प्रस्तुति</title>
  <style>

    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--ink);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
    .deck{position:relative;width:100%;height:100dvh;isolation:isolate}.deck:before{content:"";position:fixed;inset:0;z-index:20;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");mix-blend-mode:multiply}
    .slide{--art-pos:76% center;position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:5.8rem 1.35rem 7.4rem;background-image:linear-gradient(100deg,rgba(245,239,223,.98),rgba(249,244,232,.94) 58%,rgba(238,224,197,.83)),var(--art);background-size:cover,cover;background-position:center,var(--art-pos);background-repeat:no-repeat}.slide.active{display:grid;animation:page-in .55s cubic-bezier(.2,.8,.25,1) both}.slide.dark{color:var(--paper);background-image:linear-gradient(100deg,rgba(27,41,36,.99),rgba(27,41,36,.94) 58%,rgba(20,39,34,.84)),var(--art)}.slide:nth-child(3n+2){--art-pos:65% center}.slide:nth-child(4n){--art-pos:42% center}.slide:after{content:"";position:fixed;inset:.65rem;pointer-events:none;border:1px solid rgba(101,80,47,.18)}.slide.dark:after{border-color:rgba(225,201,158,.16)}
    .slide-grid{position:relative;z-index:2;align-self:center;width:100%;max-width:82rem;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;align-items:center}.slide-grid>*{min-width:0}.slide-copy{max-width:62rem}.folio{position:absolute;z-index:3;top:1.35rem;left:1.35rem;display:flex;align-items:center;gap:.7rem;font-size:.88rem;letter-spacing:.08em;color:rgba(27,41,36,.58)}.folio:before{content:"॥";font-family:var(--display);font-size:1.1rem;color:var(--verm)}.dark .folio{color:rgba(245,239,223,.64)}.dark .folio:before{color:var(--saffron)}
    .eyebrow{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem;color:var(--verm);font-size:.94rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.eyebrow:before{content:"";width:2.4rem;height:2px;background:currentColor}.dark .eyebrow{color:#f1aa72}.slide h1{margin:0 0 1.4rem;font-family:var(--display);font-size:clamp(2.1rem,8vw,5.65rem);font-weight:400;line-height:1.08;letter-spacing:-.025em;overflow-wrap:anywhere}.slide.title h1{font-size:clamp(3.2rem,11vw,8.4rem);line-height:.98}.slide.divider h1{font-size:clamp(2.75rem,10vw,7rem)}.slide h1 em{font-style:normal;color:var(--verm)}.dark h1 em{color:var(--saffron)}.lead{max-width:44ch;margin:0;color:var(--ink-soft);font-size:clamp(1.08rem,2.5vw,1.55rem);line-height:1.52;overflow-wrap:anywhere}.dark .lead{color:rgba(245,239,223,.78)}.micro{margin-top:2rem;padding-top:1rem;max-width:42rem;border-top:1px solid var(--line);color:var(--verm);font-size:clamp(.95rem,1.7vw,1.12rem);line-height:1.45}.dark .micro{border-color:rgba(245,239,223,.2);color:#f1aa72}
    .artifact{width:100%;display:grid;align-content:center;gap:.75rem}.stamp{display:grid;place-items:center;min-height:11rem;padding:1.5rem;border:1px solid rgba(185,79,44,.3);background:rgba(255,250,238,.36);color:var(--verm);font-family:var(--display);font-size:clamp(2.8rem,12vw,7rem);font-weight:400;text-align:center;line-height:1.1;overflow-wrap:anywhere}.dark .stamp{border-color:rgba(235,191,127,.35);background:rgba(255,248,225,.035);color:#eaa85f}.title .stamp,.divider .stamp{min-height:15rem;border-radius:50%;aspect-ratio:1;width:min(65vw,22rem);justify-self:center;background:rgba(255,248,225,.025);box-shadow:inset 0 0 0 .8rem rgba(201,155,81,.07)}.artifact-card{padding:1.15rem 1.25rem;border:1px solid var(--line);border-left:3px solid var(--gold);background:rgba(255,251,243,.68);box-shadow:0 .7rem 1.8rem rgba(73,47,22,.07);backdrop-filter:blur(2px)}.artifact-card strong{display:block;margin-bottom:.25rem;font-family:var(--display);font-size:clamp(1.2rem,2.5vw,1.75rem);font-weight:400;line-height:1.2;overflow-wrap:anywhere}.artifact-card p{margin:0;color:var(--ink-soft);font-size:clamp(.95rem,1.6vw,1.12rem);line-height:1.45}.dark .artifact-card{border-color:rgba(245,239,223,.2);border-left-color:var(--gold);background:rgba(255,248,225,.07)}.dark .artifact-card p{color:rgba(245,239,223,.75)}.artifact-card.accent{border-left-color:var(--verm)}.dark .artifact-card.accent{border-left-color:var(--saffron)}
    .map{display:grid;gap:.65rem}.map-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.8rem;padding:1rem 1.1rem;border:1px solid var(--line);background:rgba(255,251,243,.65)}.map-row b{font-family:var(--display);font-size:clamp(1.65rem,4vw,2.8rem);font-weight:400}.map-row b:last-child{color:var(--verm)}.map-row i{color:var(--gold);font-style:normal;font-size:1.45rem}.dark .map-row{border-color:rgba(245,239,223,.2);background:rgba(255,248,225,.07)}.dark .map-row b:last-child{color:var(--saffron)}.map-caption{margin-top:.4rem;color:var(--ink-soft);font-size:1rem;line-height:1.4}.dark .map-caption{color:rgba(245,239,223,.73)}
    .chrome{position:fixed;inset:0;z-index:30;pointer-events:none}.progress-line{position:absolute;inset:0 0 auto;height:4px;background:rgba(27,41,36,.17)}.progress-fill{height:100%;width:4%;background:var(--saffron);transition:width .3s ease}.top-tools{position:absolute;top:max(.9rem,env(safe-area-inset-top));right:max(1rem,env(safe-area-inset-right));display:flex;gap:.5rem;pointer-events:auto}.chrome button{min-width:44px;min-height:44px;padding:.55rem .8rem;border:1px solid rgba(245,239,223,.25);border-radius:999px;background:rgba(27,41,36,.9);color:var(--paper);cursor:pointer;transition:background .2s,transform .2s}.chrome button:hover{background:#9e4427;transform:translateY(-2px)}.chrome button[disabled]{opacity:.45;cursor:not-allowed}.chrome button[disabled]:hover{background:rgba(27,41,36,.9);transform:none}.top-tools button{font-size:.92rem;font-weight:700}.bottom-tools{position:absolute;bottom:max(.9rem,env(safe-area-inset-bottom));left:1rem;right:1rem;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;pointer-events:auto}.slide-count{min-width:4.4rem;color:var(--paper);font-size:.92rem;font-variant-numeric:tabular-nums}.nav-buttons{display:flex;gap:.5rem}.nav-buttons button{width:46px;height:46px;padding:0;font-size:1.25rem}.dots{display:none;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;white-space:nowrap;justify-content:center}.dots::-webkit-scrollbar{display:none}.dot{flex:0 0 44px;width:44px;height:44px;padding:0!important;border:0!important;background:transparent!important;box-shadow:none}.dot:after{content:"";display:block;width:.36rem;height:.36rem;margin:auto;border-radius:50%;background:rgba(245,239,223,.44);transition:width .2s,background .2s}.dot.active:after{width:1.18rem;border-radius:1rem;background:var(--saffron)}.keys{display:none;color:rgba(245,239,223,.57);font-size:.78rem}
    .notes{display:none;position:fixed;z-index:50;left:1rem;right:1rem;bottom:5.2rem;max-height:38vh;overflow-y:auto;padding:1rem 1.25rem;border-left:4px solid var(--saffron);background:rgba(25,39,34,.98);color:var(--paper);box-shadow:0 1rem 3rem rgba(0,0,0,.3);font-size:1rem;line-height:1.5}body.show-notes .slide.active .notes{display:block}.notes b{display:block;margin-bottom:.25rem;color:#f2ad78;font-size:.86rem;letter-spacing:.08em}
    @keyframes page-in{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(min-width:768px){.slide{--art-pos:center;padding:6.5rem clamp(2.5rem,6vw,6.5rem) 7rem;background-image:linear-gradient(100deg,rgba(245,239,223,.97),rgba(249,244,232,.9) 58%,rgba(238,224,197,.71)),var(--art)}.slide.dark{background-image:linear-gradient(100deg,rgba(27,41,36,.98),rgba(27,41,36,.91) 58%,rgba(20,39,34,.72)),var(--art)}.slide-grid{grid-template-columns:minmax(0,1.35fr) minmax(15rem,.65fr);gap:clamp(2rem,5vw,5rem)}.folio{top:2rem;left:clamp(2.5rem,5vw,5rem)}.artifact{max-width:31rem;justify-self:end}.bottom-tools{left:clamp(2rem,4vw,4rem);right:clamp(2rem,4vw,4rem)}.dots{display:flex;justify-content:flex-start;max-width:min(46vw,42rem)}.notes{left:50%;right:auto;width:min(48rem,80vw);transform:translateX(-50%)}}
    @media(min-width:1024px){.slide-grid{grid-template-columns:minmax(0,1.25fr) minmax(18rem,.75fr)}.keys{display:block;position:absolute;right:1.5rem;top:4.7rem}.lead{font-size:clamp(1.2rem,1.8vw,1.55rem)}}
    @media(max-height:700px){.slide{padding-top:4.4rem;padding-bottom:5.7rem}.slide h1{font-size:clamp(2rem,6vw,4.5rem)}.slide.title h1{font-size:clamp(2.8rem,8vw,6rem)}.artifact-card{padding:.8rem 1rem}.stamp{min-height:8rem}}
    body[data-theme="light"] .slide-count{color:var(--ink)}body[data-theme="light"] .dot:not(.active):after{background:rgba(27,41,36,.45)}body[data-theme="light"] .keys{color:rgba(27,41,36,.62)}
    @media(max-width:767px){.slide{padding-top:6.5rem}.folio{top:4.5rem}}
    .edition-picker{position:relative;pointer-events:auto}.edition-picker summary{display:grid;place-items:center;min-width:44px;min-height:44px;padding:.55rem;border:1px solid rgba(245,239,223,.25);border-radius:999px;background:rgba(27,41,36,.9);color:var(--paper);font-size:.88rem;font-weight:700;cursor:pointer;list-style:none}.edition-picker summary::-webkit-details-marker{display:none}.edition-picker summary:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}.edition-picker[open] summary{background:#9e4427}.edition-menu{position:absolute;top:calc(100% + .6rem);right:0;width:min(17rem,78vw);padding:.45rem;border:1px solid rgba(245,239,223,.2);border-radius:.8rem;background:rgba(27,41,36,.98);box-shadow:0 1rem 2.5rem rgba(0,0,0,.28)}.edition-menu a{display:flex;align-items:center;min-height:44px;padding:.55rem .8rem;border-radius:.45rem;color:var(--paper);text-decoration:none;font-size:.9rem}.edition-menu a:hover,.edition-menu a:focus-visible{background:#9e4427;outline:none}.edition-menu a[aria-current="page"]{color:#f3b77f}
    @media print{@page{size:16in 9in;margin:0}body{overflow:visible;background:#fff}.deck{height:auto}.slide,.slide.active{position:relative;display:grid;width:16in;height:9in;page-break-after:always;overflow:hidden;animation:none}.slide:after{position:absolute}.chrome,.notes,.edition-picker{display:none!important}}

  <script>
    (() => {
      const b = (hi,en) => ({hi,en});
      const slides = [
        {kind:'title',phase:b('आरम्भ','Opening'),tag:b('एक आध्यात्मिक यात्रा','A spiritual journey'),title:b('गीता का\nमुख्य उद्देश्य','The Gita’s\nCore Objective'),lead:b('पराश्रय से मुक्त होकर स्वाश्रय में स्थित होना','To be free of dependence and abide in the Self'),stamp:b('स्व','SELF'),cue:b('सामग्री पहले पढ़ी जा सकती है। आज इसे भाषण की तरह न पढ़ें; श्रोताओं के अपने अनुभव से पहला प्रश्न उठाएँ।','The material may be read beforehand. Do not recite it as a lecture; begin with the audience’s own experience.')},
        {kind:'dark',phase:b('आरम्भ','Opening'),tag:b('प्रस्तुति का तरीका','How we will proceed'),title:b('यह पाठ नहीं—\nएक संवाद है','Not a lecture—\na conversation'),lead:b('एक प्रश्न रखिए। उत्तर श्रोताओं से आने दीजिए।','Put forward one question. Let the audience supply the first answer.'),stamp:b('संवाद','DIALOGUE'),cue:b('पढ़कर आए और पहली बार सुन रहे—दोनों को साथ रखें। किसी उत्तर का मूल्यांकन न करें; उसी से अगला प्रश्न चुनें।','Include both prepared and first-time participants. Do not judge an answer; use it to choose the next question.')},
        {kind:'divider',phase:b('01 · पराश्रय','01 · Dependence'),tag:b('पहला प्रकरण','First inquiry'),title:b('शांति का आधार\nकहाँ है?','What holds\nmy peace?'),lead:b('पहले “पर” को पहचानें। फिर देखें—उसका आश्रित होना क्या है?','First identify “the other.” Then examine what depending on it means.'),stamp:b('01','01'),cue:b('इस प्रकरण में “स्व” की परिभाषा जल्दी न दें। पहले श्रोताओं के जीवन से पराश्रय की कसौटी निकलने दें।','Do not define the Self too early. First let the audience derive a test of dependence from their own lives.')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('शांति की कसौटी','A test of peace'),title:b('क्या मेरी शांति\nदूसरे पर टिकी है?','Does my peace\nrest on another?'),lead:b('दूसरा मेरी इच्छा के अनुसार रहे—क्या यह मेरे नियंत्रण में है?','Can I make another person or circumstance stay as I wish?'),cards:[{h:b('एक सवाल','One question'),p:b('दूसरा बदल जाए, तो भीतर क्या बदलता है?','If the other changes, what changes within you?')}],cue:b('किसी वस्तु, व्यक्ति या परिणाम का उदाहरण पूछें। उत्तर देने से पहले ठहरें—बदलाव को श्रोता स्वयं पहचानें।','Ask for one object, person, or outcome. Pause before explaining; let participants recognize the change themselves.')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('एक सरल भेद','A simple distinction'),title:b('“पर” किसे कहें?','What is\n“the other”?'),lead:b('जो मुझसे भिन्न है—उसे “पर” कहने में क्या कठिनाई है?','Anything distinct from me is “the other.” Is that difficult to recognize?'),stamp:b('पर','OTHER'),cue:b('शास्त्रीय शब्दों से शुरुआत न करें। सामने की किसी चीज़ की ओर इशारा कर पूछें: यह आप हैं या आपसे भिन्न है?','Begin without technical terms. Point to something nearby: is it you, or distinct from you?')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('अपने अनुभव से जाँचें','Check from experience'),title:b('जो दिखता है,\nक्या वह मुझसे भिन्न है?','What I can see—\nis it distinct from me?'),lead:b('उत्तर किसी एक दृश्य चीज़ से शुरू करें।','Start with one visible thing, not a theory.'),cards:[{h:b('वस्तु','Object'),p:b('मेरे सामने है।','It is before me.')},{h:b('व्यक्ति','Person'),p:b('उसकी स्थिति बदल सकती है।','Their state can change.')},{h:b('परिस्थिति','Circumstance'),p:b('उसका परिणाम मेरे हाथ में नहीं।','Its outcome is not wholly mine to control.')}],cue:b('यहाँ केवल “दिखने वाला भिन्न है” तक आएँ। शरीर और “मैं” का सूक्ष्म प्रश्न तीसरे प्रकरण में आएगा।','Stay only with “what is seen is distinct.” The subtler body-and-I question belongs to the third inquiry.')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('आश्रय की पहचान','Recognizing dependence'),title:b('आश्रित होना\nकब होता है?','When am I\ndependent?'),lead:b('उसके होने या न होने से सुख-दुःख उठे—क्या यही संकेत है?','If its presence or absence changes my joy or sorrow, is that the sign?'),stamp:b('असर','IMPACT'),cue:b('बच्चों की कही सरल कसौटी से शुरू करें: “अगर उसका असर पड़ता है, तो हम आश्रित हैं।” इसे खुशी और दुख दोनों पर लागू करें।','Use the simple test the children offered: “If it affects us, we depend on it.” Apply it to both pleasure and pain.')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('अपनी ओर लौटें','Bring it home'),title:b('मेरा सुख\nकहाँ बँधा है?','Where is my\nhappiness tied?'),lead:b('वस्तु, व्यक्ति, परिस्थिति या उपलब्धि—किसके बदलने से मैं बदलता हूँ?','An object, person, circumstance, or achievement—which change unsettles me?'),cards:[{h:b('जो मिले','What I gain'),p:b('क्या उसे पाना ही शांति है?','Is acquiring it the same as peace?')},{h:b('जो छूटे','What I lose'),p:b('क्या उसके बिना मैं अधूरा हूँ?','Am I incomplete without it?')}],cue:b('किसी को अपनी निजी बात बताने के लिए मजबूर न करें। एक सामान्य उदाहरण लेकर पूछें: सुख का आधार बदलने पर स्थिरता कहाँ रहती है?','Do not require personal disclosure. Use a common example and ask what remains steady when the basis of happiness changes.')},
        {kind:'divider',phase:b('02 · स्वाश्रय','02 · Self-abidance'),tag:b('दूसरा प्रकरण','Second inquiry'),title:b('अब अपने होने\nको देखिए','Now attend to\nyour being'),lead:b('बाहरी सहारे से हटकर उस अनुभव पर आएँ जो सीधे अपना है।','Move from external support to an experience that is directly your own.'),stamp:b('02','02'),cue:b('यहाँ “मैं हूँ” की पूरी व्याख्या न करें। केवल होने के प्रत्यक्ष अनुभव और उसके बाहरी सहारे की आवश्यकता का प्रश्न रखें।','Do not fully explain “I am” yet. Ask only about direct awareness of being and whether it needs external support.')},
        {phase:b('02 · स्वाश्रय','02 · Self-abidance'),tag:b('सबसे निकट प्रश्न','The nearest question'),title:b('क्या आप हैं?','Are you here?'),lead:b('इसका उत्तर देने के लिए आपको किसका प्रमाण चाहिए?','Whose proof do you need to answer?'),stamp:b('हूँ','AM'),cue:b('समूह से एक साथ उत्तर न बुलवाएँ; कुछ लोगों को अलग-अलग पूछें। “हाँ” के बाद अगला प्रश्न है—यह अनुभव किसके सहारे है?','Ask a few people individually rather than seeking a chorus. After “yes,” ask what this experience relies upon.')},
        {phase:b('02 · स्वाश्रय','02 · Self-abidance'),tag:b('बिना दूसरे के','Without the other'),title:b('मेरे होने के लिए\nदूसरा चाहिए?','Does my being\nneed another?'),lead:b('दूसरे का होना या न होना—क्या मेरे “हैं” कहने का आधार है?','Does another’s presence or absence ground my sense of being?'),cards:[{h:b('दूसरा बदलता है','The other changes'),p:b('वस्तु, व्यक्ति, परिस्थिति।','Objects, people, circumstances.')},{h:b('होने का भान','Awareness of being'),p:b('इसे अभी सीधे जाँचिए।','Check it directly, now.')}],cue:b('यह आत्मनिर्भरता का सामाजिक दावा नहीं है। श्रोताओं को भीतर के होनेपन और बाहरी परिस्थिति में भेद देखने दें।','This is not a claim about social self-reliance. Help participants distinguish awareness of being from external circumstance.')},
        {phase:b('02 · स्वाश्रय','02 · Self-abidance'),tag:b('दो आधार','Two possible grounds'),title:b('पराश्रय और\nस्वाश्रय में क्या भेद?','Dependence and\nSelf-abidance: what differs?'),lead:b('एक में सुख दूसरे पर टिका है; दूसरे में होने का भान दूसरे से नहीं आता।','In one, happiness rests on the other; in the other, awareness of being does not arise from it.'),cards:[{h:b('पराश्रय','Dependence'),p:b('“वह बदले तो मेरा सुख बदलता है।”','“When that changes, my happiness changes.”')},{h:b('स्वाश्रय','Self-abidance'),p:b('“मेरे होने का अनुभव उसका मोहताज नहीं।”','“My sense of being does not need it.”')}],cue:b('इसे निष्कर्ष की तरह नहीं, तुलना की तरह रखें। पूछें—दोनों में से किस बात को आपने स्वयं अनुभव से जाँचा?','Present this as a comparison, not an imposed conclusion. Ask which part they checked for themselves.')},
        {kind:'divider',phase:b('03 · भेद','03 · Discernment'),tag:b('तीसरा प्रकरण','Third inquiry'),title:b('जो दिखता है,\nवह कौन है?','What exactly\nis seen?'),lead:b('अब “यह”, “मैं” और “हूँ” के बीच की गाँठ को जाँचें।','Now examine the knot between “this,” “I,” and “am.”'),stamp:b('03','03'),cue:b('पहले दो प्रकरणों का छोटा पुनरावलोकन लें। यहाँ से प्रश्न बाहरी वस्तु से शरीर, मन और पहचान तक आएगा।','Briefly recall the first two inquiries. The question now moves from external things to body, mind, and identity.')},
        {phase:b('03 · भेद','03 · Discernment'),tag:b('अपनी भाषा सुनिए','Listen to your own words'),title:b('“यह मेरा हाथ है”\nतो “मैं” कहाँ हूँ?','“This is my hand”—\nthen where is “I”?'),lead:b('जिसे मैं “यह” कहता हूँ, उसे “मैं” कैसे मान लिया?','How did something I call “this” become what I call “I”?'),cards:[{h:b('यह हाथ','This hand'),p:b('इसे मैं देखता हूँ।','I can see it.')},{h:b('यह विचार','This thought'),p:b('इसे उठते-बदलते जानता हूँ।','I know it arising and changing.')}],cue:b('हाथ, पैर, बाल जैसे सादे उदाहरण लें। कोई आपत्ति करे तो उसे जगह दें; उत्तर उसके अपने शब्दों “यह मेरा...” से आगे बढ़ाएँ।','Use plain examples such as hand, foot, or hair. Welcome objections and move from the participant’s own phrase, “this is my…”')},
        {phase:b('03 · भेद','03 · Discernment'),tag:b('देखने की कसौटी','The act of seeing'),title:b('दिखने वाला और\nदेखने वाला एक?','Can the seen and\nthe seer be one?'),lead:b('जो बदल रहा है, उसके बदलने को कौन जानता है?','What knows the change in what is changing?'),cards:[{h:b('दृश्य','What is seen'),p:b('वस्तु, शरीर, विचार, परिस्थिति।','Object, body, thought, circumstance.')},{h:b('दृष्टा','The seer'),p:b('बदलाव को जानने का प्रश्न।','The question of what knows change.')}],cue:b('पहले बोलचाल की भाषा “दिखने वाला/देखने वाला” लें। “दृष्टा/दृश्य” शब्द बाद में पहचान के रूप में दे सकते हैं।','Begin with “what is seen/what sees.” Introduce seer and seen as labels only after the distinction is grasped.')},
        {phase:b('03 · भेद','03 · Discernment'),tag:b('एक शिक्षण-मानचित्र','A teaching map'),title:b('“है” · “यह” ·\n“मैं हूँ”','“Is” · “This” ·\n“I am”'),lead:b('“हूँ” का भाव कहाँ से आया? “मैं” की मान्यता कहाँ से आई?','Where does “am” arise from—and where does the assumed “I” come from?'),map:[{from:b('है','IS'),to:b('हूँ','AM')},{from:b('यह','THIS'),to:b('मैं','I')}],mapCaption:b('एक अनुभव में ये दोनों कैसे मिले?','How did these become joined in one experience?'),cue:b('ये दो तीर दिखाएँ: “है → हूँ”, “यह → मैं”। इसे अंतिम परिभाषा न बनाएं; पूछें कि मिश्रण का अनुभव कैसे बनता है।','Use these two arrows: “IS → AM,” “THIS → I.” Treat this as an inquiry map, not a final definition.')},
        {phase:b('03 · भेद','03 · Discernment'),tag:b('एक और रास्ता','Another way in'),title:b('स्वयं और अहम्\nएक ही हैं?','Are “svayam”\nand “aham” the same?'),lead:b('दो शब्द क्यों हैं? इनके भाव में क्या अंतर समझ आता है?','Why are there two words? What difference do they suggest?'),cards:[{h:b('स्वयं','Svayam'),p:b('इस शब्द के भाव पर विचार करें।','Examine what this word suggests.')},{h:b('अहम्','Aham'),p:b('इस शब्द के भाव पर विचार करें।','Examine what this word suggests.')}],cue:b('इसे जिज्ञासा-प्रश्न की तरह रखें। संस्कृत का तैयार शब्दार्थ सुनाने से पहले श्रोताओं या शिक्षक से भेद पूछें।','Treat this as an inquiry question. Invite participants or a teacher to explore the distinction before giving a ready-made gloss.')},
        {kind:'divider',phase:b('04 · उद्देश्य','04 · Purpose'),tag:b('चौथा प्रकरण','Fourth inquiry'),title:b('अब जीवन की\nदिशा पूछिए','Now ask about\nlife’s direction'),lead:b('भेद दिखने के बाद भी जीवन किस उद्देश्य से चल रहा है?','Even after seeing the distinction, what purpose directs our life?'),stamp:b('04','04'),cue:b('यहीं से उद्देश्य परिवर्तन की बात शुरू करें। पुराने उद्देश्य को दोष न दें; उसे ईमानदारी से पहचानने का अवसर दें।','Begin the change-of-purpose inquiry here. Do not condemn the current aim; give room to recognize it honestly.')},
        {phase:b('04 · उद्देश्य','04 · Purpose'),tag:b('वर्तमान चाह','The present desire'),title:b('मैं अभी किसलिए\nकर्म करता हूँ?','Why do I act\nas I do?'),lead:b('जो नहीं मिला, मिल जाए; जो मिला, बना रहे—क्या यह परिचित लगता है?','May I gain what I lack and keep what I have—does this feel familiar?'),cards:[{h:b('प्राप्ति की चाह','To acquire'),p:b('“वह भी मिल जाए।”','“Let me obtain that too.”')},{h:b('रक्षा की चाह','To preserve'),p:b('“यह कभी न छूटे।”','“May I never lose this.”')}],cue:b('किसी को जज नहीं करें। पूछें: इनमें से कौन-सी चाह आज के किसी निर्णय के पीछे थी? उत्तर निजी रखा जा सकता है।','Do not judge. Ask which desire lay behind a decision today; participants may keep their answer private.')},
        {phase:b('04 · उद्देश्य','04 · Purpose'),tag:b('भीतर की शृंखला','The inner chain'),title:b('कमी से चाह,\nचाह से पकड़?','From lack to desire—\nfrom desire to grasping?'),lead:b('यदि कोई कमी न लगे, तो क्या “मुझे चाहिए” उठेगा?','If no lack were felt, would “I need it” arise?'),cards:[{h:b('अभाव','Felt lack'),p:b('“मैं अधूरा हूँ।”','“I am incomplete.”')},{h:b('चाह','Desire'),p:b('“कुछ मिले तो पूरा होऊँ।”','“Something must arrive to complete me.”')},{h:b('पकड़','Grasping'),p:b('“मिल गया तो छूटे नहीं।”','“Once gained, it must not leave.”')}],cue:b('चाह को महसूस किए गए अभाव की कसौटी की तरह जाँचें। यह मनोवैज्ञानिक प्रश्न की तरह रखें; हर चाह के बारे में तुरंत बड़ा निर्णय न सुनाएँ।','Examine desire as a sign of felt lack. Keep this as a question for examination, not an instant verdict on every wish.')},
        {phase:b('04 · उद्देश्य','04 · Purpose'),tag:b('दो दिशाएँ','Two directions'),title:b('भोग या योग—\nकेंद्र में कौन?','Enjoyment or yoga—\nwhat is at the centre?'),lead:b('“मेरे लिए” की तुष्टि, या सत्य की खोज?','Satisfying “for me,” or seeking truth?'),cards:[{h:b('भोग मार्ग','Path of enjoyment'),p:b('जो मिला बचा रहे; जो नहीं मिला मिल जाए।','Preserve what I have; acquire what I lack.')},{h:b('योग मार्ग','Path of yoga'),p:b('दृश्य से देखने वाले की ओर; सत्य की खोज।','Turn from the seen toward the seer; seek truth.')}],cue:b('इसे लोगों की श्रेणी न बनाएं—एक ही व्यक्ति में दोनों दिशाएँ दिख सकती हैं। उनसे आज के उद्देश्य की पहचान पूछें।','Do not label people. Both directions may appear within one person; ask them to examine today’s aim.')},
        {phase:b('04 · उद्देश्य','04 · Purpose'),tag:b('साधारण उदाहरण','An everyday example'),title:b('खाने के लिए जीना,\nया जीने के लिए खाना?','Living to eat—\nor eating to live?'),lead:b('एक ही कर्म, पर उद्देश्य बदलते ही उसका अर्थ बदलता है।','The same action changes meaning when its purpose changes.'),cards:[{h:b('भोग की दिशा','Toward enjoyment'),p:b('भोजन ही लक्ष्य बन जाए।','Food becomes the goal itself.')},{h:b('योग की दिशा','Toward yoga'),p:b('भोजन जीवन का साधन बने।','Food serves the life being lived.')}],cue:b('भोजन वाला उदाहरण लें। इसे खान-पान के नियम या शरीर के बारे में आदेश न बनाएं; केवल उद्देश्य का अंतर दिखाएँ।','Use the food analogy. Do not turn it into a dietary rule; use it only to examine the difference in purpose.')},
        {phase:b('04 · उद्देश्य','04 · Purpose'),tag:b('उपयोग बदलता है','Use changes'),title:b('जो उपलब्ध है,\nकिसके लिए उपयोग हो?','What I have—\nfor whose benefit?'),lead:b('सामग्री केवल अपनी चाह के लिए, या दूसरे के हित में भी लग सकती है?','Can what I have serve only my wish—or another’s welfare too?'),cards:[{h:b('मेरी चाह','My wish'),p:b('हर वस्तु मेरी पूर्ति का साधन।','Everything serves my own fulfilment.')},{h:b('दूसरे का हित','Another’s welfare'),p:b('जो उपलब्ध है, उसका अर्पण।','Offer what is available.')}],cue:b('व्यावहारिक उदाहरण पूछें: समय, सामर्थ्य, भोजन या कौशल। दूसरे के हित का अर्थ स्वयं को मिटा देना या विवेक छोड़ना नहीं।','Ask for a practical example—time, capacity, food, or skill. Serving another does not mean erasing oneself or abandoning discernment.')},
        {phase:b('04 · उद्देश्य','04 · Purpose'),tag:b('एक नई शुरुआत','A new beginning'),title:b('साधक का\nपहला कदम','The seeker’s\nfirst step'),lead:b('व्यक्तित्व की तुष्टि से आगे—सत्य की खोज को अपना उद्देश्य मानना।','Move beyond satisfying a role or personality; make the search for truth the aim.'),stamp:b('साधक','SEEKER'),cue:b('साधक को ऊँची उपलब्धि की उपाधि न बनाएं। यह शुरुआत है: उद्देश्य बदलने की स्वीकृति।','Do not make “seeker” a title for attainment. It is a beginning: accepting a change in purpose.')},
        {kind:'dark',phase:b('समापन','Closing'),tag:b('अगली बातचीत का आरम्भ','The next conversation begins'),title:b('कौन-सा प्रश्न\nआपके साथ रहेगा?','Which question\nwill stay with you?'),lead:b('एक उत्तर नहीं—अपने अनुभव को फिर से देखने की दिशा।','Not a final answer, but a direction for looking again.'),cards:[{h:b('मेरी शांति कहाँ बँधती है?','What holds my peace?'),p:b('पराश्रय की कसौटी।','A test of dependence.')},{h:b('मैं किसे “यह” कहता हूँ?','What do I call “this”?'),p:b('दिखने वाले और देखने वाले का भेद।','The distinction between seen and seer.')},{h:b('आज मेरा उद्देश्य क्या है?','What is my aim today?'),p:b('अगला छोटा कदम।','The next small step.')}],cue:b('अंत में एक श्रोता का अपना प्रश्न सुनें। उसी को अगली बैठक का आरम्भ बनाएं; पूरी प्रस्तुति का सार दोहराकर संवाद बंद न करें।','End by hearing one participant’s own question. Let it open the next session; do not close the dialogue with a long recap.')}
      ];

      const deck=document.getElementById('deck'),dotsWrap=document.getElementById('dots'),fill=document.getElementById('progressFill'),count=document.getElementById('slideCount');
      const langBtn=document.getElementById('langBtn'),notesBtn=document.getElementById('notesBtn'),fullBtn=document.getElementById('fullBtn'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),keys=document.getElementById('keys');
      const params=new URLSearchParams(location.search);let lang=params.get('lang')==='en'?'en':'hi';let index=Math.max(0,Math.min(slides.length-1,(parseInt(params.get('slide'),10)||1)-1));let touchX=0,touchY=0;
      const tx=value=>typeof value==='string'?value:value?.[lang]||'';
      const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const html=value=>escape(tx(value)).replace(/\n/g,'<br>');
      const pad=value=>String(value).padStart(2,'0');
      function visual(slide){
        if(slide.map)return '<div class="artifact map">'+slide.map.map(row=>'<div class="map-row"><b>'+html(row.from)+'</b><i aria-hidden="true">→</i><b>'+html(row.to)+'</b></div>').join('')+'<p class="map-caption">'+html(slide.mapCaption)+'</p></div>';
        if(slide.cards)return '<div class="artifact">'+slide.cards.map((card,i)=>'<div class="artifact-card '+(i===slide.cards.length-1?'accent':'')+'"><strong>'+html(card.h)+'</strong><p>'+html(card.p)+'</p></div>').join('')+'</div>';
        return '<div class="artifact"><div class="stamp" aria-hidden="true">'+html(slide.stamp)+'</div></div>';
      }
      function renderSlides(){
        deck.innerHTML=slides.map((slide,i)=>'<section class="slide '+(slide.kind||'')+(slide.kind==='title'||slide.kind==='divider'||slide.kind==='dark'?' dark':'')+(i===index?' active':'')+'" aria-hidden="'+(i!==index)+'" aria-labelledby="s'+(i+1)+'-title"><span class="folio">'+html(slide.phase)+' · '+pad(i+1)+'</span><div class="slide-grid"><div class="slide-copy"><div class="eyebrow">'+html(slide.tag)+'</div><h1 id="s'+(i+1)+'-title">'+html(slide.title)+'</h1><p class="lead">'+html(slide.lead)+'</p></div>'+visual(slide)+'</div><aside class="notes"><b>'+(lang==='hi'?'वक्ता संकेत':'SPEAKER CUE')+'</b>'+html(slide.cue)+'</aside></section>').join('');
        document.body.dataset.lang=lang;document.documentElement.lang=lang;
        deck.setAttribute('aria-label',lang==='hi'?'गीता का मुख्य उद्देश्य — संवाद प्रस्तुति':'The Gita’s Core Objective — conversation deck');
        langBtn.textContent=lang==='hi'?'EN':'हिं';langBtn.setAttribute('aria-label',lang==='hi'?'Switch to English':'हिन्दी में बदलें');
        notesBtn.setAttribute('aria-label',lang==='hi'?'वक्ता संकेत दिखाएँ':'Show speaker cues');notesBtn.title=lang==='hi'?'वक्ता संकेत (N)':'Speaker cues (N)';
        fullBtn.setAttribute('aria-label',lang==='hi'?'पूर्ण स्क्रीन':'Fullscreen');fullBtn.title=lang==='hi'?'पूर्ण स्क्रीन (F)':'Fullscreen (F)';
        prevBtn.setAttribute('aria-label',lang==='hi'?'पिछली स्लाइड':'Previous slide');nextBtn.setAttribute('aria-label',lang==='hi'?'अगली स्लाइड':'Next slide');
        keys.textContent=lang==='hi'?'← → चलाएँ · N संकेत · F पूर्ण स्क्रीन · L भाषा':'← → navigate · N cues · F fullscreen · L language';
        [...dotsWrap.children].forEach((dot,i)=>dot.setAttribute('aria-label',(lang==='hi'?'स्लाइड ':'Slide ')+(i+1)));
        show(index,false);
      }
      function syncURL(){const url=new URL(location.href);url.searchParams.set('slide',index+1);url.searchParams.set('lang',lang);history.replaceState({},'',url)}
      function show(next,sync=true){
        index=Math.max(0,Math.min(slides.length-1,next));document.body.dataset.theme=['title','divider','dark'].includes(slides[index].kind)?'dark':'light';document.querySelectorAll('.slide').forEach((slide,i)=>{slide.classList.toggle('active',i===index);slide.setAttribute('aria-hidden',i===index?'false':'true');if(i===index)slide.scrollTop=0});
        [...dotsWrap.children].forEach((dot,i)=>{dot.classList.toggle('active',i===index);dot.setAttribute('aria-current',i===index?'step':'false')});
        count.textContent=pad(index+1)+' / '+pad(slides.length);fill.style.width=((index+1)/slides.length*100)+'%';
        prevBtn.disabled=index===0;nextBtn.disabled=index===slides.length-1;
        document.title=(lang==='hi'?'गीता का मुख्य उद्देश्य':'The Gita’s Core Objective')+' · '+(index+1)+'/'+slides.length;
        if(getComputedStyle(dotsWrap).display!=='none')dotsWrap.children[index]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
        if(sync)syncURL();
      }
      function setLanguage(next){lang=next;renderSlides();syncURL()}
      slides.forEach((_,i)=>{const dot=document.createElement('button');dot.type='button';dot.className='dot';dot.addEventListener('click',()=>show(i));dotsWrap.appendChild(dot)});
      langBtn.addEventListener('click',()=>setLanguage(lang==='hi'?'en':'hi'));
      notesBtn.addEventListener('click',()=>document.body.classList.toggle('show-notes'));
      fullBtn.addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());
      prevBtn.addEventListener('click',()=>show(index-1));nextBtn.addEventListener('click',()=>show(index+1));
      document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey)return;const key=event.key;if(['ArrowRight','PageDown',' '].includes(key)){event.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(key)){event.preventDefault();show(index-1)}else if(key==='Home')show(0);else if(key==='End')show(slides.length-1);else if(key.toLowerCase()==='l')setLanguage(lang==='hi'?'en':'hi');else if(key.toLowerCase()==='n')document.body.classList.toggle('show-notes');else if(key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()});
      document.addEventListener('touchstart',event=>{touchX=event.changedTouches[0].clientX;touchY=event.changedTouches[0].clientY},{passive:true});
      document.addEventListener('touchend',event=>{const dx=event.changedTouches[0].clientX-touchX,dy=event.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)show(index+(dx<0?1:-1))},{passive:true});
      renderSlides();
    })();
  </script>
</body>
</html>
