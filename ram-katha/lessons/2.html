window.LESSON={number:2,title:{hi:"सती से पार्वती",en:"From Sati to Parvati"},slides:[
{type:"title",tag:{hi:"श्रीराम कथा · बालकाण्ड · पाठ 2",en:"Ram Katha · Bala Kanda · Lesson 2"},title:{hi:"सम्मान, क्रोध और नई शुरुआत",en:"Respect, anger, and a new beginning"},lead:{hi:"जब घर के बड़े एक-दूसरे का सम्मान भूल जाएँ, तो दुख कितना फैल सकता है?",en:"How far can hurt spread when adults forget to respect one another?"},cue:{hi:"कहानी गंभीर है। बच्चों को पहले बताएं कि हम सुरक्षित और प्रतीकात्मक भाषा में इसे समझेंगे।",en:"This is a serious story. Tell children it will be discussed in safe, symbolic language."}},
{tag:{hi:"दक्ष का यज्ञ",en:"Daksha’s yajna"},title:{hi:"निमंत्रण में एक खाली जगह",en:"Someone was left out"},lead:{hi:"दक्ष ने बड़े यज्ञ में सभी देवताओं को बुलाया, पर शिव और सती को जानबूझकर नहीं बुलाया। उन्हें शिव का सरल, वैरागी रूप पसंद नहीं था।",en:"Daksha invited all the gods to a grand yajna but deliberately left out Shiva and Sati. He disliked Shiva’s simple, ascetic way of life."},side:{kind:"cards",items:[{h:{hi:"अहंकार",en:"Pride"},p:{hi:"दूसरे को अपने से कम समझना।",en:"Thinking someone is beneath us."}},{h:{hi:"द्वेष",en:"Resentment"},p:{hi:"मन में बार-बार विरोध पालना।",en:"Holding on to hostility."}},{h:{hi:"सम्मान",en:"Respect"},p:{hi:"अलग होने पर भी गरिमा से व्यवहार करना।",en:"Treating others with dignity despite differences."}}]},cue:{hi:"वैराग्य को सरल जीवन और बाहरी दिखावे से मुक्त रहने के रूप में समझाएँ।",en:"Explain asceticism as simple living without concern for outward show."}},
{tag:{hi:"शिव की सलाह",en:"Shiva’s advice"},title:{hi:"जहाँ प्रेम न हो, सोचकर जाएँ",en:"Pause where love is missing"},lead:{hi:"शिव ने शांत होकर कहा—जहाँ बुलावा और अपनापन न हो, वहाँ जाना ठीक नहीं। सती फिर भी पिता के घर चली गईं।",en:"Shiva calmly advised that it was unwise to go where there was neither invitation nor affection. Sati still went to her father’s home."},side:{kind:"story",quote:{hi:"सलाह सुनना हारना नहीं है।",en:"Listening to advice is not losing."},text:{hi:"कभी-कभी भावनाएँ तेज होती हैं। तब रुककर किसी भरोसेमंद बड़े की बात सुनना हमें सुरक्षित रखता है।",en:"Strong feelings can take over. Pausing to hear a trusted adult can keep us safe."}},cue:{hi:"प्रश्न करें: सती के पास कौन-कौन से सुरक्षित विकल्प थे—न जाना, संदेश भेजना, साथ लेकर जाना?",en:"Ask what safer options Sati had: not going, sending a message, or going with support."}},
{tag:{hi:"एक दुखद मोड़",en:"A sorrowful turn"},title:{hi:"अपमान से बहुत दुख हुआ",en:"The insult caused deep hurt"},lead:{hi:"यज्ञ में शिव के लिए सम्मान का कोई स्थान नहीं था। कथा में सती ने योगाग्नि से देह त्याग दी। इससे शिव और पूरे परिवार में गहरा दुःख और क्रोध फैल गया।",en:"At the yajna there was no place of honor for Shiva. In the story, Sati gave up her body through yogic fire. Deep grief and anger spread through Shiva and the family."},safety:{hi:"ज़रूरी बात: खुद को चोट पहुँचाना कभी समाधान नहीं है। बहुत दुख या गुस्सा हो तो तुरंत माता-पिता, शिक्षक या किसी भरोसेमंद बड़े से मदद माँगें।",en:"Important: hurting yourself is never a solution. If you feel overwhelmed or angry, immediately seek help from a parent, teacher, or trusted adult."},cue:{hi:"देह-त्याग को अनुकरणीय साहस या आत्मसम्मान न कहें। सुरक्षा संदेश साफ और शांत स्वर में पढ़ें।",en:"Do not present self-harm as brave or admirable. Read the safety message clearly and calmly."}},
{tag:{hi:"क्रोध की अगली लहर",en:"The next wave of anger"},title:{hi:"एक चोट ने दूसरी चोट बनाई",en:"One hurt led to another"},lead:{hi:"शिव के क्रोध से वीरभद्र ने यज्ञ नष्ट कर दिया। फिर शिव लंबे समय तक समाधि में रहे। कथा दिखाती है—अहंकार और क्रोध मिलकर नुकसान बढ़ाते हैं।",en:"In Shiva’s anger, Veerabhadra destroyed the yajna. Shiva then remained in meditation for a long time. The story shows how pride and anger can multiply harm."},side:{kind:"cards",items:[{h:{hi:"रुकें",en:"Pause"},p:{hi:"तीन धीमी साँस लें।",en:"Take three slow breaths."}},{h:{hi:"नाम दें",en:"Name it"},p:{hi:"कहें—‘मुझे गुस्सा/दुख हो रहा है।’",en:"Say, ‘I feel angry/sad.’"}},{h:{hi:"मदद लें",en:"Get help"},p:{hi:"किसी भरोसेमंद बड़े को बताएं।",en:"Tell a trusted adult."}}]},cue:{hi:"इसे सामाजिक-भावनात्मक कौशल से जोड़ें: भावना गलत नहीं, पर प्रतिक्रिया सुरक्षित होनी चाहिए।",en:"Connect this to emotional skills: feelings are not wrong, but responses must be safe."}},
{tag:{hi:"पुनर्जन्म",en:"Rebirth"},title:{hi:"कहानी फिर आशा की ओर मुड़ी",en:"The story turned toward hope"},lead:{hi:"सती ने हिमालय और मैना के घर पार्वती के रूप में नया जन्म लिया। नई शुरुआत ने फिर साधना, धैर्य और मिलन का रास्ता खोला।",en:"Sati was reborn as Parvati, daughter of Himavan and Maina. This new beginning opened a path of patience, devotion, and reunion."},side:{kind:"story",quote:{hi:"हर कठिन अध्याय के बाद नया पन्ना खुल सकता है।",en:"A new page can open after a hard chapter."},text:{hi:"कथा का आशावान संदेश है—हम सीख सकते हैं, मदद ले सकते हैं और बेहतर शुरुआत कर सकते हैं।",en:"The hopeful message is that we can learn, seek help, and begin again."}},cue:{hi:"पुनर्जन्म को कथा की धार्मिक मान्यता के रूप में रखें; मुख्य बाल-संदेश आशा और सुधार है।",en:"Present rebirth as part of the sacred story; the child-facing theme is hope and growth."}},
{type:"reflect",tag:{hi:"सोचो · बोलो · अभिनय करो",en:"Think · Share · Role-play"},title:{hi:"सम्मान वाला रास्ता चुनें",en:"Choose the respectful path"},prompts:[{hi:"दक्ष की कौन-सी भावना ने समस्या बढ़ाई?",en:"Which feeling in Daksha made the problem worse?"},{hi:"सती क्या सुरक्षित विकल्प चुन सकती थीं?",en:"What safer choice could Sati have made?"},{hi:"जोड़ी में अभिनय करो: एक बच्चा दुख बताए, दूसरा भरोसेमंद मित्र बनकर सहायता दिलाए।",en:"In pairs, role-play: one child shares hurt; the other helps them reach a trusted adult."}],safety:{hi:"किसी भी गहरे दुख को अकेले मत सहो—बड़े से कहना बहादुरी है।",en:"Never carry deep hurt alone—telling an adult is brave."},cue:{hi:"भूमिका-अभिनय को हल्का रखें और व्यक्तिगत अनुभव बताने के लिए किसी पर दबाव न डालें।",en:"Keep role-play gentle and never pressure children to disclose personal experiences."}}
]};</script><script src="../presentation.js"></script></body></html>
