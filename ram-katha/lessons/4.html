{tag:{hi:"कैकय देश का राजा",en:"King of Kaikaya"},title:{hi:"प्रतापभानु प्रजा का ध्यान रखते थे",en:"Pratapbhanu cared for his people"},lead:{hi:"उनका राज्य सुखी और समृद्ध था। पर पड़ोसी शत्रु उनसे ईर्ष्या करते थे। एक पराजित शत्रु कपटी मुनि का वेश बनाकर जंगल में रहने लगा।",en:"His kingdom was happy and prosperous, but neighboring enemies envied him. A defeated enemy disguised himself as a sage and lived in the forest."},side:{kind:"cards",items:[{h:{hi:"अच्छा आरंभ",en:"A good beginning"},p:{hi:"राजा प्रजापालक थे।",en:"The king cared for his subjects."}},{h:{hi:"छिपा खतरा",en:"A hidden danger"},p:{hi:"शत्रु ने साधु का वेश बनाया।",en:"An enemy wore a sage’s disguise."}},{h:{hi:"सीख",en:"Lesson"},p:{hi:"वेश देखकर ही विश्वास न करें।",en:"Do not trust only by appearance."}}]},cue:{hi:"कथा यह नहीं कहती कि सभी अजनबी बुरे हैं; संदेश है कि बड़े दावे सत्यापित करें।",en:"The story does not say every stranger is bad; it says important claims must be checked."}},
{tag:{hi:"जंगल में भटकाव",en:"Lost in the forest"},title:{hi:"कपटी मुनि ने बड़ा वादा किया",en:"The false sage made a huge promise"},lead:{hi:"शिकार करते हुए राजा रास्ता भूल गए। कपटी मुनि ने कहा—मैं ऐसा यज्ञ करूँगा जिससे आपकी हर इच्छा पूरी होगी।",en:"While hunting, the king lost his way. The false sage promised a yajna that would grant every wish."},side:{kind:"story",quote:{hi:"बहुत अच्छा सुनाई दे—तो दो बार जाँचो।",en:"If it sounds too good, check twice."},text:{hi:"अकेले, थके या डरे होने पर निर्णय कठिन होता है। ऐसे समय भरोसेमंद सलाह जरूरी है।",en:"Decisions are harder when we are alone, tired, or afraid. Trusted advice matters most then."}},cue:{hi:"इसे बच्चों की ऑनलाइन सुरक्षा से भी हल्के रूप में जोड़ सकते हैं: बड़े वादे या निजी जानकारी पर बड़े से पूछें।",en:"You may gently connect this to online safety: ask an adult about big promises or requests for private information."}},
{tag:{hi:"राजा की इच्छा",en:"The king’s wish"},title:{hi:"‘मुझे कोई हरा न सके’",en:"‘Let no one defeat me’"},lead:{hi:"राजा ने चाहा—बुढ़ापा, मृत्यु और दुःख न हों; युद्ध में कोई न जीते; सौ कल्प तक अकेला राज्य करूँ। यही असीम चाह जाल बन गई।",en:"The king wished for no old age, death, or sorrow; no defeat in war; and sole rule for a hundred kalpas. This limitless desire became a trap."},side:{kind:"cards",items:[{h:{hi:"इच्छा",en:"A wish"},p:{hi:"कुछ अच्छा पाने की चाह।",en:"Wanting something good."}},{h:{hi:"लालच",en:"Greed"},p:{hi:"सब कुछ और हमेशा मेरे लिए।",en:"Wanting everything, forever, for oneself."}},{h:{hi:"संतोष",en:"Contentment"},p:{hi:"परिश्रम करें, पर सीमा और न्याय न भूलें।",en:"Work hard without forgetting limits and fairness."}}]},cue:{hi:"‘इच्छा गलत है’ न कहें। असीम, स्वार्थी और अन्यायपूर्ण चाह को समस्या बताएं।",en:"Do not say all desire is wrong. The problem is desire that becomes limitless, selfish, and unjust."}},
{tag:{hi:"रामचरितमानस की चौपाई",en:"A Ramcharitmanas chaupai"},title:{hi:"चुनाव भी भाग्य की दिशा बनाते हैं",en:"Choices also shape direction"},verse:["तुलसी जसि भवतब्यता तैसी मिलइ सहाइ ।","आपुनु आवइ ताहि पहिं ताहि तहाँ लै जाइ ॥"],meaning:{hi:"जैसी होनी होती है, वैसी सहायता मिल जाती है—वह स्वयं आती है या मनुष्य को वहाँ ले जाती है।",en:"As destiny unfolds, matching help appears—either it comes to a person or leads that person toward it."},cue:{hi:"PDF ‘होनी’ पर बल देता है; साथ में बच्चों को बताएं कि विवेकपूर्ण चुनाव और सहायता माँगना हमारी जिम्मेदारी है।",en:"The PDF stresses destiny; also affirm that checking choices and asking for help remain our responsibility."}},
{tag:{hi:"श्राप और आगे की कथा",en:"The curse and what followed"},title:{hi:"प्रतापभानु से रावण तक",en:"From Pratapbhanu to Ravana"},lead:{hi:"कपट से ब्राह्मणों का श्राप मिला। आगे राजा ने रावण, भाई अरिमर्दन ने कुंभकर्ण और मंत्री धर्मवीर ने विभीषण के रूप में जन्म लिया। उनके अलग-अलग वरदानों ने रामकथा की दिशा बनाई।",en:"Through deception, a curse followed. The king was later born as Ravana, his brother Arimardana as Kumbhakarna, and minister Dharmaveer as Vibhishana. Their different boons shaped the Ram Katha."},side:{kind:"cards",items:[{h:{hi:"रावण",en:"Ravana"},p:{hi:"बल मिला; अहंकार बढ़ा।",en:"Power grew; so did pride."}},{h:{hi:"कुंभकर्ण",en:"Kumbhakarna"},p:{hi:"छह महीने की नींद मिली।",en:"He received six-month sleep."}},{h:{hi:"विभीषण",en:"Vibhishana"},p:{hi:"भक्ति का वर माँगा।",en:"He asked for devotion."}}]},cue:{hi:"नाम और जन्म-क्रम PDF के अनुसार रखें।",en:"Keep the names and birth sequence as given in the PDF."}},
