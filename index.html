  <style>

    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--ink);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
    .deck{position:relative;width:100%;height:100dvh;isolation:isolate}.deck:before{content:"";position:fixed;inset:0;z-index:20;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");mix-blend-mode:multiply}
    .slide{--art-pos:76% center;position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:5.8rem 1.35rem 7.4rem;background-image:linear-gradient(100deg,rgba(245,239,223,.98),rgba(249,244,232,.94) 58%,rgba(238,224,197,.83)),var(--art);background-size:cover,cover;background-position:center,var(--art-pos);background-repeat:no-repeat}.slide.active{display:grid;animation:page-in .55s cubic-bezier(.2,.8,.25,1) both}.slide.dark{color:var(--paper);background-image:linear-gradient(100deg,rgba(27,41,36,.99),rgba(27,41,36,.94) 58%,rgba(20,39,34,.84)),var(--art)}.slide:nth-child(3n+2){--art-pos:65% center}.slide:nth-child(4n){--art-pos:42% center}.slide:after{content:"";position:fixed;inset:.65rem;pointer-events:none;border:1px solid rgba(101,80,47,.18)}.slide.dark:after{border-color:rgba(225,201,158,.16)}
    .slide-grid{position:relative;z-index:2;align-self:center;width:100%;max-width:82rem;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;align-items:center}.slide-grid>*{min-width:0}.slide-copy{max-width:62rem}.folio{position:absolute;z-index:3;top:1.35rem;left:1.35rem;display:flex;align-items:center;gap:.7rem;font-size:.88rem;letter-spacing:.08em;color:rgba(27,41,36,.58)}.folio:before{content:"॥";font-family:var(--display);font-size:1.1rem;color:var(--verm)}.dark .folio{color:rgba(245,239,223,.64)}.dark .folio:before{color:var(--saffron)}

    .artifact{width:100%;display:grid;align-content:center;gap:.75rem}.stamp{display:grid;place-items:center;min-height:11rem;padding:1.5rem;border:1px solid rgba(185,79,44,.3);background:rgba(255,250,238,.36);color:var(--verm);font-family:var(--display);font-size:clamp(2.8rem,12vw,7rem);font-weight:400;text-align:center;line-height:1.1;overflow-wrap:anywhere}.dark .stamp{border-color:rgba(235,191,127,.35);background:rgba(255,248,225,.035);color:#eaa85f}.title .stamp,.divider .stamp{min-height:15rem;border-radius:50%;aspect-ratio:1;width:min(65vw,22rem);justify-self:center;background:rgba(255,248,225,.025);box-shadow:inset 0 0 0 .8rem rgba(201,155,81,.07)}.artifact-card{padding:1.15rem 1.25rem;border:1px solid var(--line);border-left:3px solid var(--gold);background:rgba(255,251,243,.68);box-shadow:0 .7rem 1.8rem rgba(73,47,22,.07);backdrop-filter:blur(2px)}.artifact-card strong{display:block;margin-bottom:.25rem;font-family:var(--display);font-size:clamp(1.2rem,2.5vw,1.75rem);font-weight:400;line-height:1.2;overflow-wrap:anywhere}.artifact-card p{margin:0;color:var(--ink-soft);font-size:clamp(.95rem,1.6vw,1.12rem);line-height:1.45}.dark .artifact-card{border-color:rgba(245,239,223,.2);border-left-color:var(--gold);background:rgba(255,248,225,.07)}.dark .artifact-card p{color:rgba(245,239,223,.75)}.artifact-card.accent{border-left-color:var(--verm)}.dark .artifact-card.accent{border-left-color:var(--saffron)}

    .chrome{position:fixed;inset:0;z-index:30;pointer-events:none}.progress-line{position:absolute;inset:0 0 auto;height:4px;background:rgba(27,41,36,.17)}.progress-fill{height:100%;width:4%;background:var(--saffron);transition:width .3s ease}.top-tools{position:absolute;top:max(.9rem,env(safe-area-inset-top));right:max(1rem,env(safe-area-inset-right));display:flex;gap:.5rem;pointer-events:auto}.chrome button{min-width:44px;min-height:44px;padding:.55rem .8rem;border:1px solid rgba(245,239,223,.25);border-radius:999px;background:rgba(27,41,36,.9);color:var(--paper);cursor:pointer;transition:background .2s,transform .2s}.chrome button:hover{background:#9e4427;transform:translateY(-2px)}.chrome button[disabled]{opacity:.45;cursor:not-allowed}.chrome button[disabled]:hover{background:rgba(27,41,36,.9);transform:none}.top-tools button{font-size:.92rem;font-weight:700}.bottom-tools{position:absolute;bottom:max(.9rem,env(safe-area-inset-bottom));left:1rem;right:1rem;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;pointer-events:auto}.slide-count{min-width:4.4rem;color:var(--paper);font-size:.92rem;font-variant-numeric:tabular-nums}.nav-buttons{display:flex;gap:.5rem}.nav-buttons button{width:46px;height:46px;padding:0;font-size:1.25rem}.dots{display:none;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;white-space:nowrap;justify-content:center}.dots::-webkit-scrollbar{display:none}.dot{flex:0 0 44px;width:44px;height:44px;padding:0!important;border:0!important;background:transparent!important;box-shadow:none}.dot:after{content:"";display:block;width:.36rem;height:.36rem;margin:auto;border-radius:50%;background:rgba(245,239,223,.44);transition:width .2s,background .2s}.dot.active:after{width:1.18rem;border-radius:1rem;background:var(--saffron)}.keys{display:none;color:rgba(245,239,223,.57);font-size:.78rem}

    @keyframes page-in{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(min-width:768px){.slide{--art-pos:center;padding:6.5rem clamp(2.5rem,6vw,6.5rem) 7rem;background-image:linear-gradient(100deg,rgba(245,239,223,.97),rgba(249,244,232,.9) 58%,rgba(238,224,197,.71)),var(--art)}.slide.dark{background-image:linear-gradient(100deg,rgba(27,41,36,.98),rgba(27,41,36,.91) 58%,rgba(20,39,34,.72)),var(--art)}.slide-grid{grid-template-columns:minmax(0,1.35fr) minmax(15rem,.65fr);gap:clamp(2rem,5vw,5rem)}.folio{top:2rem;left:clamp(2.5rem,5vw,5rem)}.artifact{max-width:31rem;justify-self:end}.bottom-tools{left:clamp(2rem,4vw,4rem);right:clamp(2rem,4vw,4rem)}.dots{display:flex;justify-content:flex-start;max-width:min(46vw,42rem)}.notes{left:50%;right:auto;width:min(48rem,80vw);transform:translateX(-50%)}}
    @media(min-width:1024px){.slide-grid{grid-template-columns:minmax(0,1.25fr) minmax(18rem,.75fr)}.keys{display:block;position:absolute;right:1.5rem;top:4.7rem}.lead{font-size:clamp(1.2rem,1.8vw,1.55rem)}}
    @media(max-height:700px){.slide{padding-top:4.4rem;padding-bottom:5.7rem}.slide h1{font-size:clamp(2rem,6vw,4.5rem)}.slide.title h1{font-size:clamp(2.8rem,8vw,6rem)}.artifact-card{padding:.8rem 1rem}.stamp{min-height:8rem}}
    .edition-picker{position:relative;pointer-events:auto}.edition-picker summary{display:grid;place-items:center;min-width:44px;min-height:44px;padding:.55rem;border:1px solid rgba(245,239,223,.25);border-radius:999px;background:rgba(27,41,36,.9);color:var(--paper);font-size:.88rem;font-weight:700;cursor:pointer;list-style:none}.edition-picker summary::-webkit-details-marker{display:none}.edition-picker summary:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}.edition-picker[open] summary{background:#9e4427}.edition-menu{position:absolute;top:calc(100% + .6rem);right:0;width:min(17rem,78vw);padding:.45rem;border:1px solid rgba(245,239,223,.2);border-radius:.8rem;background:rgba(27,41,36,.98);box-shadow:0 1rem 2.5rem rgba(0,0,0,.28)}.edition-menu a{display:flex;align-items:center;min-height:44px;padding:.55rem .8rem;border-radius:.45rem;color:var(--paper);text-decoration:none;font-size:.9rem}.edition-menu a:hover,.edition-menu a:focus-visible{background:#9e4427;outline:none}.edition-menu a[aria-current="page"]{color:#f3b77f}

  <script>
    (() => {
      const b = (hi,en) => ({hi,en});
      const slides = [
        {kind:'title',phase:b('आरम्भ','Opening'),tag:b('एक आध्यात्मिक यात्रा','A spiritual journey'),title:b('गीता का\nमुख्य उद्देश्य','The Gita’s\nCore Objective'),lead:b('पराश्रय से मुक्त होकर स्वाश्रय की ओर—सुख का आधार बाहर से स्वयं की ओर लौटे।','From dependence to swashraya: examine where we place the ground of our peace.'),stamp:b('स्व','SELF'),cue:b('पहले एक जीवनानुभव पूछें: किसी व्यक्ति, परिस्थिति या उपलब्धि के बदलने से आपकी शांति कब बदली? यहीं से मुख्य सूत्र खोलें।','Begin with an experience: when has a person, circumstance, or achievement changed your peace? Use it to open the central thread.')},
        {phase:b('मार्ग-सूत्र','The thread'),tag:b('पूरी यात्रा एक क्रम में','One connected inquiry'),title:b('आश्रय से पहचान;\nपहचान से उद्देश्य','From reliance to identity;\nfrom identity to purpose'),lead:b('जिसे हम अपना आधार मानते हैं, उसी से “मैं” की मान्यता, चाह और कर्म की दिशा बनती है।','What we rely on shapes our idea of “I,” our wanting, and the purpose of our action.'),cards:[{h:b('पराश्रय','Dependence'),p:b('सुख-दुःख किसी “पर” से बँधता है।','Peace becomes tied to “the other.”')},{h:b('विवेक','Discernment'),p:b('“यह” और जानने वाले का भेद खुलता है।','The seen is distinguished from the knower.')},{h:b('उद्देश्य परिवर्तन','Change of purpose'),p:b('भोग से सत्य की खोज की ओर।','From enjoyment toward inquiry into truth.')},{h:b('कर्म और समता','Action and steadiness'),p:b('कार्य जारी रहता है; निजी आग्रह ढीला पड़ता है।','Action continues; private insistence loosens.')}],cue:b('इस मार्ग-सूत्र को उत्तरों की सूची की तरह न पढ़ें। यह बताता है कि हर अगला प्रश्न पिछले प्रश्न से क्यों निकलता है।','Use this as a map, not a list of conclusions. Show why each inquiry gives rise to the next.')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('मुख्य कसौटी','The central test'),title:b('पराश्रय\nकब होता है?','When does\nreliance become dependence?'),lead:b('किसी वस्तु, व्यक्ति, परिस्थिति या उपलब्धि के होने-न-होने से भीतर सुख या दुःख उठे—यही जाँच की शुरुआत है।','If the presence or absence of something governs inner joy or sorrow, dependence is worth examining.'),stamp:b('पर','OTHER'),cue:b('पहले किसी साधारण उदाहरण पर रुकें। पूछें: चीज़ बदली, या भीतर उसके प्रति आश्रय का भाव सक्रिय हुआ?','Pause over an ordinary example. Ask whether the thing changed, or whether the reliance placed on it became visible.')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('“पर” की पहचान','Identifying “the other”'),title:b('जो दिखता है,\nवह “पर” कैसे है?','What makes the seen\n“other” to me?'),lead:b('जो इन्द्रियों या मन के सामने आता है, वह जाना जा सकता है; उसकी उपस्थिति और दिशा हमेशा मेरे नियंत्रण में नहीं।','What appears to the senses or mind can be known, but its presence and course are not wholly mine to control.'),cards:[{h:b('वस्तु / व्यक्ति','Object / person'),p:b('आ सकते हैं; जा सकते हैं।','They may arrive or depart.')},{h:b('स्थिति / उपलब्धि','Condition / achievement'),p:b('बदल सकती है; छूट सकती है।','They may change or be lost.')}],cue:b('“पर” को शत्रु न बनाएं। प्रश्न वस्तु का उपयोग नहीं, सुख के लिए उस पर निर्भरता है।','Do not make “the other” an enemy. The question is not using things, but leaning on them for peace.')},
        {phase:b('01 · पराश्रय','01 · Dependence'),tag:b('आश्रय का परिणाम','What reliance breeds'),title:b('चाह से चिंता;\nचिंता से भय','Wanting, then anxiety;\nanxiety, then fear'),lead:b('जो मिला है उसके छूटने का डर, और जो नहीं मिला उसके न मिलने की आशंका—पराश्रय मन को दोनों दिशाओं में खींचता है।','Fear of losing what is held and fear of missing what is sought pull the mind away from the present.'),cards:[{h:b('जो मिला, बना रहे','Keep what was gained'),p:b('संग्रह के साथ खोने की चिंता।','Possession brings fear of loss.')},{h:b('जो नहीं मिला, मिल जाए','Gain what is absent'),p:b('आशा के साथ असफलता की आशंका।','Hope carries fear of disappointment.')}],cue:b('यहीं मोह को केवल भावना नहीं, दृष्टि की भूल के रूप में रखें: बदलने वाले को स्थायी सुख का आधार मान लिया गया।','Frame moha as more than emotion: the changing has been mistaken for a stable ground of happiness.')},
        {kind:'dark',phase:b('02 · अपने होने की जाँच','02 · Inquiry into being'),tag:b('बाहरी सहारे से एक कदम भीतर','One step inward'),title:b('क्या आप हैं?','Do you exist?'),lead:b('इस उत्तर के लिए किसी वस्तु, भूमिका, उपलब्धि या विशेष साधन की प्रतीक्षा करनी पड़ती है?','Does the answer require an object, a role, an achievement, or a special instrument?'),stamp:b('हूँ','AM'),cue:b('उत्तर श्रोताओं से आने दें। यहाँ ध्यान, समाधि या किसी सिद्धि को शर्त न बनाएं; अपने होने का सीधा बोध देखें।','Let participants answer. Do not make meditation or an attainment a prerequisite; examine the direct awareness of being.')},
        {phase:b('02 · अपने होने की जाँच','02 · Inquiry into being'),tag:b('एक जरूरी भेद','A necessary distinction'),title:b('“मैं हूँ”\nकिस अर्थ में?','What do we mean\nby “I am”?'),lead:b('अपने होने का सीधा बोध और “मैं यह शरीर/भूमिका हूँ” की सीमित मान्यता एक बात नहीं।','Direct awareness of being is not the same as the limited belief “I am this body or role.”'),cards:[{h:b('होने का बोध','Awareness of being'),p:b('बिना बाहरी प्रमाण के सीधे ज्ञात।','Known directly, without outer proof.')},{h:b('सीमित पहचान','Limited identity'),p:b('किसी बदलती हुई “यह” से जुड़ी।','Attached to a changing “this.”')}],cue:b('“मैं हूँ” को अंतिम उत्तर न बनाएं। पूछें: “मैं” किस पर टिक रहा है और “हूँ” का बोध किस पर?','Do not present “I am” as a final slogan. Ask what the “I” leans on, and whether being itself leans on it.')},
        {phase:b('02 · अपने होने की जाँच','02 · Inquiry into being'),tag:b('दैनिक भाषा से विवेक','Discernment in ordinary speech'),title:b('“यह मेरा हाथ है”—\nतो “मैं” कहाँ?','“This is my hand”—\nwhere is the “I”?'),lead:b('हम “यह शरीर”, “यह मन”, “यह विचार” कहते हैं। जो जाना जा रहा है, क्या वही जानने वाला है?','We say “this body,” “this mind,” “this thought.” Is what is known identical with the knower?'),cards:[{h:b('यह','This'),p:b('शरीर, मन, विचार, भूमिका—अनुभव में आते हैं।','Body, mind, thought, and role appear in experience.')},{h:b('मैं?','I?'),p:b('जो इन्हें जानता है, उसकी जाँच बाकी है।','The knower of them still calls for inquiry.')}],cue:b('शरीर या मन को नकारने का आदेश न दें। केवल “यह” और “मैं” के उपयोग से भेद की जाँच करवाएँ।','Do not command rejection of body or mind. Use the ordinary words “this” and “I” to examine the distinction.')},
        {phase:b('02 · अपने होने की जाँच','02 · Inquiry into being'),tag:b('मिश्रण की जाँच','Examine the mixing'),title:b('“है” और “यह”\nकहाँ जुड़ते हैं?','Where do “Is”\nand “This” meet?'),lead:b('बदलने वाली “यह” को अपने होने से जोड़ते ही “मैं यह हूँ” की मान्यता उठती है। यह संबंध जाँच का विषय है।','When changing “this” is joined to being, “I am this” appears as a belief. Examine that joining.'),map:[{from:b('है','IS'),to:b('हूँ','AM')},{from:b('यह','THIS'),to:b('मैं','I')}],mapCaption:b('इन दो तीरों को मिलाने से पहले प्रत्येक को अलग देखें।','Examine each arrow separately before joining them.'),cue:b('इस मानचित्र को सिद्ध निष्कर्ष की तरह न सुनाएँ। पूछें कि बदलती पहचान को अपने होने के साथ मिलाने पर क्या होता है।','Do not announce this map as a settled conclusion. Ask what happens when a changing identity is joined to being.')},
        {phase:b('02 · अपने होने की जाँच','02 · Inquiry into being'),tag:b('सत्–असत् का विवेक','Discernment of the real'),title:b('बदलने वाला;\nबदलने को जानने वाला','What changes;\nwhat knows change'),lead:b('शरीर, मन, संबंध और परिस्थिति बदलते हैं। परिवर्तन की जानकारी के बिना “बदल गया” कहना भी संभव नहीं।','Body, mind, relationships, and circumstances change. Even to say “it changed,” change must be known.'),cards:[{h:b('दृश्य','The seen'),p:b('आता-जाता, बदलता हुआ।','Appearing, passing, changing.')},{h:b('द्रष्टा की जाँच','Inquiry into the seer'),p:b('परिवर्तन को जानने वाला कौन?','Who knows the changing?')}],cue:b('सत्–असत् का विवेक निष्क्रिय विचार नहीं। पूछें: किसी हाल की बदलती स्थिति को किसने जाना? यहीं से आकर्षण का आधार जाँचा जा सकता है।','Keep discernment experiential. Ask who knew a recent change; from there examine the basis of attraction.')},
        {kind:'dark',phase:b('03 · उद्देश्य परिवर्तन','03 · Change of purpose'),tag:b('विवेक के बाद अगला प्रश्न','The next question after discernment'),title:b('अब मैं किसलिए\nजी रहा हूँ?','What purpose now\ndirects my life?'),lead:b('यदि बदलने वाला मेरा स्थायी आधार नहीं, तो उसे पाना और बचाए रखना ही जीवन का लक्ष्य क्यों बने?','If the changing cannot be a lasting ground, why make gaining and guarding it the aim of life?'),stamp:b('दिशा','DIRECTION'),cue:b('पिछले भेद से यह प्रश्न स्वाभाविक रूप से निकालें। पुराने उद्देश्य को दोष देने के बजाय उसे स्पष्ट पहचानने दें।','Let this question follow naturally from the distinction. First recognize the current aim clearly, without condemning it.')},
        {phase:b('03 · उद्देश्य परिवर्तन','03 · Change of purpose'),tag:b('वर्तमान उद्देश्य','The familiar aim'),title:b('जो मिला, रहे;\nजो नहीं मिला, मिले','Keep what I have;\ngain what I lack'),lead:b('इन दो चाहों के इर्द-गिर्द योजनाएँ, संघर्ष और कर्म घूमते हैं। यही भोग की दिशा में “मैं” को केंद्र बनाए रखता है।','Plans and actions orbit these two wants. Bhoga keeps the limited “I” at the centre.'),cards:[{h:b('संग्रह','Holding'),p:b('प्राप्त वस्तु को अपना आधार बनाना।','Making what is gained my support.')},{h:b('प्राप्ति','Acquiring'),p:b('अप्राप्त वस्तु से पूर्णता माँगना।','Seeking completion in what is absent.')}],cue:b('भोग को केवल इन्द्रिय-सुख तक सीमित न करें। प्रतिष्ठा, सुरक्षा और आध्यात्मिक उपलब्धि की चाह भी “मेरे लिए” हो सकती है।','Do not reduce bhoga to sensory pleasure. Status, safety, or even spiritual attainment may still be pursued for “me.”')},
        {phase:b('03 · उद्देश्य परिवर्तन','03 · Change of purpose'),tag:b('एक नई दिशा','A different direction'),title:b('इच्छाएँ अनेक;\nउद्देश्य एक','Many desires;\none governing aim'),lead:b('जब लक्ष्य भोग से सत्य की खोज की ओर मुड़ता है, वही कर्म और साधना नए अर्थ लेने लगते हैं।','When the aim turns from enjoyment toward truth, action and practice begin to take a different meaning.'),cards:[{h:b('भोग की दिशा','The direction of bhoga'),p:b('व्यक्तित्व की रक्षा और तुष्टि।','Protecting and gratifying a personality.')},{h:b('योग की दिशा','The direction of yoga'),p:b('बदलने वाले और न बदलने वाले का विवेक।','Discernment of the changing and the changeless.')}],cue:b('“खाने के लिए जीना या जीने के लिए खाना?” से दिखाएँ: कर्म वही हो सकता है, पर उद्देश्य बदलते ही उसका अर्थ बदलता है।','Use “living to eat, or eating to live?” to show that the same act changes meaning with its purpose.')},
        {phase:b('03 · उद्देश्य परिवर्तन','03 · Change of purpose'),tag:b('चाह और प्रयत्न का अर्थ','What wanting and effort mean'),title:b('अचाह;\nअप्रयत्न','Achah;\nAprayatna'),lead:b('अचाह वस्तु को फेंकना नहीं, उसके बिना अधूरा होने की मान्यता ढीली करना है। अप्रयत्न निष्क्रियता नहीं, निजी आग्रह का क्षय है।','Achah does not require discarding an object; Aprayatna does not mean inactivity. Both loosen psychological need and ego-driven insistence.'),cards:[{h:b('अचाह','Achah · wantlessness'),p:b('मिले या छूटे—भीतर अनिवार्य आवश्यकता न बने।','Arrival or loss need not define inner completeness.')},{h:b('अप्रयत्न','Aprayatna · non-insistence'),p:b('कार्य हो; “मेरे अनुसार ही” का आग्रह न हो।','Act, without insisting that it must go my way.')}],cue:b('दोनों शब्दों को आलस्य या दमन का नाम न दें। किसी छोटे उदाहरण में जाँचें: काम जारी है, पर भीतर पकड़ कहाँ है?','Do not make either term laziness or suppression. Use a small example: action continues, but where is the inner grip?')},
        {phase:b('03 · उद्देश्य परिवर्तन','03 · Change of purpose'),tag:b('उपराम होने की दिशा','The movement of uparati'),title:b('जो बदल रहा है,\nउसे बदलने दें','Let what changes\nbe allowed to change'),lead:b('मन को बल से रोकना या इच्छा से लड़ना उद्देश्य नहीं। धीरे-धीरे समर्थन और विरोध की निजी पकड़ पहचानना है।','The aim is not to force the mind still or fight desire, but to notice the private grip of endorsement and resistance.'),cards:[{h:b('दमन नहीं','Not suppression'),p:b('विचार और भाव उठ सकते हैं।','Thoughts and feelings may arise.')},{h:b('अवलोकन','Observation'),p:b('उन पर “मेरा” आग्रह कैसे बनता है?','How does “my” insistence form around them?')}],cue:b('एक क्षण का विराम दें। जो विचार अभी उपस्थित है, उसे हटाए बिना देखने को कहें। इसे किसी ध्यान-पद्धति की अनिवार्य शर्त न बनाएं।','Offer a brief pause. Invite observation of the thought already present without removing it; do not make a technique compulsory.')},
        {kind:'dark',phase:b('04 · कर्मयोग','04 · Karma Yoga'),tag:b('विवेक जीवन में उतरता है','Discernment enters action'),title:b('तब कर्म का\nक्या अर्थ है?','What happens\nto action?'),lead:b('दृश्य बदलता है और क्रिया चलती रहती है। प्रश्न क्रिया छोड़ने का नहीं, उसके साथ जुड़े कर्तापन और अपेक्षा का है।','The world changes and action continues. The question is not abandoning action, but examining doership and expectation.'),stamp:b('कर्म','ACTION'),cue:b('स्पष्ट रखें: इस मार्ग में काम से भागना नहीं। पूछें: एक ही कार्य निजी लाभ और दूसरे के हित के लिए करने में भीतर क्या बदलता है?','Make clear this is not withdrawal from work. Ask what changes inwardly when the same task serves private gain or another’s welfare.')},
        {phase:b('04 · कर्मयोग','04 · Karma Yoga'),tag:b('कर्म की दिशा बदलती है','A changed direction of action'),title:b('अपने संकल्प से\nदूसरे के हित तक','From private resolve\nto another’s welfare'),lead:b('समय, कौशल, साधन और उपलब्ध वस्तु काम में लगें; उन्हें केवल “मेरी तुष्टि” का साधन न मानें।','Time, skill, and available resources can be used without making personal gratification their only purpose.'),cards:[{h:b('निजी आग्रह','Private insistence'),p:b('“मुझे ऐसा ही परिणाम चाहिए।”','“I must get this particular result.”')},{h:b('हित और कर्तव्य','Welfare and duty'),p:b('कार्य करें, पर अहं को केंद्र न बनाएं।','Act, without placing ego at the centre.')}],cue:b('दूसरे का हित आत्म-निरस्तीकरण नहीं है। विवेक से काम करें और व्यावहारिक उदाहरण श्रोताओं से माँगें।','Serving others is not self-erasure. Act with discernment and invite practical examples from participants.')},
        {phase:b('04 · कर्मयोग','04 · Karma Yoga'),tag:b('बंधन क्रिया में नहीं','The act itself is not the bond'),title:b('फल कितनों से बनता है?','How many causes\nshape a result?'),lead:b('कर्म वर्तमान में होता है; उसका फल अनेक कारणों से। फल को पूर्णतः “मेरा” मानते ही सफलता और असफलता दोनों बाँध सकती हैं।','An action is present; its result depends on many causes. Claiming it wholly as “mine” can bind through success or failure alike.'),cards:[{h:b('कर्म','Action'),p:b('जो अभी जिम्मेदारी से किया जा सकता है।','What can be done responsibly now.')},{h:b('अपेक्षा','Expectation'),p:b('“फल मेरी इच्छा से ही बने।”','“The result must match my wish.”')}],cue:b('किसी सामूहिक कार्य का उदाहरण लें। अनेक कारण दिखने दें; फिर पूछें कि व्यक्तिगत दावा और भय कब उठे।','Use a shared task as an example. Let participants identify its many causes, then ask when personal claim and fear arose.')},
        {phase:b('04 · कर्मयोग','04 · Karma Yoga'),tag:b('कर्मयोग की परिपक्वता','The maturity of action'),title:b('समता उदासीनता नहीं','Equanimity is\nnot indifference'),lead:b('प्रिय मिले या अप्रिय आए, कर्म जीवंत रह सकता है—भीतर की शांति परिस्थिति की अनुमति पर न टिकी हो।','The pleasant or unpleasant may arrive and action can remain alive, while inner peace is less governed by circumstance.'),cards:[{h:b('लाभ / हानि','Gain / loss'),p:b('परिणाम अलग; जागरूकता बनी रहे।','Outcomes differ; awareness continues.')},{h:b('सिद्धि / असिद्धि','Success / failure'),p:b('कर्तव्य रहे; अहं का दावा ढीला हो।','Duty remains; ego’s claim loosens.')}],cue:b('समता को भावशून्यता न कहें। भावना को पहचानते हुए भी उस पर जीवन का आधार न टिकाने का अर्थ पूछें।','Do not call equanimity emotionlessness. Ask what it means to notice emotion without making it the ground of life.')},
        {phase:b('05 · स्वाश्रय','05 · Swashraya'),tag:b('गीता की कथा में वही दिशा','The same movement in the Gita’s story'),title:b('अर्जुन का संशय\nकैसे बदलता है?','How does Arjuna’s\ndoubt change?'),lead:b('मोह घटने पर कर्म समाप्त नहीं होता। निजी संकल्प की जगह सत्य के अनुरूप चलने की स्पष्टता आती है।','When delusion loosens, action does not stop. Clarity replaces the grip of private resolve.'),cards:[{h:b('पहले','Before'),p:b('“मैं क्या करूँ?”—भूमिका और परिणाम का संशय।','“What should I do?”—doubt around role and outcome.')},{h:b('बाद में','After'),p:b('स्मृति और स्पष्टता के साथ कर्म।','Action with remembrance and clarity.')}],cue:b('मूल पाठ में अर्जुन की परिणति स्वाश्रय की मिसाल है। इसे विजय-घोषणा नहीं, आश्रय बदलने की कहानी की तरह जोड़ें।','The source text treats Arjuna’s movement as an example of swashraya. Use it as a narrative of changed reliance, not a victory claim.')},
        {kind:'dark',phase:b('05 · स्वाश्रय','05 · Swashraya'),tag:b('यात्रा का मुख्य सूत्र','The central thread returns'),title:b('स्वाश्रय:\nस्वयं में स्थिति','Swashraya:\nabiding in oneself'),lead:b('वस्तु, भूमिका, उपलब्धि—यहाँ तक कि शांति के अनुभव—को भी स्थायी आधार न बनाना। कर्म रुकता नहीं; आश्रय की पकड़ बदलती है।','Neither objects, roles, achievements, nor even a prized experience of peace need become our ultimate support. Action does not cease.'),stamp:b('स्व','SELF'),cue:b('इसे श्रोताओं पर अंतिम उपलब्धि की घोषणा की तरह न रखें। अब तक की यात्रा से पूछें: किस आधार की पकड़ सबसे स्पष्ट दिखी?','Do not announce attainment for the audience. Return to the inquiry: which reliance has become clearest to them?')},
        {phase:b('समापन','Closing'),tag:b('अगला प्रश्न श्रोताओं से','Let the next question come from participants'),title:b('आज कौन-सा आश्रय\nआपने पहचाना?','Which reliance\ndid you notice today?'),lead:b('एक ईमानदार उदाहरण पर्याप्त है। उसी से अगली बातचीत और अगला छोटा प्रयोग शुरू हो सकता है।','One honest example is enough to begin the next conversation and the next small experiment.'),cards:[{h:b('किस पर मेरा सुख टिकता है?','What holds my happiness?'),p:b('पराश्रय की जाँच।','Examine dependence.')},{h:b('मैं किसे “यह” कहता हूँ?','What do I call “this”?'),p:b('दृश्य–द्रष्टा का विवेक।','Discern the seen and the seer.')},{h:b('आज मेरा कर्म किस हेतु है?','What serves as my aim in action?'),p:b('उद्देश्य की दिशा।','Examine the direction of purpose.')}],cue:b('समापन में सार सुनाने के बजाय एक प्रश्न सुनें। उत्तर के आधार पर पहले सूत्र को फिर खोलें या अगली चर्चा की दिशा चुनें।','End by hearing a question rather than reciting a summary. Use it to reopen the first thread or choose the next inquiry.')}
      ];

      const deck=document.getElementById('deck'),dotsWrap=document.getElementById('dots'),fill=document.getElementById('progressFill'),count=document.getElementById('slideCount');
      const langBtn=document.getElementById('langBtn'),notesBtn=document.getElementById('notesBtn'),fullBtn=document.getElementById('fullBtn'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),keys=document.getElementById('keys');
      const params=new URLSearchParams(location.search);let lang=params.get('lang')==='en'?'en':'hi';let index=Math.max(0,Math.min(slides.length-1,(parseInt(params.get('slide'),10)||1)-1));let touchX=0,touchY=0;
      const tx=value=>typeof value==='string'?value:value?.[lang]||'';
      const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const html=value=>escape(tx(value)).replace(/\n/g,'<br>');
      const pad=value=>String(value).padStart(2,'0');
      function visual(slide){
        if(slide.map)return '<div class="artifact map">'+slide.map.map(row=>'<div class="map-row"><b>'+html(row.from)+'</b><i aria-hidden="true">→</i><b>'+html(row.to)+'</b></div>').join('')+'<p class="map-caption">'+html(slide.mapCaption)+'</p></div>';
        if(slide.cards)return '<div class="artifact">'+slide.cards.map((card,i)=>'<div class="artifact-card '+(i===slide.cards.length-1?'accent':'')+'"><strong>'+html(card.h)+'</strong><p>'+html(card.p)+'</p></div>').join('')+'</div>';
        return '<div class="artifact"><div class="stamp" aria-hidden="true">'+html(slide.stamp)+'</div></div>';
      }
      function renderSlides(){
        deck.innerHTML=slides.map((slide,i)=>'<section class="slide '+(slide.kind||'')+(slide.kind==='title'||slide.kind==='divider'||slide.kind==='dark'?' dark':'')+(i===index?' active':'')+'" aria-hidden="'+(i!==index)+'" aria-labelledby="s'+(i+1)+'-title"><span class="folio">'+html(slide.phase)+' · '+pad(i+1)+'</span><div class="slide-grid"><div class="slide-copy"><div class="eyebrow">'+html(slide.tag)+'</div><h1 id="s'+(i+1)+'-title">'+html(slide.title)+'</h1><p class="lead">'+html(slide.lead)+'</p></div>'+visual(slide)+'</div><aside class="notes"><b>'+(lang==='hi'?'वक्ता संकेत':'SPEAKER CUE')+'</b>'+html(slide.cue)+'</aside></section>').join('');
        document.body.dataset.lang=lang;document.documentElement.lang=lang;
        deck.setAttribute('aria-label',lang==='hi'?'गीता का मुख्य उद्देश्य — संवाद प्रस्तुति':'The Gita’s Core Objective — conversation deck');
        langBtn.textContent=lang==='hi'?'EN':'हिं';langBtn.setAttribute('aria-label',lang==='hi'?'Switch to English':'हिन्दी में बदलें');
        notesBtn.setAttribute('aria-label',lang==='hi'?'वक्ता संकेत दिखाएँ':'Show speaker cues');notesBtn.title=lang==='hi'?'वक्ता संकेत (N)':'Speaker cues (N)';
        fullBtn.setAttribute('aria-label',lang==='hi'?'पूर्ण स्क्रीन':'Fullscreen');fullBtn.title=lang==='hi'?'पूर्ण स्क्रीन (F)':'Fullscreen (F)';
        prevBtn.setAttribute('aria-label',lang==='hi'?'पिछली स्लाइड':'Previous slide');nextBtn.setAttribute('aria-label',lang==='hi'?'अगली स्लाइड':'Next slide');
        keys.textContent=lang==='hi'?'← → चलाएँ · N संकेत · F पूर्ण स्क्रीन · L भाषा':'← → navigate · N cues · F fullscreen · L language';
        [...dotsWrap.children].forEach((dot,i)=>dot.setAttribute('aria-label',(lang==='hi'?'स्लाइड ':'Slide ')+(i+1)));
        show(index,false);
      }
      function syncURL(){const url=new URL(location.href);url.searchParams.set('slide',index+1);url.searchParams.set('lang',lang);history.replaceState({},'',url)}
      function show(next,sync=true){
        index=Math.max(0,Math.min(slides.length-1,next));document.body.dataset.theme=['title','divider','dark'].includes(slides[index].kind)?'dark':'light';document.querySelectorAll('.slide').forEach((slide,i)=>{slide.classList.toggle('active',i===index);slide.setAttribute('aria-hidden',i===index?'false':'true');if(i===index)slide.scrollTop=0});
        [...dotsWrap.children].forEach((dot,i)=>{dot.classList.toggle('active',i===index);dot.setAttribute('aria-current',i===index?'step':'false')});
        count.textContent=pad(index+1)+' / '+pad(slides.length);fill.style.width=((index+1)/slides.length*100)+'%';
        prevBtn.disabled=index===0;nextBtn.disabled=index===slides.length-1;
        document.title=(lang==='hi'?'गीता का मुख्य उद्देश्य':'The Gita’s Core Objective')+' · '+(index+1)+'/'+slides.length;
        if(getComputedStyle(dotsWrap).display!=='none')dotsWrap.children[index]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
        if(sync)syncURL();
      }
      function setLanguage(next){lang=next;renderSlides();syncURL()}
      slides.forEach((_,i)=>{const dot=document.createElement('button');dot.type='button';dot.className='dot';dot.addEventListener('click',()=>show(i));dotsWrap.appendChild(dot)});
      langBtn.addEventListener('click',()=>setLanguage(lang==='hi'?'en':'hi'));
      notesBtn.addEventListener('click',()=>document.body.classList.toggle('show-notes'));
      fullBtn.addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());
      prevBtn.addEventListener('click',()=>show(index-1));nextBtn.addEventListener('click',()=>show(index+1));
      document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey)return;const key=event.key;if(['ArrowRight','PageDown',' '].includes(key)){event.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(key)){event.preventDefault();show(index-1)}else if(key==='Home')show(0);else if(key==='End')show(slides.length-1);else if(key.toLowerCase()==='l')setLanguage(lang==='hi'?'en':'hi');else if(key.toLowerCase()==='n')document.body.classList.toggle('show-notes');else if(key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()});
      document.addEventListener('touchstart',event=>{touchX=event.changedTouches[0].clientX;touchY=event.changedTouches[0].clientY},{passive:true});
      document.addEventListener('touchend',event=>{const dx=event.changedTouches[0].clientX-touchX,dy=event.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)show(index+(dx<0?1:-1))},{passive:true});
      renderSlides();
    })();
  </script>
</body>
</html>
